    ApiKey:
      type: object
      properties:
        id: { type: integer }
        keyPrefix: { type: string, example: sk_live_a1b2c3d4 }
        label: { type: string }
        status: { type: string, enum: [active, revoked] }
        propertyId: { type: [integer, 'null'] }
        scopes:
          type: array
          items: { type: string }
        expiresAt: { type: [string, 'null'] }
        lastUsedAt: { type: [string, 'null'] }
        revokedAt: { type: [string, 'null'] }
        dateCreated: { type: [string, 'null'] }
        dateModified: { type: [string, 'null'] }
    ApiKeyCreate:
      type: object
      required: [scopes]
      properties:
        label: { type: string, example: Production server }
        scopes:
          type: array
          minItems: 1
          items: { type: string }
          example: ['event:sale', 'ledger:conversions:read']
          description: |
            Event scopes: `event:*` for every event, or `event:{slug}` for one
            event type. `*` is also accepted and grants what `event:*` grants.

            Ledger and webhook scopes: `ledger:conversions:read`,
            `ledger:transactions:read`, `ledger:obligations:read`,
            `ledger:payouts:read`, `webhook-subscriptions:read` and
            `webhook-subscriptions:manage`. Each is granted only by its exact
            name. `*`, `event:*` and wildcards such as `ledger:*` grant none
            of them.

            An older resource scope such as `programs:read` or
            `conversions:read` is refused with 400.
        expiresAt:
          type: string
          description: ISO 8601 date in the future. Omit for a key that never expires.
        propertyId:
          type: integer
          minimum: 1
          description: |
            Binds the key to this Property of the organization. Siren stamps
            it on the key's events, the key reads only that store's
            conversions, transactions and obligations, and it is refused on
            payouts and webhook subscriptions with 403 `store_key_not_allowed`.
    ApiKeyScopeEntry:
      type: object
      description: One scope a new API key may be given, as `GET /api-keys/scopes` lists it.
      properties:
        scope: { type: string, description: The scope string to pass to `createApiKey`., example: 'ledger:conversions:read' }
        resource: { type: string, description: The group the scope belongs to., example: ledger }
        action: { type: string, description: What the scope allows within its group., example: 'conversions:read' }
        label: { type: string, example: Read conversions }
    ErrorCode:
      type: string
      description: |
        The machine-readable `error.code` Siren sends beside a refusal's
        message. Branch on the code, not the message, which can change. A
        reply from an older or newer Siren deployment may carry no code, or a
        code this list lacks.

        401: `site_disconnected` when the organization revoked or deleted the
        connected site's connection, and `api_key_not_accepted` when the route
        takes a dashboard session and not an API key.

        403: `missing_scope` and `store_key_not_allowed` refuse an API key.
        `field_not_allowed`, `pending_status_required`, `user_type_not_allowed`,
        `program_not_on_site`, `collaborator_not_on_site`,
        `site_filter_required`, `report_not_allowed` and `not_permitted` mean
        Siren's policy refused the request, so sending it again fails again.
        `migration_closed`, `plan_required`, `admin_required` and
        `email_confirmation_required` lift once the organization changes.

        409: `code_held` when someone already holds a tracking or coupon code,
        `mapping_exists`, `hold_no_credit` and `hold_token_in_use` when Siren
        refuses a store credit hold, `hold_currency_not_at_store` and
        `currency_resolution_required`.

        422: `invalid_currency_resolution`, `collaborator_deletion_refused` and
        `reserved_address`. 503: `plan_unavailable` when Siren could not read
        the organization's plan.
      enum:
        - site_disconnected
        - api_key_not_accepted
        - missing_scope
        - store_key_not_allowed
        - field_not_allowed
        - pending_status_required
        - user_type_not_allowed
        - program_not_on_site
        - collaborator_not_on_site
        - site_filter_required
        - report_not_allowed
        - not_permitted
        - migration_closed
        - plan_required
        - admin_required
        - email_confirmation_required
        - code_held
        - mapping_exists
        - hold_no_credit
        - hold_token_in_use
        - hold_currency_not_at_store
        - currency_resolution_required
        - invalid_currency_resolution
        - collaborator_deletion_refused
        - reserved_address
        - plan_unavailable
    Error:
      type: object
      description: |
        `error` is polymorphic. Some checks return a plain string message.
        Most return an object with `message`, an optional stable `code`, and
        `context`. A failed validation sets `context.type` to
        `VALIDATION_FAILED` and lists each broken rule in
        `context.failedValidations`. Clients must handle both shapes.

        An API key's refusals carry a stable `code`: `api_key_not_accepted`
        (401) when the route takes a session and not a key, `missing_scope`
        (403) when the key holds none of the route's scopes, with
        `context.scope` and `context.anyOf`, and `store_key_not_allowed`
        (403) when a key bound to one store asks for payouts or webhook
        subscriptions, with `context.propertyId`. Branch on the code, not the
        message.
      properties:
        error:
          oneOf:
            - type: string
            - type: object
              properties:
                message: { type: string }
                code:
                  type: string
                  description: A stable code, one of the `ErrorCode` values when Siren sends one this document lists.
                context:
                  type: [object, array]
                  description: Extra detail. PHP sends an empty context as `[]`.
                  properties:
                    type: { type: string, example: VALIDATION_FAILED }
                    failedValidations:
                      type: array
                      items:
                        type: object
                        properties:
                          field: { type: string }
                          message: { type: string }
                          type: { type: string, example: REQUIRED }
                          context: { type: object, additionalProperties: true }
    Record:
      type: object
      description: |
        A Siren record. The fields present depend on the resource and on the
        `fields` the request asked for.
      additionalProperties: true
    SiteName:
      type: string
      pattern: '^[A-Za-z0-9_-]+$'
      description: |
        A plain type, platform or token: letters, digits, underscores and
        hyphens. Cloud refuses an `@` qualifier or a comma from a connected
        site, and adds the site's Property itself.
    Alias:
      type: object
      properties:
        code: { type: string, example: SAVE10 }
        type: { type: string, description: 'Qualified for a connected site, as in coupon@property:5. The SDK answers the plain type and the Property in propertyId.' }
        collaboratorId: { type: integer }
        dateIssued: { type: string }
    Enrollment:
      type: object
      properties:
        collaboratorId: { type: integer }
        programId: { type: integer }
    GroupMember:
      type: object
      required: [collaboratorId]
      properties:
        collaboratorId: { type: integer, minimum: 1 }
        metadata:
          oneOf:
            - type: object
              additionalProperties: true
            - type: string
    ForwardedEventEnvelope:
      type: object
      description: |
        The versioned envelope a connected site forwards to
        `POST /event/{eventSlug}`, as Siren's `EventWireFormat` reads it.
        The slug is one of the 28 forwarded slugs, such as `sale-triggered`
        or `product-deleted`, and names the shape of `data`. Cloud claims
        each event once per Property, on its natural key or on `eventId`,
        and answers a resend with `status: duplicate`.
      required: [version, eventId, origin, occurredAt, data]
      properties:
        version: { type: integer, const: 1 }
        eventId:
          type: string
          format: uuid
          description: The site's id for this event, the same on every try of it.
        origin: { type: string, const: site }
        occurredAt:
          type: [string, 'null']
          description: ISO 8601 with a `Z` or `+hh:mm` offset, or `null`.
          example: '2026-11-12T09:30:00+00:00'
        data:
          type: object
          additionalProperties: true
          description: The event's fields. Each slug's codec names the keys it takes.
        optional:
          type: object
          additionalProperties: true
          description: Fields a slug takes beside `data`, such as a refund's `refundKind`.
    OAuthClientRegistration:
      type: object
      description: The registered client, as RFC 7591 names its fields.
      required: [client_id]
      properties:
        client_id: { type: string }
        client_name: { type: string }
        redirect_uris:
          type: array
          items: { type: string, format: uri }
        grant_types:
          type: array
          items: { type: string }
        token_endpoint_auth_method: { type: string, example: none }
        scope: { type: string }
        software_id: { type: string, enum: [siren-wordpress, siren-medusa] }
    OAuthToken:
      type: object
      description: A token pair, as RFC 6749 names its fields.
      required: [access_token, refresh_token]
      properties:
        access_token: { type: string }
        token_type: { type: string, example: Bearer }
        expires_in: { type: integer, example: 3600 }
        scope: { type: string }
        refresh_token:
          type: string
          description: The next refresh token. Cloud rotates it on every refresh, so the one sent is spent.
    OAuthError:
      type: object
      description: |
        The RFC 6749 and RFC 7591 error envelope. A refresh refused with
        `invalid_grant` or `invalid_client` means the grant is gone and the
        site connects again.
      required: [error]
      properties:
        error:
          type: string
          enum:
            - invalid_request
            - invalid_grant
            - invalid_client
            - invalid_scope
            - unsupported_grant_type
            - invalid_client_metadata
            - invalid_redirect_uri
        error_description: { type: string }
    ConnectPlan:
      type: object
      required: [status, capabilities, trial, paidPlan, pricingUrl]
      properties:
        status: { type: string, enum: [active, lapsed, none, unrestricted] }
        capabilities:
          type: array
          items: { type: string }
        trial:
          type: object
          required: [active, plan, endsAt, ended]
          properties:
            active: { type: boolean }
            plan: { type: [string, 'null'], description: '`essentials`, `plus` or `pro` during a trial.' }
            endsAt: { type: [string, 'null'], format: date-time }
            ended: { type: boolean }
        paidPlan: { type: [string, 'null'] }
        pricingUrl: { type: string, format: uri }
    ConnectorWebhook:
      description: The site's own webhook subscription, with its Property.
      allOf:
        - { $ref: '#/components/schemas/WebhookSubscription' }
        - type: object
          required: [property]
          properties:
            property:
              type: object
              properties:
                id: { type: integer }
                siteUrl: { type: string, format: uri }
    ConnectorWebhookWithSecret:
      description: The subscription with its new signing secret, shown only in this answer.
      allOf:
        - { $ref: '#/components/schemas/ConnectorWebhook' }
        - type: object
          required: [signingSecret]
          properties:
            signingSecret: { type: string }
    ConnectorWebhookDelivery:
      type: object
      description: One delivery to the site's subscription. Dates are `Y-m-d H:i:s` with no offset.
      properties:
        id: { type: integer }
        webhookSubscriptionId: { type: integer }
        eventType: { type: string }
        eventId: { type: [string, 'null'] }
        payload: { type: [object, 'null'], additionalProperties: true }
        status: { type: string }
        attemptCount: { type: integer }
        httpStatusCode: { type: [integer, 'null'] }
        responseBody: { type: [string, 'null'] }
        errorMessage: { type: [string, 'null'] }
        nextRetryAt: { type: [string, 'null'] }
        deliveredAt: { type: [string, 'null'] }
        dateCreated: { type: [string, 'null'] }
        dateModified: { type: [string, 'null'] }
    CreditBalance:
      type: object
      properties:
        collaboratorId: { type: integer }
        currency: { type: string }
        balance: { type: integer }
        reserved: { type: integer }
        available: { type: integer }
        held:
          type: integer
          description: Credit a store's migration imported that waits for an admin's approval. Not part of the balance.
    CreditHold:
      type: object
      properties:
        id: { type: integer }
        collaboratorId: { type: integer }
        currency: { type: string }
        amount: { type: integer }
        status: { type: string, enum: [active, settled, released, expired] }
        reference: { type: string, example: 'hold:woocommerce@property:5:0b6f3c2e-8a1d-4c55-9a0e-0d6c1b7f4e21' }
        idempotencyKey: { type: [string, 'null'] }
        expiresAt: { type: string }
        createdDate: { type: string }
    HoldReference:
      type: string
      pattern: '^hold:[A-Za-z0-9_-]+:[A-Za-z0-9_-]+$'
      description: A checkout session's hold reference, `hold:{platform}:{token}`, as a site sends it.
      example: hold:woocommerce:0b6f3c2e-8a1d-4c55-9a0e-0d6c1b7f4e21
    Mapping:
      type: object
      properties:
        localId: { type: integer }
        localType: { type: string, example: collaborator }
        externalId: { type: string }
        externalType: { type: string, description: 'Qualified for a connected site, as in wordpress_user@property:5. The SDK answers the plain type and the Property in propertyId.' }
    TransactionDetail:
      type: object
      required: [name, value]
      properties:
        name: { type: string }
        description: { type: string }
        type: { type: string, example: credit }
        value: { type: integer, description: Per-unit value in minor units. }
        quantity: { type: integer, default: 1 }
        units: { type: string, example: USD }
        attributes: { type: object, additionalProperties: true }
    ListEnvelope:
      type: object
      required: [items, total, page, perPage, totalPages]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Record' }
        total: { type: integer, description: Records across all pages. }
        page: { type: integer, description: 'floor(offset / number) + 1' }
        perPage: { type: integer, description: The page size used. }
        totalPages: { type: integer }
    ConditionSet:
      type: object
      description: One condition set. Key order is asserted by the tests.
      required: [id, name, conditions, sourceKey, lastCheckedAt, archivedAt]
      properties:
        id: { type: integer }
        name: { type: string }
        conditions:
          type: array
          description: The conditions in the order the merchant set them, each already checked.
          items:
            type: object
            required: [id, args]
            properties:
              id: { type: string, description: 'A condition id from `GET /condition-sets/conditions`.' }
              args:
                type: object
                additionalProperties: true
                description: The values for that condition's `args` definitions.
        sourceKey:
          type: [string, 'null']
          description: |
            Which recipe or source made the set, or null for one a person
            made. The test asserts null for a set made by hand. The string
            form is read from the type hint only, so x-unconfirmed.
          x-unconfirmed: true
        lastCheckedAt:
          type: [string, 'null']
          format: date-time
          description: ATOM form, or null before the first check.
        archivedAt:
          type: [string, 'null']
          format: date-time
          description: ATOM form, or null while the set is not archived.
        usedBy:
          type: array
          description: Present only on `GET /condition-sets?usedBy=1`.
          items: { $ref: '#/components/schemas/ConditionSetUse' }

    ConditionSetUse:
      type: object
      required: [type, id, name, enabled, onlyWhileMatching]
      properties:
        type:
          type: string
          description: |
            The kind of record. The code names `notification_rule` and
            `enroller`. A use lister may name another, and the screens call
            any other a rule, so the enum is open.
          examples: [notification_rule, enroller]
        id: { type: integer }
        name: { type: string }
        enabled:
          type: boolean
          description: Whether the record acts now, a rule that is on or an enroller that is active.
        onlyWhileMatching:
          type: [boolean, 'null']
          description: For an enroller, whether "Only while they match" is on. Null for a record with no such setting.
        status:
          type: string
          description: |
            The record's own status word, such as an enroller's `draft`,
            `active` or `inactive`. The key is left out for a record that has
            none.

    ConditionSetUses:
      type: object
      required: [usedBy, uses]
      properties:
        usedBy:
          type: array
          items: { $ref: '#/components/schemas/ConditionSetUse' }
        uses:
          type: object
          description: |
            Rule ids by consumer id, such as `{"notifications": [3, 4]}` or
            `{"enrollers": [8]}`. An empty object when nothing uses the set.
          additionalProperties:
            type: array
            items: { type: integer }

    ConditionDefinition:
      type: object
      required: [id, name, description, summaryTemplate, capability, args]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        summaryTemplate: { type: string }
        capability:
          type: [string, 'null']
          description: |
            The plan capability the condition needs, or null. The interface
            says `?string` and no test asserts a value, so x-unconfirmed.
          x-unconfirmed: true
        args:
          type: array
          items: { $ref: '#/components/schemas/ArgDefinition' }

    ArgDefinition:
      type: object
      description: |
        One argument a piece takes. The same shape `GET /notifications/triggers`
        gives. Source: lib/RuleTriggers/Core/Models/ArgDefinition.php, and the
        triggers test asserts it equals `toArray()`.
      required: [key, type, label, min, max, default, choices, required, recordType]
      properties:
        key: { type: string }
        type:
          type: string
          enum: [int, money, currency, choice, ids, records, products, answer_tests]
        label: { type: string }
        min: { type: [integer, 'null'], description: 'The smallest number, or the fewest ids. Null for no limit.' }
        max: { type: [integer, 'null'], description: 'The largest number, or the most ids. Null for no limit.' }
        default:
          description: The value a new piece starts with, or null.
          oneOf:
            - type: integer
            - type: string
            - type: array
              items: { type: integer }
            - type: 'null'
        choices:
          type: array
          description: For a `choice`, each key and label in the order shown. A looked-up choice has none, and the editor asks `GET /rule-triggers/{id}/args/{key}/choices`.
          items:
            type: object
            required: [key, label]
            properties:
              key: { type: string }
              label: { type: string }
        required: { type: boolean }
        recordType:
          type: [string, 'null']
          description: |
            For `ids` and `records`, the kind of record (`program`,
            `distributor`, `collaborator_group` or `property` for `records`).
            Always `product` for `products`. Null otherwise.
        unit:
          type: string
          description: What a number counts, such as `days` or `days ago`. The key is present only when a unit is set.

    ConditionSetMatchCount:
      type: object
      required: [count, more]
      properties:
        count: { type: integer, description: "Collaborators that match, up to the cap." }
        more: { type: boolean, description: True when the count stopped at the cap. }

    ConditionSetPeoplePage:
      type: object
      required: [collaboratorIds, nextCursor, unjudged]
      properties:
        collaboratorIds:
          type: array
          description: At most `limit` matching collaborator ids, lowest first.
          items: { type: integer }
        nextCursor:
          type: [integer, 'null']
          description: The cursor for the next request, or null at the end.
        unjudged:
          type: integer
          description: How many people on the tested pages could not be checked.

    EnrollerPlaceIds:
      type: array
      items: { type: integer }

    Enroller:
      type: object
      description: |
        An enroller as the list shows it. The key order is asserted by the
        list test. A target is named by the list it sits in. A deleted
        target is left out. Source: EnrollerPresenter.php.
      required:
        - id
        - name
        - status
        - enabled
        - triggerId
        - triggerArgs
        - addProgramIds
        - addDistributorIds
        - addGroupIds
        - removeProgramIds
        - removeDistributorIds
        - removeGroupIds
        - addForDays
        - onlyWhileMatching
        - dateCreated
        - dateModified
        - needsFix
      properties:
        id: { type: integer }
        name: { type: string }
        status: { type: string, enum: [draft, active, inactive] }
        enabled:
          type: boolean
          description: True only for an active enroller. Kept for callers written before statuses.
        triggerId: { type: string, description: 'A moment id from `GET /enroller-triggers`, such as `approved` or `condition_set_entered`.' }
        triggerArgs:
          type: object
          additionalProperties: true
          description: 'The moment''s settings. Always a JSON object, empty as {}. A condition set moment holds {"set": id}.'
        addProgramIds: { $ref: '#/components/schemas/EnrollerPlaceIds' }
        addDistributorIds: { $ref: '#/components/schemas/EnrollerPlaceIds' }
        addGroupIds: { $ref: '#/components/schemas/EnrollerPlaceIds' }
        removeProgramIds: { $ref: '#/components/schemas/EnrollerPlaceIds' }
        removeDistributorIds: { $ref: '#/components/schemas/EnrollerPlaceIds' }
        removeGroupIds: { $ref: '#/components/schemas/EnrollerPlaceIds' }
        addForDays:
          type: [integer, 'null']
          description: The time limit in days, or null for none. The list test asserts 7. The null form is read from the presenter's use, so x-unconfirmed.
          x-unconfirmed: true
        onlyWhileMatching:
          type: boolean
          description: Whether people leave again when they stop matching.
        dateCreated: { type: string, description: 'Format Y-m-d H:i:s, not ISO 8601. The time zone is not stated in the code read, so x-unconfirmed.', x-unconfirmed: true }
        dateModified: { type: string, description: 'Format `Y-m-d H:i:s`. Same note as `dateCreated`.', x-unconfirmed: true }
        needsFix:
          type: [string, 'null']
          description: |
            Why the stored settings need a fix, in a manager's words, or null.
            The test asserts null for settings that fit. The string form is
            code only, so x-unconfirmed.
          x-unconfirmed: true

    EnrollerDetail:
      allOf:
        - $ref: '#/components/schemas/Enroller'
        - type: object
          required: [applyWaiting]
          properties:
            applyWaiting:
              description: |
                The run that waits for the condition set's first check, or
                null. The shape is read from code (EnrollerRuns::waiting),
                so x-unconfirmed.
              x-unconfirmed: true
              oneOf:
                - $ref: '#/components/schemas/EnrollerRunWaiting'
                - type: 'null'

    EnrollerPage:
      allOf:
        - $ref: '#/components/schemas/ListEnvelope'
        - type: object
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/Enroller' }

    EnrollerRunWaiting:
      type: object
      required: [setId, kind, since, joined]
      properties:
        setId: { type: integer, description: The set whose first check it waits for. }
        kind: { type: string, enum: [run_now, already_match] }
        since: { type: string, format: date-time, description: ATOM form. }
        joined: { type: boolean, description: True when the enroller was already waiting. }

    EnrollerRunEstimate:
      type: object
      description: Key set asserted by EnrollerRunNowCountFlowTest.
      required: [matching, willMove, renews, alreadyThere, capped, liveJobId, waitsForCheck, waiting, message]
      properties:
        matching: { type: integer, description: "People the count looked at, up to 5000 when `capped`." }
        willMove: { type: integer, description: People the run would add somewhere or take out of somewhere. }
        renews: { type: integer, description: People it would not move but whose time limit it would start again. }
        alreadyThere: { type: integer, description: 'matching - willMove - renews, not below 0.' }
        capped: { type: boolean, description: True when more people match than `matching` says. }
        liveJobId:
          type: [string, 'null']
          description: The run of this enroller queued or running now. The test asserts null. A string form is read from the model's type, so x-unconfirmed.
          x-unconfirmed: true
        waitsForCheck: { type: boolean, description: "True when the set has had no check, so a run would wait for it." }
        waiting:
          description: The enroller's wait when it already waits, else null.
          oneOf:
            - $ref: '#/components/schemas/EnrollerRunWaiting'
            - type: 'null'
        message:
          type: string
          description: |
            What the count found, in a manager's words, such as "About 1 of
            the 2 people who match now would move." While the enroller waits
            it is "Siren hasn't checked this condition set yet. This
            enroller will act on the people who match once Siren has checked
            this set, which can take up to a day, so there's nothing to run
            now."

    EnrollerRunStarted:
      type: object
      required: [jobId, joined, matching, waiting]
      properties:
        jobId:
          type: [string, 'null']
          description: The job `GET /jobs/{jobId}` reads. Null when the enroller joined a wait for its set's first check.
        joined: { type: boolean, description: "True when a run was already queued, running or waiting, and this is that run." }
        matching:
          type: [integer, 'null']
          description: People who matched when it was asked. Null when it joined a wait.
        waiting:
          description: Null when a job was queued.
          oneOf:
            - $ref: '#/components/schemas/EnrollerRunWaiting'
            - type: 'null'

    EnrollerLogPage:
      allOf:
        - $ref: '#/components/schemas/ListEnvelope'
        - type: object
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/EnrollerFiring' }

    EnrollerFiring:
      type: object
      description: |
        One log line. The stored structure plus one finished sentence. The
        sentence never names the person. Source: EnrollerFiringPresenter.php.
        The test asserts `id`, `collaboratorId`, `happenedAt` and `message`.
        Every other field is read from the presenter, so is x-unconfirmed.
      required: [id, enrollerId, collaboratorId, triggerId, depth, outcome, reason, errorClass, happenedAt, finishedAt, places, notes, missing, message, dates]
      properties:
        id: { type: integer }
        enrollerId: { type: integer, x-unconfirmed: true }
        collaboratorId: { type: [integer, 'null'], description: "Null when the row names no collaborator, for example `not_a_collaborator`." }
        triggerId: { type: string, x-unconfirmed: true }
        depth: { type: integer, description: 'Chain depth of enroller steps. The limit is EnrollerFiringContext::DEPTH_LIMIT.', x-unconfirmed: true }
        outcome: { type: string, enum: [started, acted, unchanged, skipped, failed], x-unconfirmed: true }
        reason:
          type: [string, 'null']
          description: |
            Why it skipped or what kind of row it is. Known values:
            not_a_collaborator, not_active, chain_limit, nothing_to_do,
            settings_not_taken, plan_lacks_moment, guest, several_accounts,
            staff_account, buyers_not_here, email_in_use,
            buyer_purchases_not_counted, settings_name_missing,
            settings_not_met, settings_no_longer_fit, time_limit_ended,
            undone, loop_guard, run_finished, run_waits_for_check, moved,
            enroller_deleted, delete_failed. A newer build may add more, so
            treat the list as open.
          x-unconfirmed: true
        errorClass: { type: [string, 'null'], x-unconfirmed: true }
        happenedAt: { type: string, description: 'The row''s fired time, `Y-m-d H:i:s`.' }
        finishedAt: { type: [string, 'null'], description: 'Null while it has not finished. `Y-m-d H:i:s`.', x-unconfirmed: true }
        places:
          type: array
          items: { $ref: '#/components/schemas/EnrollerFiringPlace' }
          x-unconfirmed: true
        notes:
          type: array
          description: 'Note codes such as `time_limit_not_applied`, `undo_not_applied`, `made_record`, `not_linked`, `set_changed`, `stopped_before_check`.'
          items: { type: string }
          x-unconfirmed: true
        missing:
          type: array
          description: Records its settings named that the organization no longer had when it fired.
          items:
            type: object
            properties:
              key: { type: string }
              recordType: { type: string }
              ids: { type: array, items: { type: integer } }
          x-unconfirmed: true
        message:
          type: string
          description: One finished sentence for a manager, such as "Added to Standard Referral and the group “New this month”." A message with no sentence reads "Nothing happened."
        dates:
          type: array
          description: Each date the message holds, so a screen can show the reader's local day.
          items:
            type: object
            properties:
              text: { type: string }
              at: { type: string, description: 'The stored end, `Y-m-d H:i:s`, UTC.' }
          x-unconfirmed: true

    EnrollerFiringPlace:
      type: object
      description: One place a firing acted on. Extra stored keys such as `endsAt`, `keptIn`, `whileEnding`, `stillIn` and `groupId` may appear, and this fragment does not list them.
      properties:
        type: { type: string, enum: [program, distributor, collaborator_group] }
        id: { type: integer }
        direction: { type: string, enum: [add, remove] }
        result:
          type: string
          enum: [added, already_there, removed, not_there, missing, group_bound, on_both_lists, renewed, still_held, put_back]
        name: { type: [string, 'null'], description: "The place's name now, or null when the place is gone." }
        groupName: { type: [string, 'null'], description: Present only on a place with a `groupId`. }
        groupId: { type: integer }
        endsAt: { type: string }

    EnrollerTrigger:
      type: object
      description: |
        One moment an enroller can start on. `args` are the trigger's own
        settings and then the ones other modules add. The tests assert `args`
        and the `buyers` flag. The other fields are read from the controller.
      required: [id, name, description, group, canStopMatching, entitled, requiredPlan, mayAwaitReview, args]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        group: { type: string, x-unconfirmed: true }
        canStopMatching:
          type: boolean
          description: Whether the moment can undo, so "Only while they match" can be used.
          x-unconfirmed: true
        entitled:
          type: boolean
          description: Whether the organization's plan grants what the moment needs. A moment the plan does not grant is still listed.
          x-unconfirmed: true
        requiredPlan:
          type: [string, 'null']
          description: The lowest plan that grants the moment, or null for a moment every plan may use. On Siren Cloud a custom event needs Pro.
          x-unconfirmed: true
        mayAwaitReview:
          type: boolean
          description: True when the person the moment names may still be awaiting review. Today that is "Applied".
          x-unconfirmed: true
        buyersHere:
          type: boolean
          description: |
            Present only on a purchase moment that names a store customer and
            no collaborator. True on a standalone WordPress store, where a
            purchase adds its buyer, and false on Siren Cloud and on a store
            connected to it. A difference between WordPress and Siren Cloud.
        args:
          type: array
          items: { $ref: '#/components/schemas/ArgDefinition' }

    EnrollerTriggerList:
      type: object
      required: [items, buyers]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/EnrollerTrigger' }
        buyers:
          type: boolean
          description: Whether a buyer can exist in the organization, for the collaborator list's buyer filter and badge.
  responses:
    PaginatedList:
      description: |
        One page of records in Siren's list envelope. The total also travels
        in the `x-siren-estimated-count` response header.
      headers:
        x-siren-estimated-count: { $ref: '#/components/headers/XSirenEstimatedCount' }
      content:
        application/json:
          schema:
            type: object
            properties:
              items:
                type: array
                items: { type: object, additionalProperties: true }
              total: { type: integer }
              page: { type: integer }
              perPage: { type: integer }
              totalPages: { type: integer }
    Queued:
      description: |
        The organization's engine is paused, so Siren queued the event and
        will process it once the organization can run again. Do not resend it.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/QueuedOutcome' }
    Unauthorized:
      description: |
        Missing, invalid, expired or revoked credential. A valid API key sent
        to a route that takes a session gets `error.code`
        `api_key_not_accepted`. A connected site whose connection the
        organization revoked or deleted gets `site_disconnected`.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: |
        The credential may not do this. For an API key, `error.code`
        `missing_scope` means the key holds none of the route's scopes,
        `error.context.scope` names one and `error.context.anyOf` lists every
        scope that opens the route. `store_key_not_allowed` means a key bound
        to one store asked for payouts or webhook subscriptions, which are
        not kept by store. A policy code, such as `field_not_allowed` with
        `error.context.param` naming the field, means Siren refuses the
        request itself, so sending it again fails again. `ErrorCode` lists
        every code.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Record:
      description: A record, or the result of an action.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Record' }
    Deleted:
      description: Removed, or nothing matched.
      content:
        application/json:
          schema:
            type: object
            properties:
              deleted: { type: boolean, const: true }
    BadRequest:
      description: A query parameter is out of range, such as `number` below 1 or a negative `offset`.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: The record would duplicate one that exists.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ValidationError:
      description: |
        The request failed validation (400). `error.context.type` is
        `VALIDATION_FAILED` and `error.context.failedValidations` names each
        field.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    RateLimited:
      description: |
        Too many requests, or the organization's engine is paused and its
        event queue is full.
      headers:
        Retry-After:
          schema: { type: integer }
          description: Seconds to wait before retrying.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    OAuthRefused:
      description: |
        Cloud refused the OAuth call, with the RFC error envelope. The SDK
        raises it as `OAuthError`.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/OAuthError' }
    ConditionSetForbidden:
      description: |
        403 for a caller the route refuses. With a plan that lacks the
        `audience-conditions` capability, `error.code` is `plan_required` and
        `error.context` is `{capability: "audience-conditions", plan: "plus"}`,
        with the message "Your plan does not include this feature." A caller
        who may not read programs, such as a collaborator, gets 403 with
        `error.code` `not_permitted`. The plan check runs first.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ConditionSetNotFound:
      description: |
        No such set in the organization. Message "This condition set doesn't
        exist." with an empty `context`.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ConditionSetUnreadable:
      description: |
        The set uses a condition this site does not have, so it cannot be
        judged. `context.type` is `condition_set_unreadable` and the message
        is "This condition set uses a condition this site doesn't have. Edit
        the set to choose another." (asserted in ConditionSetRoutesFlowTest).
        There is no `error.code`.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ConditionSetServerError:
      description: |
        A database failure. The message is "Something went wrong with
        condition sets. Nothing was changed." and the route logs it at error
        with the organization id. Asserted for `GET /condition-sets` only,
        and the other routes share the same handler in code.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    EnrollerNotFound:
      description: |
        The enroller is not there or belongs to another organization. The
        body is `{"error": "Enroller not found."}`, a plain string.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    EnrollerWriteForbidden:
      description: |
        403. With a plan that lacks `enrollers`, `error.code` is
        `plan_required` and the message is "Your plan does not include this
        feature." A role that may not update enrollers, such as a viewer, gets
        403 (`not_permitted`). An API key holding only
        `records:enrollers:read` gets `missing_scope` with
        `context.scope` set to `records:enrollers:manage`. The plan check
        runs first.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    EnrollerCannotRun:
      description: |
        The enroller cannot run now. The body is `{"error": "<sentence>"}`,
        a plain string, and the sentence is one of these, checked in this
        order. There is no code, so branch on the sentence only as a last
        resort.
        1. "Only an enroller that starts when someone starts matching a
           condition set can run now, because only a condition set has
           people who match it now."
        2. "An enroller that starts when people stop matching can't be
           applied to people who match now."
        3. "The condition set this enroller starts from no longer exists, so
           there is nobody to run it for."
        4. "Set this enroller to Active before you run it."
        5. "This enroller came with your store's move to Siren Cloud, and the
           store hasn't switched over yet. Run it here once the store
           switches over."
        Sentences 1 and 4 are asserted in the tests, and 2, 3 and 5 are from
        code (EnrollerRuns.php), so those three are x-unconfirmed.
      x-unconfirmed: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
