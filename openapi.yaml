        - conversion.created
        - conversion.rejected
        - conversion.renewed
        - coupon.applied
        - coupon.linked
        - coupon.merged
        - coupon.unlinked
        - credit.issued
        - credit.redeemed
        - currency.created
        - currency.deleted
        - distribution.completed
        - distributor.created
        - distributor.deleted
        - distributor.updated
        - engagement.awarded
        - engagement.completed
        - engagement.created
        - fulfillment.created
        - fulfillment.updated
        - lead.created
        - metrics.updated
        - obligation.approved
        - obligation.completed
        - obligation.created
        - obligation.rejected
        - obligation.superseded
        - opportunity.created
        - opportunity.invalidated
        - payout.created
        - payout.failed
        - payout.paid
        - payout.waiting
        - product.merged
        - program.created
        - program.deleted
        - program_group.created
        - program_group.deleted
        - program_group.updated
