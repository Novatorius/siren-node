openapi: 3.1.0
info:
  title: Siren Affiliate Platform API
  version: 0.3.0
  summary: Headless affiliate & incentive tracking API for the Siren SaaS.
  description: |
    The Siren API lets any commerce stack record sales, refunds, and referred
    visits, subscribe to program events via signed webhooks, and reconcile
    Siren's ledger against its own.

    This document describes the **developer-facing surface**: event ingestion,
    webhooks, API keys, and read endpoints for reconciliation. The full admin
    surface used by the Siren dashboard is intentionally out of scope here.

    Every request sends a bearer token (`Authorization: Bearer ...`). An API
    key (`sk_live_...`) sends events (`POST /event/{eventSlug}`) with an
    event scope and calls `GET /ping`. With a ledger scope it reads
    conversions, transactions, obligations and payouts, and with a webhook
    scope it reads and manages webhook subscriptions. Every other route,
    the API key routes included, answers an API key with 401
    `api_key_not_accepted`. Those take a signed-in dashboard session's
    token. The reconciliation routes also take a connected site's OAuth
    token that holds `connect:records:read`. Each operation lists the
    credentials it takes in its `security`, and the scopes an API key needs.

    Success bodies are bare: a record is a JSON object and a reconciliation
    list is `{ items, total, page, perPage, totalPages }`. There is no
    `{ "data": ... }` wrapper. Failures send `{ "error": "message" }` or
    `{ "error": { "message", "code"?, "context" } }`. A failed validation is
    a 400 whose `context.type` is `VALIDATION_FAILED`.
  contact:
    name: Siren
    url: https://sirenaffiliates.com
  license:
    name: Proprietary
servers:
  - url: https://api.sirenaffiliates.com/siren/v1
    description: Production
  - url: http://localhost:8080/siren/v1
    description: Local development
security:
  - dashboardSession: []
tags:
  - name: Events
    description: Ingest commerce and tracking events.
  - name: Webhooks
    description: Subscribe to program events; delivered as signed HTTP callbacks.
  - name: API Keys
    description: Manage API keys.
  - name: Reconciliation
    description: Read Siren's ledger to reconcile against your own records.
paths:
  /event/sale:
    post:
      tags: [Events]
      operationId: recordSale
      summary: Record a completed sale
      description: |
        Records a sale so conversions and payouts compute for the attributed
        collaborator. `total` is in major currency units (9.99 = $9.99). If
        `items` are supplied, reward pools compute `amount × quantity` per line;
        otherwise `total` is treated as one line. The opportunity id is returned
        in the `X-Siren-OID` response header. Sending the same `source` and
        `externalId` again records nothing and answers `status: duplicate`.

        A test sale sends `test: true` to check an integration, and needs no
        other field. Siren marks it as a test, counts it toward nothing,
        ignores `trackingId` so a real visit is never spent, and reads a
        repeat as a pass. Its answer carries `test: true`.
      security:
        - apiKey: []
        - dashboardSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SalePayload' }
      responses:
        '200':
          description: Sale processed. The body says what Siren recorded.
          headers:
            X-Siren-OID: { $ref: '#/components/headers/XSirenOID' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SaleOutcome' }
        '202': { $ref: '#/components/responses/Queued' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /event/refund:
    post:
      tags: [Events]
      operationId: recordRefund
      summary: Record a refund
      description: |
        Records a refund of a previously recorded sale, matched by
        `(externalId, source)`, and named by `refundId`, the store's own id for
        this refund. Siren records each refund id once per order, so sending
        the same refund again is safe. Returns 404 if no matching sale
        transaction exists.

        Siren refunds the whole order when `whole` is `true`, or when neither
        `amount` nor `lines` is sent. `kind` then says how the order ended.
        Anything else refunds part of the order: `amount` is the money
        refunded, and `lines` names each refunded line by the sale item's
        `lineId` or by `sku`. A partial refund that leaves the order worth
        nothing counts as a whole refund.
      security:
        - apiKey: []
        - dashboardSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefundPayload' }
      responses:
        '200':
          description: Refund accepted. The body is empty.
          headers:
            X-Siren-OID: { $ref: '#/components/headers/XSirenOID' }
        '202': { $ref: '#/components/responses/Queued' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /event/site-visited:
    post:
      tags: [Events]
      operationId: recordSiteVisited
      summary: Record a referred visit
      description: |
        Records a referred visit and opens an opportunity attributed to the
        given collaborator. `collaboratorId` takes the collaborator's numeric
        id, or one of their tracking codes as `tracking:{code}`, which Siren
        resolves to its collaborator. A collaborator who does not exist or is
        not active gets nothing written and `status: not_attributed`.

        Siren records every visit it receives, so send a visit once. A visit
        sent again after a lost reply is recorded twice.
      security:
        - apiKey: []
        - connectorToken: []
        - dashboardSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SiteVisitedPayload' }
      responses:
        '200':
          description: Visit processed. The body says what Siren recorded.
          headers:
            X-Siren-OID: { $ref: '#/components/headers/XSirenOID' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SiteVisitOutcome' }
        '202':
          description: |
            The organization's engine is paused, so the visit was queued. The
            body carries `status: queued`, `queued: true` and the
            `opportunityId` the visit will be recorded on.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SiteVisitOutcome' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /event/{eventSlug}:
    post:
      tags: [Events]
      operationId: recordEvent
      summary: Record a custom event
      description: |
        Ingests any event type registered on the organization, including custom
        event types. The three built-in slugs are `sale`, `refund`, and
        `site-visited`. The API key needs `event:*` or `event:{eventSlug}`. The
        events a connected WordPress site forwards, such as `sale-triggered`,
        need their exact scope.
      security:
        - apiKey: []
        - connectorToken: []
        - dashboardSession: []
      parameters:
        - name: eventSlug
          in: path
          required: true
          schema: { type: string }
          example: loyalty-points-earned
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: Event accepted.
          headers:
            X-Siren-OID: { $ref: '#/components/headers/XSirenOID' }
        '202': { $ref: '#/components/responses/Queued' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /ping:
    get:
      tags: [Events]
      operationId: ping
      summary: Check a credential
      description: |
        Answers with the organization the credential belongs to, so a sender
        can check its API key before it sends events.
      security:
        - apiKey: []
        - connectorToken: []
        - dashboardSession: []
      responses:
        '200':
          description: The credential works.
          content:
            application/json:
              schema:
                type: object
                required: [ok, org]
                properties:
                  ok: { type: boolean, const: true }
                  org:
                    type: object
                    properties:
                      id: { type: integer }
                      name: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /webhooks:
    get:
      tags: [Webhooks]
      operationId: listWebhookSubscriptions
      summary: List webhook subscriptions
      description: |
        Oldest first. Pages with `number` (default 200, and a size above 200
        is lowered to 200) and `offset`.
        The `x-siren-estimated-count` header carries the total.

        An API key needs `webhook-subscriptions:read` or
        `webhook-subscriptions:manage`, and must be organization-wide. A key
        bound to one store is refused with 403 `store_key_not_allowed`.
      security:
        - apiKey: ['webhook-subscriptions:read']
        - apiKey: ['webhook-subscriptions:manage']
        - dashboardSession: []
      parameters:
        - { $ref: '#/components/parameters/Offset' }
        - name: number
          in: query
          schema: { type: integer, minimum: 1, default: 200 }
      responses:
        '200':
          description: Subscriptions (bare array).
          headers:
            x-siren-estimated-count: { $ref: '#/components/headers/XSirenEstimatedCount' }
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/WebhookSubscription' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Webhooks]
      operationId: createWebhookSubscription
      summary: Create a webhook subscription
      description: |
        Registers a URL to receive event callbacks. The response includes
        `signingSecret`, returned **once** — store it to verify future
        deliveries. Each delivery is a POST whose body is the event payload
        itself. The headers carry the rest:
        `X-Siren-Signature: sha256=<hmac-sha256(rawBody, signingSecret)>`,
        `X-Siren-Event` (the event type) and `X-Siren-Delivery` (`evt_` and 32
        hex characters, for skipping repeats). An organization holds at most
        100 subscriptions. Siren does not check `events` against
        `GET /webhooks/events`, so an unknown name is stored and never fires.

        An API key needs `webhook-subscriptions:manage`, and must be
        organization-wide. A key bound to one store is refused with 403
        `store_key_not_allowed`.
      security:
        - apiKey: ['webhook-subscriptions:manage']
        - dashboardSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WebhookSubscriptionCreate' }
      responses:
        '201':
          description: Subscription created.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/WebhookSubscription'
                  - type: object
                    properties:
                      signingSecret:
                        type: string
                        description: HMAC signing secret. Returned once.
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /webhooks/events:
    get:
      tags: [Webhooks]
      operationId: listWebhookEventTypes
      summary: List the event types a subscription can receive
      description: |
        Exactly the events Siren sends, in the order the dashboard shows them.

        An API key needs `webhook-subscriptions:read` or
        `webhook-subscriptions:manage`, and must be organization-wide. A key
        bound to one store is refused with 403 `store_key_not_allowed`.
      security:
        - apiKey: ['webhook-subscriptions:read']
        - apiKey: ['webhook-subscriptions:manage']
        - dashboardSession: []
      responses:
        '200':
          description: Event types (bare array).
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    event: { $ref: '#/components/schemas/WebhookEventType' }
                    category: { type: string, example: Conversions }
                    label: { type: string, example: A conversion was approved }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /webhooks/{id}:
    get:
      tags: [Webhooks]
      operationId: getWebhookSubscription
      summary: Get a webhook subscription
      description: |
        An API key needs `webhook-subscriptions:read` or
        `webhook-subscriptions:manage`, and must be organization-wide. A key
        bound to one store is refused with 403 `store_key_not_allowed`.
      security:
        - apiKey: ['webhook-subscriptions:read']
        - apiKey: ['webhook-subscriptions:manage']
        - dashboardSession: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: Subscription (bare object).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebhookSubscription' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Webhooks]
      operationId: deleteWebhookSubscription
      summary: Delete a webhook subscription
      description: |
        An API key needs `webhook-subscriptions:manage`, and must be
        organization-wide. A key bound to one store is refused with 403
        `store_key_not_allowed`.
      security:
        - apiKey: ['webhook-subscriptions:manage']
        - dashboardSession: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: Deleted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, const: true }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /webhooks/{id}/test:
    post:
      tags: [Webhooks]
      operationId: sendWebhookTest
      summary: Send a test delivery
      description: |
        Sends the subscription one signed sample delivery now. Siren answers
        200 whatever the endpoint answered, with what came of it, and the
        test shows in the subscription's delivery history. Siren answers 404
        for a subscription the organization does not have and 409 for a
        paused one. Each test makes Siren send a request, so the number of
        tests per hour is limited, and Siren answers 429 past it.

        An API key needs `webhook-subscriptions:manage`, and must be
        organization-wide. A key that holds only `webhook-subscriptions:read`
        is refused with 403 `missing_scope`, and a key bound to one store
        with 403 `store_key_not_allowed`.
      security:
        - apiKey: ['webhook-subscriptions:manage']
        - dashboardSession: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: The test was sent. The body says what the endpoint answered.
          content:
            application/json:
              schema:
                type: object
                properties:
                  delivered: { type: boolean, description: Whether the endpoint accepted the delivery. }
                  httpStatus: { type: [integer, 'null'], description: The status the endpoint answered with, or null when it could not be reached. }
                  error: { type: [string, 'null'], description: Why the delivery failed, when it did. }
                  eventType: { type: string, description: The event type the sample delivery named. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The subscription is paused.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429':
          description: Too many test deliveries in the last hour.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /api-keys:
    get:
      tags: [API Keys]
      operationId: listApiKeys
      summary: List API keys
      description: |
        Oldest first. Pages with `number` (default 200, and a size above 200
        is lowered to 200) and `offset`.
        The `x-siren-estimated-count` header carries the total.

        Takes a signed-in dashboard session. No API key scope reaches this
        route, and Siren answers an API key with 401 `api_key_not_accepted`.
      security:
        - dashboardSession: []
      parameters:
        - { $ref: '#/components/parameters/Offset' }
        - name: number
          in: query
          schema: { type: integer, minimum: 1, default: 200 }
      responses:
        '200':
          description: API keys (bare array, without raw key material).
          headers:
            x-siren-estimated-count: { $ref: '#/components/headers/XSirenEstimatedCount' }
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ApiKey' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [API Keys]
      operationId: createApiKey
      summary: Create an API key
      description: |
        Creates a new API key. The plaintext `rawKey` (`sk_live_...`) is
        returned **once** and cannot be retrieved later. `scopes` takes event
        scopes (`event:*`, `event:{slug}`, or the older `*`), the ledger read
        scopes and the webhook scopes. An older resource scope such as
        `programs:read` or `conversions:read` is refused with 400. An
        organization holds at most 250 active keys.

        Takes a signed-in dashboard session. No API key scope reaches this
        route, and Siren answers an API key with 401 `api_key_not_accepted`.
      security:
        - dashboardSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApiKeyCreate' }
      responses:
        '201':
          description: API key created.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiKey'
                  - type: object
                    properties:
                      rawKey:
                        type: string
                        description: Plaintext key. Returned once.
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api-keys/scopes:
    get:
      tags: [API Keys]
      operationId: listApiKeyScopes
      summary: List the scopes a new API key may be given
      description: |
        The scopes `createApiKey` takes, grouped by resource. Siren lists the
        event scopes under `events`, the ledger read scopes under `ledger`,
        the webhook scopes under `webhook-subscriptions`, and the record
        scopes under one `records:*` group each, such as `records:programs`.
        It leaves out a group with no scopes. The event scopes include each
        custom event type the organization has added.

        Takes a signed-in dashboard session. No API key scope reaches this
        route, and Siren answers an API key with 401 `api_key_not_accepted`.
      security:
        - dashboardSession: []
      responses:
        '200':
          description: Scopes grouped by resource (bare object).
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: array
                  items: { $ref: '#/components/schemas/ApiKeyScopeEntry' }
                example:
                  events:
                    - { scope: 'event:sale', resource: events, action: sale, label: Sale }
                  ledger:
                    - { scope: 'ledger:conversions:read', resource: ledger, action: 'conversions:read', label: Read conversions }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api-keys/{id}:
    delete:
      tags: [API Keys]
      operationId: revokeApiKey
      summary: Revoke an API key
      description: |
        Takes a signed-in dashboard session. No API key scope reaches this
        route, and Siren answers an API key with 401 `api_key_not_accepted`.
      security:
        - dashboardSession: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: Revoked. The body is the key with `status` set to `revoked`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiKey' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /conversions:
    get:
      tags: [Reconciliation]
      operationId: listConversions
      summary: List conversions
      description: |
        An API key needs the `ledger:conversions:read` scope. A key bound to one
        store reads only its own store's rows. An organization-wide key may
        narrow the read to one store with `propertyId` or the
        `X-Siren-Property` header.
      security:
        - apiKey: ['ledger:conversions:read']
        - dashboardSession: []
        - connectorToken: []
      parameters:
        - { $ref: '#/components/parameters/Number' }
        - { $ref: '#/components/parameters/Offset' }
        - { $ref: '#/components/parameters/PropertyId' }
        - { $ref: '#/components/parameters/XSirenProperty' }
      responses:
        '200': { $ref: '#/components/responses/PaginatedList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /transactions:
    get:
      tags: [Reconciliation]
      operationId: listTransactions
      summary: List transactions
      description: |
        An API key needs the `ledger:transactions:read` scope. A key bound to one
        store reads only its own store's rows. An organization-wide key may
        narrow the read to one store with `propertyId` or the
        `X-Siren-Property` header.
      security:
        - apiKey: ['ledger:transactions:read']
        - dashboardSession: []
        - connectorToken: []
      parameters:
        - { $ref: '#/components/parameters/Number' }
        - { $ref: '#/components/parameters/Offset' }
        - { $ref: '#/components/parameters/PropertyId' }
        - { $ref: '#/components/parameters/XSirenProperty' }
      responses:
        '200': { $ref: '#/components/responses/PaginatedList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /obligations:
    get:
      tags: [Reconciliation]
      operationId: listObligations
      summary: List obligations
      description: |
        An API key needs the `ledger:obligations:read` scope. A key bound to one
        store reads only its own store's rows. An organization-wide key may
        narrow the read to one store with `propertyId` or the
        `X-Siren-Property` header.
      security:
        - apiKey: ['ledger:obligations:read']
        - dashboardSession: []
        - connectorToken: []
      parameters:
        - { $ref: '#/components/parameters/Number' }
        - { $ref: '#/components/parameters/Offset' }
        - { $ref: '#/components/parameters/PropertyId' }
        - { $ref: '#/components/parameters/XSirenProperty' }
      responses:
        '200': { $ref: '#/components/responses/PaginatedList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /payouts:
    get:
      tags: [Reconciliation]
      operationId: listPayouts
      summary: List payouts
      description: |
        An API key needs the `ledger:payouts:read` scope, and must be
        organization-wide. Payouts are not kept by store, so a key bound to
        one store is refused with 403 `store_key_not_allowed`.
      security:
        - apiKey: ['ledger:payouts:read']
        - dashboardSession: []
        - connectorToken: []
      parameters:
        - { $ref: '#/components/parameters/Number' }
        - { $ref: '#/components/parameters/Offset' }
      responses:
        '200': { $ref: '#/components/responses/PaginatedList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
components:
  securitySchemes:
    apiKey:
      type: http
      scheme: bearer
      bearerFormat: sk_live_...
      description: |
        An API key minted in the Siren dashboard or via createApiKey. Event
        scopes send events. The ledger scopes read conversions, transactions,
        obligations and payouts, and the webhook scopes read and manage
        webhook subscriptions. Each operation lists the scopes that open it,
        and holding any one listed requirement is enough. Every other route
        answers an API key with 401 `api_key_not_accepted`, the API key
        routes included. A key's requests count against the organization's
        API rate limit.
    dashboardSession:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        The access token of a person signed in to the Siren dashboard. Some
        routes need the admin role, and refuse other roles with a 403 whose
        code is `admin_required`.
    connectorToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        A connected site's OAuth access token, issued when an organization
        admin approves the site. The reconciliation routes take it when it
        holds `connect:records:read`.
  headers:
    XSirenOID:
      description: The opportunity (tracking) id associated with the event.
      schema: { type: integer }
    XSirenEstimatedCount:
      description: Total number of records across all pages.
      schema: { type: integer }
  parameters:
    Number:
      name: number
      in: query
      description: Page size. A value above 200 is lowered to 200. Below 1 is refused with 400.
      schema: { type: integer, minimum: 1, default: 10 }
    Offset:
      name: offset
      in: query
      description: The first row to return.
      schema: { type: integer, minimum: 0, default: 0 }
    PropertyId:
      name: propertyId
      in: query
      description: |
        Narrows an organization-wide read to one store (Property). A key
        bound to one store reads only its own store's rows, whatever it
        sends here.
      schema: { type: integer, minimum: 1 }
    XSirenProperty:
      name: X-Siren-Property
      in: header
      description: The same one-store filter as `propertyId`, sent as a header.
      schema: { type: integer, minimum: 1 }
  schemas:
    SalePayload:
      type: object
      description: |
        A real sale requires `source`, `externalId`, `total` and `trackingId`.
        A test sale sends `test: true` and needs no other field.
      properties:
        source:
          type: string
          description: Commerce source identifier.
          example: stripe
        externalId:
          type: [string, number]
          minLength: 1
          maxLength: 32
          description: |
            Your order or transaction id, used to match refunds later. Siren
            also takes a number and stores it as text.
          example: cs_test_a1b2c3
        total:
          type: number
          minimum: 0
          maximum: 999999999.99
          description: Order total in major currency units.
          example: 49.99
        trackingId:
          type: integer
          minimum: 0
          description: Opportunity id from the Siren tracking cookie / attribution.
          example: 4021
        currency:
          type: string
          description: |
            A currency code the organization uses. Every line is recorded in
            it. Without it, the lines read as the organization's default
            currency. A code the organization does not use is refused with 400.
          example: USD
        items:
          type: array
          maxItems: 500
          items: { $ref: '#/components/schemas/LineItem' }
        test:
          type: boolean
          default: false
          description: |
            `true` records a test sale, to check an integration. Siren needs no
            other field, marks the sale as a test, counts it toward nothing and
            ignores `trackingId`. A repeat of a test reads as a pass.
      if:
        required: [test]
        properties:
          test: { const: true }
      else:
        required: [source, externalId, total, trackingId]
    LineItem:
      type: object
      required: [amount]
      properties:
        lineId:
          type: [string, number]
          minLength: 1
          maxLength: 191
          description: |
            Your id for this order line. Siren keeps it on the line, so a later
            refund can name the line by it in `RefundLine.lineId`. Siren stores
            a number as text.
          example: line-1
        externalId: { type: [string, number], maxLength: 255, description: 'Text, or a number that Siren stores as text.' }
        name: { type: [string, number], maxLength: 255, description: 'Text, or a number that Siren stores as text.', example: Pro Plan (annual) }
        quantity: { type: integer, minimum: 1, maximum: 1000000, default: 1 }
        amount:
          type: number
          minimum: 0
          maximum: 999999999.99
          description: Per-unit price in major currency units.
          example: 49.99
    SaleOutcome:
      type: object
      properties:
        status:
          type: string
          enum: [created, recorded, duplicate, unattributed, ignored]
        created: { type: boolean }
        transactionId: { type: [integer, 'null'] }
        conversions:
          type: array
          items:
            type: object
            properties:
              id: { type: integer }
              status: { type: string }
        message: { type: string }
        test: { type: boolean, const: true, description: Sent only on a test sale. }
        reason:
          type: string
          description: Why a recorded sale earned nothing.
          enum: [no_engagement, engagement_used, engagement_ended, not_awarded]
    SiteVisitOutcome:
      type: object
      properties:
        status:
          type: string
          enum: [attributed, recorded, not_attributed, queued]
        attributed: { type: boolean }
        queued: { type: boolean }
        opportunityId: { type: [integer, 'null'] }
        message: { type: string }
        reason:
          type: string
          enum: [collaborator_not_found, collaborator_not_active]
    QueuedOutcome:
      type: object
      properties:
        status: { type: string, const: queued }
        queued: { type: boolean, const: true }
        message: { type: string }
    RefundPayload:
      type: object
      required: [source, externalId, refundId]
      properties:
        source: { type: string, example: stripe }
        externalId: { type: [string, number], minLength: 1, maxLength: 32, example: cs_test_a1b2c3 }
        refundId:
          description: The store's own id for this refund, such as WooCommerce refund 2201. `externalId` names the order and `refundId` names one refund of it. Siren records each refund id once per order.
          type: [string, number]
          minLength: 1
          maxLength: 191
          example: re_3Nf8a2
        amount:
          type: number
          minimum: 0
          maximum: 999999999.99
          description: Money refunded, in major currency units (9.99 = $9.99). Sending it makes the refund partial unless `whole` is `true`.
          example: 20
        currency:
          type: string
          description: |
            A currency code the organization uses, for the amounts. When it is
            left out, Siren reads them in the sale's own currency, or else the
            organization's default.
          example: USD
        lines:
          type: array
          maxItems: 500
          description: The refunded order lines. Sending them makes the refund partial unless `whole` is `true`.
          items: { $ref: '#/components/schemas/RefundLine' }
        whole:
          type: boolean
          description: |
            `true` refunds the whole order, whatever else is sent. A refund
            with neither `amount` nor `lines` is also a whole refund.
        kind:
          type: string
          enum: [refund, cancelled, voided]
          default: refund
          description: How the whole order ended. Siren reads `refund` when it is left out.
    RefundLine:
      type: object
      description: |
        One refunded order line. Name the line by `lineId`, as the sale's item
        sent it, or by `sku`. Siren refuses a line that names neither.
      properties:
        lineId:
          type: [string, number]
          minLength: 1
          maxLength: 191
          description: The sale line's `lineId`. Siren stores a number as text.
          example: line-1
        sku:
          type: [string, number]
          minLength: 1
          maxLength: 191
          description: The product SKU of the line, when the sale sent no `lineId`.
        quantity:
          type: integer
          minimum: 0
          maximum: 1000000
          description: Units returned.
        amount:
          type: number
          minimum: 0
          maximum: 999999999.99
          description: Money refunded for this line, in major currency units.
          example: 20
    SiteVisitedPayload:
      type: object
      required: [collaboratorId]
      properties:
        collaboratorId:
          description: |
            The collaborator to attribute the visit to: their numeric id, or
            one of their tracking codes as `tracking:{code}`, such as
            `tracking:summer-sale`. Siren resolves the code to its collaborator.
          oneOf:
            - { type: integer }
            - { type: string, pattern: '^tracking:.+' }
          example: 88
        userId: { type: integer, example: 12345 }
    WebhookSubscription:
      type: object
      properties:
        id: { type: integer }
        targetUrl: { type: string, format: uri }
        urlValid:
          type: boolean
          description: Whether the stored URL passes the outbound URL rules. A URL that fails gets no deliveries.
        urlProblem: { type: [string, 'null'] }
        events:
          type: array
          items: { $ref: '#/components/schemas/WebhookEventType' }
        description: { type: string }
        status: { type: string, example: active }
        propertyId: { type: [integer, 'null'] }
        oauthClientId: { type: [string, 'null'] }
        dateCreated: { type: [string, 'null'] }
        dateModified: { type: [string, 'null'] }
    WebhookSubscriptionCreate:
      type: object
      required: [targetUrl, events]
      properties:
        targetUrl: { type: string, format: uri, example: https://example.com/webhooks/siren }
        events:
          type: array
          items: { $ref: '#/components/schemas/WebhookEventType' }
          example: ['conversion.approved', 'payout.paid']
        description: { type: string }
    WebhookEventType:
      type: string
      description: |
        A subscribable event type. Use `*` to subscribe to all. The list matches
        Siren's webhook catalog, which `GET /webhooks/events` serves, and Siren
        may add an event there before this list has it.
      enum:
        - '*'
        - allocation.completed
        - collaborator.applied
        - collaborator.created
        - collaborator.deactivated
        - collaborator.declined
        - collaborator.deleted
        - collaborator_group.created
        - collaborator_group.deleted
        - collaborator_group.member_added
        - collaborator_group.member_removed
        - collaborator_group.updated
        - collaborator.joined
        - collaborator.registered
        - collaborator.updated
        - conversion.approved
        - conversion.created
        - conversion.rejected
        - conversion.renewed
        - coupon.applied
        - coupon.linked
        - coupon.merged
        - coupon.unlinked
        - credit.issued
        - credit.redeemed
        - currency.created
        - currency.deleted
        - distribution.completed
        - distributor.created
        - distributor.deleted
        - distributor.updated
        - engagement.awarded
        - engagement.completed
        - engagement.created
        - fulfillment.created
        - fulfillment.updated
        - lead.created
        - metrics.updated
        - obligation.approved
        - obligation.completed
        - obligation.created
        - obligation.rejected
        - obligation.superseded
        - opportunity.created
        - opportunity.invalidated
        - payout.created
        - payout.failed
        - payout.paid
        - payout.waiting
        - product.merged
        - program.created
        - program.deleted
        - program_group.created
        - program_group.deleted
        - program_group.updated
        - program.status_changed
        - program.updated
        - refund.created
        - refund.recorded
        - renewal.created
        - sale.created
        - store.connected
        - store.disconnected
        - transaction.completed
        - transaction.created
    ApiKey:
      type: object
      properties:
        id: { type: integer }
        keyPrefix: { type: string, example: sk_live_a1b2c3d4 }
        label: { type: string }
        status: { type: string, enum: [active, revoked] }
        propertyId: { type: [integer, 'null'] }
        scopes:
          type: array
          items: { type: string }
        expiresAt: { type: [string, 'null'] }
        lastUsedAt: { type: [string, 'null'] }
        revokedAt: { type: [string, 'null'] }
        dateCreated: { type: [string, 'null'] }
        dateModified: { type: [string, 'null'] }
    ApiKeyCreate:
      type: object
      required: [scopes]
      properties:
        label: { type: string, example: Production server }
        scopes:
          type: array
          minItems: 1
          items: { type: string }
          example: ['event:sale', 'ledger:conversions:read']
          description: |
            Event scopes: `event:*` for every event, or `event:{slug}` for one
            event type. `*` is also accepted and grants what `event:*` grants.

            Ledger and webhook scopes: `ledger:conversions:read`,
            `ledger:transactions:read`, `ledger:obligations:read`,
            `ledger:payouts:read`, `webhook-subscriptions:read` and
            `webhook-subscriptions:manage`. Each is granted only by its exact
            name. `*`, `event:*` and wildcards such as `ledger:*` grant none
            of them.

            An older resource scope such as `programs:read` or
            `conversions:read` is refused with 400.
        expiresAt:
          type: string
          description: ISO 8601 date in the future. Omit for a key that never expires.
        propertyId:
          type: integer
          minimum: 1
          description: |
            Binds the key to this Property of the organization. Siren stamps
            it on the key's events, the key reads only that store's
            conversions, transactions and obligations, and it is refused on
            payouts and webhook subscriptions with 403 `store_key_not_allowed`.
    ApiKeyScopeEntry:
      type: object
      description: One scope a new API key may be given, as `GET /api-keys/scopes` lists it.
      properties:
        scope: { type: string, description: The scope string to pass to `createApiKey`., example: 'ledger:conversions:read' }
        resource: { type: string, description: The group the scope belongs to., example: ledger }
        action: { type: string, description: What the scope allows within its group., example: 'conversions:read' }
        label: { type: string, example: Read conversions }
    ErrorCode:
      type: string
      description: |
        The machine-readable `error.code` Siren sends beside a refusal's
        message. Branch on the code, not the message, which can change. A
        reply from an older or newer Siren deployment may carry no code, or a
        code this list lacks.

        401: `site_disconnected` when the organization revoked or deleted the
        connected site's connection, and `api_key_not_accepted` when the route
        takes a dashboard session and not an API key.

        403: `missing_scope` and `store_key_not_allowed` refuse an API key.
        `field_not_allowed`, `pending_status_required`, `user_type_not_allowed`,
        `program_not_on_site`, `collaborator_not_on_site`,
        `site_filter_required`, `report_not_allowed` and `not_permitted` mean
        Siren's policy refused the request, so sending it again fails again.
        `migration_closed`, `plan_required`, `admin_required` and
        `email_confirmation_required` lift once the organization changes.

        409: `code_held` when someone already holds a tracking or coupon code,
        `mapping_exists`, `hold_no_credit` and `hold_token_in_use` when Siren
        refuses a store credit hold, `hold_currency_not_at_store` and
        `currency_resolution_required`.

        422: `invalid_currency_resolution`, `collaborator_deletion_refused` and
        `reserved_address`. 503: `plan_unavailable` when Siren could not read
        the organization's plan.
      enum:
        - site_disconnected
        - api_key_not_accepted
        - missing_scope
        - store_key_not_allowed
        - field_not_allowed
        - pending_status_required
        - user_type_not_allowed
        - program_not_on_site
        - collaborator_not_on_site
        - site_filter_required
        - report_not_allowed
        - not_permitted
        - migration_closed
        - plan_required
        - admin_required
        - email_confirmation_required
        - code_held
        - mapping_exists
        - hold_no_credit
        - hold_token_in_use
        - hold_currency_not_at_store
        - currency_resolution_required
        - invalid_currency_resolution
        - collaborator_deletion_refused
        - reserved_address
        - plan_unavailable
    Error:
      type: object
      description: |
        `error` is polymorphic. Some checks return a plain string message.
        Most return an object with `message`, an optional stable `code`, and
        `context`. A failed validation sets `context.type` to
        `VALIDATION_FAILED` and lists each broken rule in
        `context.failedValidations`. Clients must handle both shapes.

        An API key's refusals carry a stable `code`: `api_key_not_accepted`
        (401) when the route takes a session and not a key, `missing_scope`
        (403) when the key holds none of the route's scopes, with
        `context.scope` and `context.anyOf`, and `store_key_not_allowed`
        (403) when a key bound to one store asks for payouts or webhook
        subscriptions, with `context.propertyId`. Branch on the code, not the
        message.
      properties:
        error:
          oneOf:
            - type: string
            - type: object
              properties:
                message: { type: string }
                code:
                  type: string
                  description: A stable code, one of the `ErrorCode` values when Siren sends one this document lists.
                context:
                  type: [object, array]
                  description: Extra detail. PHP sends an empty context as `[]`.
                  properties:
                    type: { type: string, example: VALIDATION_FAILED }
                    failedValidations:
                      type: array
                      items:
                        type: object
                        properties:
                          field: { type: string }
                          message: { type: string }
                          type: { type: string, example: REQUIRED }
                          context: { type: object, additionalProperties: true }
  responses:
    PaginatedList:
      description: |
        One page of records in Siren's list envelope. The total also travels
        in the `x-siren-estimated-count` response header.
      headers:
        x-siren-estimated-count: { $ref: '#/components/headers/XSirenEstimatedCount' }
      content:
        application/json:
          schema:
            type: object
            properties:
              items:
                type: array
                items: { type: object, additionalProperties: true }
              total: { type: integer }
              page: { type: integer }
              perPage: { type: integer }
              totalPages: { type: integer }
    Queued:
      description: |
        The organization's engine is paused, so Siren queued the event and
        will process it once the organization can run again. Do not resend it.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/QueuedOutcome' }
    Unauthorized:
      description: |
        Missing, invalid, expired or revoked credential. A valid API key sent
        to a route that takes a session gets `error.code`
        `api_key_not_accepted`. A connected site whose connection the
        organization revoked or deleted gets `site_disconnected`.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: |
        The credential may not do this. For an API key, `error.code`
        `missing_scope` means the key holds none of the route's scopes,
        `error.context.scope` names one and `error.context.anyOf` lists every
        scope that opens the route. `store_key_not_allowed` means a key bound
        to one store asked for payouts or webhook subscriptions, which are
        not kept by store. A policy code, such as `field_not_allowed` with
        `error.context.param` naming the field, means Siren refuses the
        request itself, so sending it again fails again. `ErrorCode` lists
        every code.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ValidationError:
      description: |
        The request failed validation (400). `error.context.type` is
        `VALIDATION_FAILED` and `error.context.failedValidations` names each
        field.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    RateLimited:
      description: |
        Too many requests, or the organization's engine is paused and its
        event queue is full.
      headers:
        Retry-After:
          schema: { type: integer }
          description: Seconds to wait before retrying.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
