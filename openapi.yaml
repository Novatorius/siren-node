  /engagements/types:
    get:
      tags: [Engagements]
      operationId: listEngagementTypes
      summary: List engagement types
      responses:
        '200': { $ref: '#/components/responses/Record' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /engagements/calculations:
    get:
      tags: [Engagements]
      operationId: listEngagementCalculations
      summary: List engagement calculations
      responses:
        '200': { $ref: '#/components/responses/Record' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /distributors:
    get:
      tags: [Distributors]
      operationId: listDistributors
      summary: List distributors
      parameters:
        - { $ref: '#/components/parameters/Number' }
        - { $ref: '#/components/parameters/Offset' }
        - { $ref: '#/components/parameters/Fields' }
        - { $ref: '#/components/parameters/Order' }
        - name: orderBy
          in: query
          schema: { type: string, enum: [id, name, status, dateCreated] }
        - name: status
          in: query
          schema: { type: string }
        - { $ref: '#/components/parameters/Search' }
        - name: include
          in: query
          schema: { type: string }
          description: Send `extended` for the summary fields when `fields` is not given.
      responses:
        '200': { $ref: '#/components/responses/PaginatedList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Distributors]
      operationId: createDistributor
      summary: Create a distributor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, description, distributionResolver, distributionPoolResolver, status, units]
              properties:
                name: { type: string }
                description: { type: string }
                distributionResolver: { type: string }
                distributionPoolResolver: { type: string, example: revenueSinceLastDistribution }
                status: { type: string, enum: [active, inactive] }
                units: { type: string }
                revenuePercentage: { type: number }
                schedule: { type: array, items: { type: string }, example: [first day of next month] }
                engagementTypes: { type: object, additionalProperties: true }
                collaboratorIds: { type: array, items: { type: integer } }
                collaboratorGroupId: { type: integer }
                transactionCompilers: { type: object, additionalProperties: true }
                lineItemFilters: { type: object, additionalProperties: true }
                postAllocationActions: { type: object, additionalProperties: true }
                metricFilters: { type: object, additionalProperties: true }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Record' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '400': { $ref: '#/components/responses/ValidationError' }
  /distributors/{id}:
    get:
      tags: [Distributors]
      operationId: getDistributor
      summary: Get a distributor
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { $ref: '#/components/parameters/Fields' }
        - name: include
          in: query
          schema: { type: string }
          description: Send `extended` for the summary fields when `fields` is not given.
      responses:
        '200': { $ref: '#/components/responses/Record' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Distributors]
      operationId: updateDistributor
      summary: Update a distributor
      parameters:
        - { $ref: '#/components/parameters/Id' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                description: { type: string }
                distributionResolver: { type: string }
                distributionPoolResolver: { type: string, example: revenueSinceLastDistribution }
                status: { type: string, enum: [active, inactive] }
                units: { type: string }
                revenuePercentage: { type: number }
                schedule: { type: array, items: { type: string }, example: [first day of next month] }
                engagementTypes: { type: object, additionalProperties: true }
                collaboratorIds: { type: array, items: { type: integer } }
                collaboratorGroupId: { type: integer }
                transactionCompilers: { type: object, additionalProperties: true }
                lineItemFilters: { type: object, additionalProperties: true }
                postAllocationActions: { type: object, additionalProperties: true }
                metricFilters: { type: object, additionalProperties: true }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Record' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '400': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Distributors]
      operationId: deleteDistributor
      summary: Delete a distributor
      description: |
        The first call marks the record `deleted` and returns it. A second call on a
        deleted record removes it and answers 204.
      parameters:
        - { $ref: '#/components/parameters/Id' }
      responses:
        '200': { $ref: '#/components/responses/Record' }
        '204': { description: Removed. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /distributors/bulk:
    post:
      tags: [Distributors]
      operationId: bulkDistributors
      summary: Run a bulk action on distributors
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action, ids]
              properties:
                action: { type: string, enum: [activate, deactivate, restore, delete, permanent_delete] }
                ids: { type: array, items: { type: integer } }
      responses:
        '200': { $ref: '#/components/responses/Record' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '400': { $ref: '#/components/responses/ValidationError' }
  /distributors/credit-metric:
    post:
      tags: [Distributors]
      operationId: creditDistributorMetric
      summary: Credit a manual metric to a collaborator
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [collaboratorId]
              properties:
                collaboratorId: { type: integer }
      responses:
        '200':
          description: Credited.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Record' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '400': { $ref: '#/components/responses/ValidationError' }
  /currencies/custom:
    get:
      tags: [Custom Currencies]
      operationId: listCustomCurrencies
      summary: List custom currencies
      parameters:
        - { $ref: '#/components/parameters/Number' }
        - { $ref: '#/components/parameters/Offset' }
        - { $ref: '#/components/parameters/Fields' }
        - { $ref: '#/components/parameters/Order' }
        - name: orderBy
          in: query
          schema: { type: string, enum: [code, name, symbol, symbolPosition, type, exchangeRate, dateCreated, dateModified] }
        - name: type
          in: query
          schema: { type: string, enum: [internal, monetary] }
        - name: code
          in: query
          schema: { type: string }
          description: One currency by its code. `customCurrencies.retrieve()` uses it.
          example: STORE_CREDIT
      responses:
        '200': { $ref: '#/components/responses/PaginatedList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Custom Currencies]
      operationId: createCustomCurrency
      summary: Create a custom currency
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, name, symbol, type]
              properties:
                code: { type: string, description: Upper case and unique. Real currency codes are refused. }
                name: { type: string }
                symbol: { type: string }
                symbolPosition: { type: string, enum: [before, after] }
                type: { type: string, enum: [internal, monetary] }
                exchangeRate: { type: integer, minimum: 1 }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Record' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '400': { $ref: '#/components/responses/ValidationError' }
  /currencies/custom/{code}:
    put:
      tags: [Custom Currencies]
      operationId: updateCustomCurrency
      summary: Update a custom currency
      description: |
        The type cannot change. Siren answers 400 when the body sends `type`.
      parameters:
        - { name: code, in: path, required: true, schema: { type: string }, example: PTS }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                symbol: { type: string }
                symbolPosition: { type: string, enum: [before, after] }
                exchangeRate: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Record' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '400': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Custom Currencies]
      operationId: deleteCustomCurrency
      summary: Delete a custom currency
      description: |
        Sets every program that pays in the currency to `inactive`, deletes the
        currency, and answers `{success, deactivatedPrograms}`. With
        `wipeLedger` true, the ledger entries in the currency are deleted too.
      parameters:
        - { name: code, in: path, required: true, schema: { type: string }, example: PTS }
        - name: wipeLedger
          in: query
          schema: { type: boolean }
          description: Also delete the ledger entries that use the currency.
      responses:
        '200': { $ref: '#/components/responses/Record' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /credits/adjust:
    post:
      tags: [Credits]
      operationId: adjustCreditBalance
      summary: Adjust a collaborator's credit balance
      description: |
        Only a dashboard session may adjust a balance. Read balances with
        `GET /credit-balances` and the ledger with `GET /credit-entries`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [collaboratorId, currency, amount]
              properties:
                collaboratorId: { type: integer }
                currency: { type: string, description: An internal custom currency code. }
                amount: { type: integer, description: Minor units. Negative takes credit away. Must not be zero. }
                description: { type: string }
      responses:
        '200':
          description: Adjusted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Record' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '400': { $ref: '#/components/responses/ValidationError' }
  /credit-balances:
    get:
      tags: [Credits]
      operationId: getCreditBalances
      summary: Read a collaborator's store credit for a checkout
      description: |
        One row per internal currency. `balance` is the ledger sum, `reserved`
        the live holds, and `available` the balance less reserved, never below
        zero, all in minor units. Pass the checkout's own hold reference as
        `excludeReference` so its hold does not count against itself. A
        connected site sends the plain reference and Cloud adds its Property.
      parameters:
        - { name: collaboratorId, in: query, required: true, schema: { type: integer, minimum: 1 } }
        - { name: currency, in: query, schema: { type: string, maxLength: 50 }, description: Just this internal currency. }
        - name: excludeReference
          in: query
          schema: { $ref: '#/components/schemas/HoldReference' }
      responses:
        '200':
          description: The balances.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/CreditBalance' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /credit-entries:
    get:
      tags: [Credits]
      operationId: listCreditEntries
      summary: List store credit ledger entries
      description: |
        A query must name `collaboratorId` or `idempotencyKey`, so it never
        lists a whole organization's ledger. Every filter is an exact match.
        Only Siren writes the ledger.
      parameters:
        - { $ref: '#/components/parameters/Number' }
        - { $ref: '#/components/parameters/Offset' }
        - { $ref: '#/components/parameters/Order' }
        - { name: orderBy, in: query, schema: { type: string, enum: [id, dateCreated, amount], default: id } }
        - { name: collaboratorId, in: query, schema: { type: integer } }
        - { name: currency, in: query, schema: { type: string } }
        - { name: sourceType, in: query, schema: { type: string } }
        - { name: sourceId, in: query, schema: { type: string } }
        - { name: description, in: query, schema: { type: string } }
        - { name: idempotencyKey, in: query, schema: { type: string } }
      responses:
        '200': { $ref: '#/components/responses/PaginatedList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /credit-holds:
    get:
      tags: [Credits]
      operationId: listCreditHolds
      summary: List store credit holds
      description: |
        A query must name `collaboratorId`, `reference` or `idempotencyKey`.
        Every filter is an exact match. A connected site reads only the holds
        its own checkouts placed, and their references come back with its
        Property, as in `hold:woocommerce@property:5:{token}`.
      parameters:
        - { $ref: '#/components/parameters/Number' }
        - { $ref: '#/components/parameters/Offset' }
        - { $ref: '#/components/parameters/Order' }
        - { name: orderBy, in: query, schema: { type: string, enum: [id, dateCreated, expiresAt], default: id } }
        - { name: collaboratorId, in: query, schema: { type: integer } }
        - { name: currency, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string, enum: [active, settled, released, expired] } }
        - { name: reference, in: query, schema: { $ref: '#/components/schemas/HoldReference' } }
        - { name: idempotencyKey, in: query, schema: { type: string } }
      responses:
        '200': { $ref: '#/components/responses/PaginatedList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
    post:
      tags: [Credits]
      operationId: placeCreditHold
      summary: Reserve store credit for a checkout
      description: |
        Placing again for the same token and currency replaces that session's
        hold. The hold's `amount` may be lower than asked, because Siren caps
        it at the credit available outside this session's own hold. A hold
        lapses at its `ttl`, the site can release it early with
        `DELETE /credit-holds/{id}`, and Siren settles it when the order's
        redemption arrives as an event.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [collaboratorId, currency, amount, token, platformId]
              properties:
                collaboratorId: { type: integer, minimum: 1 }
                currency: { type: string, description: An internal custom currency code. }
                amount: { type: integer, minimum: 1, description: Minor units. }
                token: { $ref: '#/components/schemas/SiteName', description: 'The checkout session, at most 120 characters.' }
                platformId: { $ref: '#/components/schemas/SiteName', description: 'The commerce platform, such as woocommerce. Plain. Cloud adds the Property (`@property:5`) and then allows at most 60 characters, suffix included.' }
                ttl: { type: integer, minimum: 60, maximum: 3600, default: 1800 }
      responses:
        '201':
          description: Placed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreditHold' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: |
            No credit is available in that currency (`error.code`
            `hold_no_credit`), or another site's checkout already holds
            credit for this collaborator and currency under the same token
            (`hold_token_in_use`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429':
          description: |
            The site spent its request budget (with `Retry-After`). Siren no
            longer caps how many checkouts hold a collaborator's credit, so it
            never sends `hold_limit`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /credit-holds/{id}:
    delete:
      tags: [Credits]
      operationId: releaseCreditHold
      summary: Release a store credit hold early
      description: |
        Releases one hold, so the credit it reserved is available again. Call
        it only when the shopper abandons the credit, or it no longer applies
        to a cart that never became an order. Never release the hold of a
        checkout that became an order: settlement consumes that hold, and
        releasing it first lets another checkout spend the same credit.
        A hold that already ended (released, expired or settled) comes back
        unchanged with 200, so a retry is safe. A connected site may release
        only holds its own checkouts placed, and any other id answers 404.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        '200':
          description: The hold, now released, or as it was when it had already ended.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreditHold' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /mappings:
    get:
      tags: [Mappings]
      operationId: listMappings
      summary: Find links to records outside Siren
      description: |
        A query must name a type. A connected site must name `externalType`,
        reads only its own namespace, and may never use the `user` type.
      parameters:
        - { $ref: '#/components/parameters/Number' }
        - { $ref: '#/components/parameters/Offset' }
        - { $ref: '#/components/parameters/Order' }
        - { name: orderBy, in: query, schema: { type: string, enum: [localId, externalId, localType, externalType], default: localId } }
        - { name: localId, in: query, schema: { type: integer } }
        - { name: localType, in: query, schema: { $ref: '#/components/schemas/SiteName' }, example: collaborator }
        - { name: externalId, in: query, schema: { type: string } }
        - { name: externalType, in: query, schema: { $ref: '#/components/schemas/SiteName' }, example: wordpress_user }
      responses:
        '200': { $ref: '#/components/responses/PaginatedList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
    post:
      tags: [Mappings]
      operationId: createMapping
      summary: Link a collaborator to an outside record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [localId, localType, externalId, externalType]
              properties:
                localId: { type: integer, minimum: 1, description: A collaborator id. }
                localType: { type: string, enum: [collaborator] }
                externalId: { type: string }
                externalType: { $ref: '#/components/schemas/SiteName' }
      responses:
        '201':
          description: Linked.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Mapping' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The link already exists (`error.code` `mapping_exists`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    delete:
      tags: [Mappings]
      operationId: deleteMappings
      summary: Remove collaborator links
      description: |
        Send `localId`, or `externalId` with its `externalType`. A connected
        site always sends `externalType`.
      parameters:
        - { name: localType, in: query, required: true, schema: { type: string, enum: [collaborator] } }
        - { name: localId, in: query, schema: { type: integer, minimum: 1 } }
        - { name: externalId, in: query, schema: { type: string } }
        - { name: externalType, in: query, schema: { $ref: '#/components/schemas/SiteName' } }
      responses:
        '200': { $ref: '#/components/responses/Deleted' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /configs:
    get:
      tags: [Settings]
      operationId: listSharedConfigs
      summary: Read the settings shared with a connected site
      description: |
        Only named settings leave Cloud. Today that is `collaborator` /
        `urlReference` / `key`, the referral link's query parameter.
      parameters:
        - { $ref: '#/components/parameters/Number' }
        - { $ref: '#/components/parameters/Offset' }
        - { $ref: '#/components/parameters/Order' }
        - { name: orderBy, in: query, schema: { type: string, enum: [type, subtype, configKey], default: type } }
        - { name: type, in: query, required: true, schema: { type: string, enum: [collaborator] } }
        - { name: subtype, in: query, schema: { type: string }, example: urlReference }
        - { name: configKey, in: query, schema: { type: string }, example: key }
      responses:
        '200': { $ref: '#/components/responses/PaginatedList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /oauth/register:
    post:
      tags: [OAuth]
      operationId: registerOAuthClient
      summary: Register a connected site's OAuth client
      description: |
        RFC 7591 dynamic registration. A site registers once, before it sends
        the merchant to the consent screen, and keeps the `client_id` it gets
        back. Each registration makes a new client, so the SDK sends it once.
        `scope` defaults to the connected-site scopes. A client that sends no
        `software_id` registers as the WordPress connector.

        A refusal is a 400 with the RFC 7591 error envelope, `error` and
        `error_description`, such as `invalid_redirect_uri`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [client_name, redirect_uris]
              properties:
                client_name: { type: string, maxLength: 200, description: The store's name. Cloud names the Property after it. }
                redirect_uris:
                  type: array
                  maxItems: 10
                  description: https URIs, or http on `localhost`, `127.0.0.1` or `[::1]`.
                  items: { type: string, format: uri }
                scope:
                  type: string
                  description: Space-separated scopes.
                  example: 'connect:* connect:webhooks connect:records:read connect:records:write'
                software_id: { type: string, enum: [siren-wordpress, siren-medusa] }
      responses:
        '201':
          description: The client is registered.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OAuthClientRegistration' }
        '400': { $ref: '#/components/responses/OAuthRefused' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /oauth/token:
    post:
      tags: [OAuth]
      operationId: requestOAuthToken
      summary: Exchange a code, refresh a token, or trade an app's key for a token
      description: |
        RFC 6749 token route. With `grant_type: authorization_code` it
        exchanges the callback's single-use code and the PKCE verifier for a
        token pair. With `grant_type: refresh_token` it spends the refresh
        token for a new pair, and Cloud rotates the refresh token every time.

        With `grant_type: client_credentials` an app trades its own key,
        sent as `client_secret` or as HTTP Basic, for a short-lived token
        and no refresh token. No `scope` gets a server token that lasts 1200
        seconds. `scope: browser:{eventKey}` gets a browser token for that
        one custom event of the app, which lasts 600 seconds and is refused
        with `invalid_scope` while the event allows no domain. A key that is
        no app's gets 400 `unauthorized_client`, "Only an app's key can get
        an access token.". An unknown or revoked key, or a `client_id` other
        than the app's key word, gets 401 `invalid_client`. Cloud answers 503
        `temporarily_unavailable` when it cannot read the key or the app.
        App grants have their own limit, 600 an hour.

        Cloud answers a repeat of a rotated refresh token for 30 seconds. A
        repeat that carries the same `attempt_id` gets the pair Cloud already
        issued. A repeat after 30 seconds makes Cloud revoke the whole token
        family. The SDK sends each call once, and the store locks its own
        refresh. After a lost answer, a 429 or a 5xx the store may resend a
        refresh once, at once, with the same `attempt_id`.

        A refusal is a 400 or 401 with the RFC 6749 error envelope, `error`
        and `error_description`. A refresh refused with `invalid_grant` or
        `invalid_client` means the grant is gone and the site connects again.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [grant_type]
              properties:
                grant_type: { type: string, enum: [authorization_code, refresh_token, client_credentials] }
                client_id: { type: string, description: Required for `authorization_code` and `refresh_token`. For `client_credentials` it is the app's key word, or left out. }
                client_secret: { type: string, description: "The app's API key, for `client_credentials`. HTTP Basic may carry it instead." }
                scope: { type: string, description: "For `client_credentials`, none for a server token or `browser:{eventKey}` for a browser token." }
                code: { type: string, description: The callback's code. Single use. Required for `authorization_code`. }
                redirect_uri: { type: string, format: uri, description: The redirect URI the authorization request named. Required for `authorization_code`. }
                code_verifier: { type: string, description: The PKCE verifier whose S256 challenge the authorization request carried. Required for `authorization_code`. }
                refresh_token: { type: string, description: Required for `refresh_token`. }
                attempt_id: { type: string, description: A random id for one refresh, sent again unchanged on each try of it. }
      responses:
        '200':
          description: A new token pair, or for `client_credentials` an app's token with no refresh token.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/OAuthToken'
                  - $ref: '#/components/schemas/AppAccessToken'
        '400': { $ref: '#/components/responses/OAuthRefused' }
        '401': { $ref: '#/components/responses/OAuthRefused' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/OAuthRefused' }
  /connect/plan:
    get:
      tags: [Connected sites]
      operationId: getConnectPlan
      summary: Read the organization's plan
      description: |
        The organization's plan, trial and capabilities. Cloud answers 503
        with code `plan_unavailable` when it cannot read billing, and the
        site keeps the plan it last read.
      security:
        - connectorToken: [connect:read]
      responses:
        '200':
          description: The plan.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConnectPlan' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503':
          description: Cloud could not read the plan. `error.code` is `plan_unavailable`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /connect/update-grant:
    post:
      tags: [Connected sites]
      operationId: issueConnectUpdateGrant
      summary: Sign a grant for a paid build
      description: |
        A short-lived signed grant the site's updater sends to fetch a paid
        build. Each call signs a new grant and records nothing. No body.
      security:
        - connectorToken: [connect:read]
      responses:
        '200':
          description: The grant.
          content:
            application/json:
              schema:
                type: object
                required: [grant, expiresAt, expiresIn]
                properties:
                  grant: { type: string }
                  expiresAt: { type: integer, description: Unix time. }
                  expiresIn: { type: integer, description: Seconds. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /connect/site-state:
    put:
      tags: [Connected sites]
      operationId: reportConnectedSiteState
      summary: Report the site's forwarding and migration state
      security:
        - connectorToken: [connect:read]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [forwarding]
              properties:
                forwarding: { type: boolean }
                cutOverAt: { type: [integer, 'null'], description: Unix time, 2020 or later. }
                localDataDeletedAt: { type: [integer, 'null'], description: Unix time, 2020 or later. }
                migrationComplete: { type: boolean, description: Closes the site's migration window. }
      responses:
        '200':
          description: The state Cloud now holds.
          content:
            application/json:
              schema:
                type: object
                required: [reported, forwarding, cutOverAt, localDataDeletedAt]
                properties:
                  reported: { type: boolean, const: true }
                  forwarding: { type: boolean }
                  cutOverAt: { type: [integer, 'null'] }
                  localDataDeletedAt: { type: [integer, 'null'] }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /connect/disconnect:
    post:
      tags: [Connected sites]
      operationId: disconnectConnectedSite
      summary: Disconnect the site
      description: |
        Revokes the site's client, its tokens and its webhook. No body. Cloud
        cuts the client off as the disconnect commits, so a resend after a
        lost answer gets 401, and the site treats that as disconnected.
      security:
        - connectorToken: [connect:read]
      responses:
        '200':
          description: The site is disconnected.
          content:
            application/json:
              schema:
                type: object
                required: [disconnected, clientRevoked, tokensRevoked, webhooksRemoved]
                properties:
                  disconnected: { type: boolean, const: true }
                  clientRevoked: { type: boolean }
                  tokensRevoked: { type: integer }
                  webhooksRemoved: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /connect/integrations:
    put:
      tags: [Connected sites]
      operationId: replaceConnectedSiteIntegrations
      summary: Report the site's integrations
      description: The whole list, up to 50, replaces the one Cloud held.
      security:
        - connectorToken: [connect:records:write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [integrations]
              properties:
                integrations:
                  type: array
                  maxItems: 50
                  items:
                    type: object
                    required: [id]
                    properties:
                      id: { type: string, pattern: '^[A-Za-z0-9._-]+$' }
                      name: { type: string }
                      supports:
                        type: array
                        description: Feature values such as `coupons`, `customers` and `products`. Cloud drops values it does not know.
                        items: { type: string }
      responses:
        '204':
          description: The list is replaced. No body.
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /connect/products:
    put:
      tags: [Connected sites]
      operationId: syncConnectedStoreProducts
      summary: Sync the store's products
      description: |
        Upserts and removes up to 200 products a call. To end a full sync,
        send the `serverTime` an earlier answer gave as `pruneBefore`, and
        Cloud removes every product the sync did not touch.
      security:
        - connectorToken: [connect:records:write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [platform]
              properties:
                platform: { type: string, example: medusa }
                products:
                  type: array
                  maxItems: 200
                  items:
                    type: object
                    required: [id]
                    properties:
                      id: { type: [string, integer] }
                      parentId: { type: [string, integer, 'null'] }
                      name: { type: [string, 'null'] }
                      sku: { type: [string, 'null'] }
                      type: { type: [string, 'null'] }
                      status: { type: [string, 'null'] }
                      editUrl: { type: [string, 'null'], format: uri }
                removed:
                  type: array
                  maxItems: 200
                  items: { type: [string, integer] }
                pruneBefore: { type: [integer, 'null'] }
      responses:
        '200':
          description: What the call changed.
          content:
            application/json:
              schema:
                type: object
                required: [upserted, skipped, removed, pruned, serverTime]
                properties:
                  upserted: { type: integer }
                  skipped: { type: integer }
                  removed: { type: integer }
                  pruned: { type: integer }
                  serverTime: { type: integer, description: Unix time by Cloud's clock. }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /connect/migration-window:
    get:
      tags: [Connected sites]
      operationId: getMigrationWindow
      summary: Read the site's migration window
      security:
        - connectorToken: [connect:migrate]
      responses:
        '200':
          description: Whether the site may still migrate, and until when.
          content:
            application/json:
              schema:
                type: object
                required: [open, closesAt]
                properties:
                  open: { type: boolean }
                  closesAt: { type: [integer, 'null'], description: Unix time. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /connect/customer-email-key:
    get:
      tags: [Connected sites]
      operationId: getCustomerEmailKey
      summary: Read the customer email key
      description: |
        The HMAC key the site hashes customer emails with. Cloud sends it
        with `Cache-Control: no-store`. Never log it.
      security:
        - connectorToken: [connect:records:read]
      responses:
        '200':
          description: The key.
          content:
            application/json:
              schema:
                type: object
                required: [keyId, secret]
                properties:
                  keyId: { type: string }
                  secret: { type: string, contentEncoding: base64, description: At least 16 bytes, standard base64. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /connect/webhook:
    put:
      tags: [Connected sites]
      operationId: replaceConnectorWebhook
      summary: Create or replace the site's webhook subscription
      description: |
        Creates the subscription (201) or replaces it (200). Either way the
        answer carries a new signing secret, shown only here, so each call
        rotates the secret.
      security:
        - connectorToken: [connect:webhooks]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [targetUrl, events]
              properties:
                targetUrl: { type: string, format: uri }
                events:
                  type: array
                  maxItems: 100
                  items: { $ref: '#/components/schemas/WebhookEventType' }
      responses:
        '200':
          description: The subscription is replaced.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConnectorWebhookWithSecret' }
        '201':
          description: The subscription is created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConnectorWebhookWithSecret' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    get:
      tags: [Connected sites]
      operationId: getConnectorWebhook
      summary: Read the site's webhook subscription
      security:
        - connectorToken: [connect:webhooks]
      responses:
        '200':
          description: The subscription.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConnectorWebhook' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Connected sites]
      operationId: deleteConnectorWebhook
      summary: Delete the site's webhook subscription
      description: |
        A repeat removes nothing more. `deleted: false` means the site had no
        webhook left to remove, which is also what a retry after a lost answer
        meets, so it counts as success.
      security:
        - connectorToken: [connect:webhooks]
      responses:
        '200':
          description: The subscription is gone.
          content:
            application/json:
              schema:
                type: object
                required: [deleted]
                properties:
                  deleted: { type: boolean }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /connect/webhook/test:
    post:
      tags: [Connected sites]
      operationId: testConnectorWebhook
      summary: Send one signed test delivery
      description: |
        Cloud signs one test delivery to the site and reports what the site
        answered. Cloud allows ten tests a site an hour.
      security:
        - connectorToken: [connect:webhooks]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nonce]
              properties:
                nonce: { type: string, pattern: '^[A-Za-z0-9_-]{16,128}$' }
      responses:
        '200':
          description: What the site answered.
          content:
            application/json:
              schema:
                type: object
                required: [delivered, httpStatus, error]
                properties:
                  delivered: { type: boolean }
                  httpStatus: { type: [integer, 'null'] }
                  error: { type: [string, 'null'] }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /connect/webhook/deliveries:
    get:
      tags: [Connected sites]
      operationId: listConnectorWebhookDeliveries
      summary: List deliveries to the site's subscription
      security:
        - connectorToken: [connect:webhooks]
      responses:
        '200':
          description: The deliveries, newest first.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ConnectorWebhookDelivery' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /apps:
    get:
      tags: [Apps]
      operationId: listApps
      summary: List the organization's apps
      description: |
        Every app, on and off, ordered by id, each with its features. A signed-in
        admin only. An API key gets 401 `api_key_not_accepted`.
      security:
        - dashboardSession: []
      responses:
        '200':
          description: The apps.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/App' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Apps]
      operationId: createApp
      summary: Make an app from the dashboard
      description: |
        Siren picks the app's key from its name. `scopes`, a list even when
        empty, makes a key, and `url` makes an address. The answer carries
        `rawKey` and `signingSecret` for the parts this call made, each shown
        this once. The app's `source` is `dashboard`. 422 `app_needs_a_part`
        for an app with neither part, and 400 `app_cap_reached` at the cap.
      security:
        - dashboardSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AppCreate' }
      responses:
        '201':
          description: The app, with the secret of each part it made, shown this once.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AppWithSecrets' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/AppRefused' }
  /apps/events:
    get:
      tags: [Apps]
      operationId: listAppEvents
      summary: List the events an app's address may receive
      security:
        - dashboardSession: []
      responses:
        '200':
          description: Each event with its group and label.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    event: { $ref: '#/components/schemas/WebhookEventType' }
                    category: { type: string }
                    label: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /apps/scopes:
    get:
      tags: [Apps]
      operationId: listAppScopes
      summary: List the scopes an app's key may hold
      description: The scopes an app's key may hold, grouped by resource (ApiKeyScopePolicy::issuableGroups()). The `webhook-subscriptions` scopes are retired and never listed.
      security:
        - dashboardSession: []
      responses:
        '200':
          description: The scopes, grouped by resource.
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: array
                  items: { $ref: '#/components/schemas/ApiKeyScopeEntry' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /apps/kinds:
    get:
      tags: [Apps]
      operationId: listAppKinds
      summary: List the kinds of feature an app may add
      description: In the order the dashboard lists them, each with its settings and whether the plan can use it.
      security:
        - dashboardSession: []
      responses:
        '200':
          description: The kinds.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AppFeatureKindEntry' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /apps/requests:
    get:
      tags: [Apps]
      operationId: listAppRequests
      summary: List the requests Siren sent the apps
      description: |
        The organization's latest requests, 50 or `limit`, newest first, or
        the ones that start with `idPrefix`. A signed-in admin only.
      security:
        - dashboardSession: []
      parameters:
        - name: status
          in: query
          description: Only the requests in this status.
          schema: { type: string, enum: [pending, sent, delivered, answered, applying, applied, needs_attention, dropped] }
        - name: limit
          in: query
          description: How many requests to answer.
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - name: before
          in: query
          description: Only the requests older than this one, to read the next page.
          schema: { type: string, pattern: '^apr_[0-9a-f]{32}$' }
        - name: appId
          in: query
          description: Only this app's requests, by its numeric id. Not with idPrefix.
          schema: { type: integer, minimum: 1 }
        - name: idPrefix
          in: query
          description: |
            The requests whose id starts with this, at most two, newest first,
            with `total`. Siren ignores every other parameter beside it.
          schema: { type: string, pattern: '^apr_[0-9a-f]{4,32}$' }
      responses:
        '200':
          description: The requests, and with idPrefix how many match in all.
          content:
            application/json:
              schema:
                type: object
                required: [requests]
                properties:
                  requests:
                    type: array
                    maxItems: 100
                    items: { $ref: '#/components/schemas/AppRequestRecord' }
                  total:
                    type: integer
                    description: With idPrefix only, how many requests match in all.
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /apps/requests/{requestKey}:
    get:
      tags: [Apps]
      operationId: retrieveAppRequest
      summary: Read one request Siren sent an app
      description: |
        One of the organization's requests by its key, however old: the
        list's fields, the `data` Siren sent the app (`{}` when empty), the
        `answer` Siren took or null, and `answeredByUser`, the person whose
        answer it is when `answeredBy` is `user:{id}`, or null. A signed-in
        admin only. An API key gets 401 `api_key_not_accepted`. 404
        `app_request_not_found` for a request the organization does not have
        (GetAppRequest.php on Siren's feat/apps at 27169452a).
      security:
        - dashboardSession: []
      parameters:
        - { name: requestKey, in: path, required: true, schema: { type: string, pattern: '^apr_[0-9a-f]{32}$' } }
      responses:
        '200':
          description: The request with its data and answer.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AppRequestDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /apps/requests/{id}/resend:
    post:
      tags: [Apps]
      operationId: resendAppRequest
      summary: Send a request again
      description: |
        Sends the request again under the same id, and gives an ask a new
        answer window. A request that holds an answer Siren has not applied,
        in `needs_attention` or still `answered`, is not sent to the app.
        Siren applies the stored answer instead, even while the app is off. A
        signed-in admin who sees every store only. 409
        `app_request_not_resendable` for an `applied` request, or one Siren
        would have to send while its app is off, and 404
        `app_request_not_found`.
      security:
        - dashboardSession: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, pattern: '^apr_[0-9a-f]{32}$' } }
      responses:
        '200':
          description: The request as it now stands.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AppRequestRecord' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/AppRefused' }
  /apps/requests/{id}/answer:
    post:
      tags: [Apps]
      operationId: answerAppRequest
      summary: Answer an ask
      description: |
        Takes an app's answer to an ask. The app sends its own API key, which
        needs no scope and answers only a request Siren sent its own app. A
        signed-in admin may answer by hand, but only a request that needs
        attention. The body is the answer, a JSON
        object with a text `outcome`, at most 16384 bytes.

        Siren takes each answer once. The same answer again answers
        `duplicate: true` and applies nothing. Each refusal of the route
        carries its code in `error.code`: 403 app_inactive or
        app_answer_forbidden, 409 app_request_already_answered for a
        different answer after one was accepted, 409
        app_request_not_needing_attention for a person's answer to an ask
        that does not need attention, 409 app_request_dropped for an answer
        after Siren stopped waiting, 24 hours on, and used none of it, 422
        app_answer_invalid, and
        404 app_request_not_found, which an org key that is no app's also
        gets. A missing or unknown bearer gets 401 from the key check every
        route shares, with no code, and the SDK reads it as
        app_answer_unauthorized.
      security:
        - apiKey: []
        - dashboardSession: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, pattern: '^apr_[0-9a-f]{32}$' } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AppAnswer' }
      responses:
        '200':
          description: The answer was accepted, now or before.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AppAnswerReceipt' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/AppRefused' }
        '422': { $ref: '#/components/responses/AppRefused' }
  /apps/{key}:
    get:
      tags: [Apps]
      operationId: getApp
      summary: Read one app
      description: The app with its features. A signed-in admin only.
      security:
        - dashboardSession: []
      parameters:
        - $ref: '#/components/parameters/AppKey'
      responses:
        '200':
          description: The app.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/App' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Apps]
      operationId: declareApp
      summary: Declare an app
      description: |
        Declares the app with this key from its whole description. The first
        call makes the app and its API key, and an address when `url` is
        given, and answers 201 with `rawKey`, and `signingSecret` when it
        made an address, which Siren never shows again. Every later call
        updates the app and answers 200. A later call never makes or revokes
        a key, makes an address and answers `signingSecret` when `url` is new,
        and removes the address when `url` is left out. An app with features
        needs a key and an address, or Siren answers 422
        `app_features_need_key_and_address`. A body that still holds `items`,
        the features' name before Siren's feature rename, is refused with 422
        on the field `items`, and nothing is written. A signed-in admin who sees every store only. 403 with
        `error.code` `app_limit_reached` when the plan has no room, and 409
        `app_change_in_progress` when another change held the org's apps.
      security:
        - dashboardSession: []
      parameters:
        - $ref: '#/components/parameters/AppKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AppDeclaration' }
      responses:
        '200':
          description: The app, updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/App' }
        '201':
          description: The app, made, with its key, and its signing secret when it made an address, shown this once.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AppWithSecrets' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/AppRefused' }
        '422': { $ref: '#/components/responses/AppRefused' }
    patch:
      tags: [Apps]
      operationId: updateApp
      summary: Change an app
      description: |
        Changes only the fields sent. `url` moves the address and keeps its
        secret, or makes one and answers `signingSecret` once. `url: null`
        removes the address. `events` needs an address and `scopes` a key. It
        never makes, rotates or revokes a key.
      security:
        - dashboardSession: []
      parameters:
        - $ref: '#/components/parameters/AppKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AppChange' }
      responses:
        '200':
          description: The app, and `signingSecret` when the change made an address.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AppWithSecrets' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/AppRefused' }
        '422': { $ref: '#/components/responses/AppRefused' }
    delete:
      tags: [Apps]
      operationId: deleteApp
      summary: Delete an app
      description: |
        Deletes an app that no record selects and with no open ask, revokes
        its key, and deletes its features and subscription. Its requests stay
        readable. 409 with `error.code` `app_in_use`, `context.uses` and
        `context.openRequests` while a record selects one of its features or an
        ask is open. A signed-in admin who sees every store only.
      security:
        - dashboardSession: []
      parameters:
        - $ref: '#/components/parameters/AppKey'
      responses:
        '200':
          description: The app is gone.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, const: true }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/AppRefused' }
  /apps/{key}/status:
    post:
      tags: [Apps]
      operationId: setAppStatus
      summary: Turn an app on or off
      description: |
        An app that is off leaves every picker, and Siren sends it nothing.
        Turning one on checks the plan's room again, and answers 403
        `app_limit_reached` when there is none. A signed-in admin who sees
        every store only.
      security:
        - dashboardSession: []
      parameters:
        - $ref: '#/components/parameters/AppKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [active, inactive] }
      responses:
        '200':
          description: The app.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/App' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /apps/{key}/key:
    post:
      tags: [Apps]
      operationId: createAppKey
      summary: Make a key for an app that has none
      description: |
        Labelled "App: {name}", with the scopes sent or none. 409
        `app_key_exists` when the app holds an active key.
      security:
        - dashboardSession: []
      parameters:
        - $ref: '#/components/parameters/AppKey'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                scopes: { type: array, items: { type: string } }
      responses:
        '201':
          description: The app with its new key, shown this once.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AppWithSecrets' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/AppRefused' }
    delete:
      tags: [Apps]
      operationId: revokeAppKey
      summary: Revoke an app's key
      description: |
        The app keeps its address. 409 `app_key_missing` with no key,
        `app_needs_a_part` with no address, and
        `app_features_need_key_and_address` while it has features.
      security:
        - dashboardSession: []
      parameters:
        - $ref: '#/components/parameters/AppKey'
      responses:
        '200':
          description: The app, with `apiKey` null.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/App' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/AppRefused' }
  /apps/{key}/key/rotate:
    post:
      tags: [Apps]
      operationId: rotateAppKey
      summary: Give an app a new key
      description: |
        Revokes the old key first, then makes a new one with the same label,
        scopes and store. The signing secret stays. 409 `app_key_missing`
        with no key.
      security:
        - dashboardSession: []
      parameters:
        - $ref: '#/components/parameters/AppKey'
      responses:
        '200':
          description: The app with its new key, shown this once.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AppWithSecrets' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/AppRefused' }
  /apps/{key}/secret/rotate:
    post:
      tags: [Apps]
      operationId: rotateAppSecret
      summary: Give an app's address a new signing secret
      description: |
        Siren signs every delivery with the new secret from then on. The key
        stays. 409 `app_address_missing` with no address.
      security:
        - dashboardSession: []
      parameters:
        - $ref: '#/components/parameters/AppKey'
      responses:
        '200':
          description: The app with its new signing secret, shown this once.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AppWithSecrets' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/AppRefused' }
  /apps/{key}/test:
    post:
      tags: [Apps]
      operationId: testApp
      summary: Send an app's address a test
      description: |
        One signed `webhook.test` delivery, now. Siren answers 200 whether or
        not it arrived. 409 `app_address_missing` or `app_inactive`, 403
        `plan_required` below Pro, and 429 past 20 tests an hour for one app.
      security:
        - dashboardSession: []
      parameters:
        - $ref: '#/components/parameters/AppKey'
      responses:
        '200':
          description: What the address did.
          content:
            application/json:
              schema:
                type: object
                properties:
                  delivered: { type: boolean }
                  httpStatus: { type: [integer, 'null'] }
                  error: { type: [string, 'null'] }
                  eventType: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/AppRefused' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /apps/{key}/deliveries:
    get:
      tags: [Apps]
      operationId: listAppDeliveries
      summary: List the deliveries to an app's address
      description: |
        The latest 50, newest first, as `GET /webhooks/{id}/deliveries` lists
        them, and `[]` for an app with no address.
      security:
        - dashboardSession: []
      parameters:
        - $ref: '#/components/parameters/AppKey'
      responses:
        '200':
          description: The deliveries.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/WebhookDelivery' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /apps/{key}/features:
    post:
      tags: [Apps]
      operationId: addAppFeature
      summary: Add one feature to an app
      description: |
        Checked by the rules a declaration's feature meets. 201, or 200 when
        an archived feature of the same kind and key comes back. 409
        `app_features_need_key_and_address` when the app lacks a key or an
        address.
      security:
        - dashboardSession: []
      parameters:
        - $ref: '#/components/parameters/AppKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AppFeatureDeclaration' }
      responses:
        '201':
          description: The feature, with who selects it.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AppFeaturePage' }
        '200':
          description: An archived feature, back.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AppFeaturePage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/AppRefused' }
        '422': { $ref: '#/components/responses/AppRefused' }
  /apps/{key}/features/{id}:
    get:
      tags: [Apps]
      operationId: getAppFeature
      summary: Read one feature
      security:
        - dashboardSession: []
      parameters:
        - $ref: '#/components/parameters/AppKey'
        - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        '200':
          description: The feature, how many records select it, and up to 100 of them.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AppFeaturePage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Apps]
      operationId: editAppFeature
      summary: Change a feature
      description: A feature's kind and key never change, and Siren answers 422 for either.
      security:
        - dashboardSession: []
      parameters:
        - $ref: '#/components/parameters/AppKey'
        - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                description: { type: string }
                currencies: { type: array, items: { type: string } }
                answerWindowMinutes: { type: [integer, 'null'], minimum: 1, maximum: 43200 }
      responses:
        '200':
          description: The feature.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AppFeaturePage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/AppRefused' }
    delete:
      tags: [Apps]
      operationId: removeAppFeature
      summary: Remove a feature
      description: Archived while a record selects it, deleted otherwise.
      security:
        - dashboardSession: []
      parameters:
        - $ref: '#/components/parameters/AppKey'
        - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        '200':
          description: Whether Siren archived it, with the feature, or deleted it.
          content:
            application/json:
              schema:
                type: object
                properties:
                  archived: { type: boolean }
                  feature:
                    oneOf:
                      - $ref: '#/components/schemas/AppFeaturePage'
                      - type: 'null'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
components:
  securitySchemes:
    apiKey:
      type: http
      scheme: bearer
      bearerFormat: sk_live_... or sk_test_...
      description: |
        An API key minted in the Siren dashboard, or an
        app's own key. A sandbox key starts `sk_test_` and works on the
        sandbox server. An app's key answers its own app's asks on
        `POST /apps/requests/{id}/answer` with no scope. Event
        scopes send events. The ledger scopes read conversions, transactions,
        obligations, payouts and fulfillments, and the webhook scopes read and manage
        webhook subscriptions. Each operation lists the scopes that open it,
        and holding any one listed requirement is enough. Every other route
        answers an API key with 401 `api_key_not_accepted`, the API key
        routes included. A key's requests count against the organization's
        API rate limit.
    dashboardSession:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        The access token of a person signed in to the Siren dashboard. Some
        routes need the admin role, and refuse other roles with a 403 whose
        code is `admin_required`.
    connectorToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        A connected site's OAuth access token, issued when an organization
        admin approves the site. The reconciliation routes take it when it
        holds `connect:records:read`. Each `/connect/*` route names the one
        `connect` scope it needs, and forwarded events need `connect:ingest`.
        `connect:*` grants `connect:read`, `connect:ingest` and
        `connect:migrate`. `connect:webhooks`, `connect:records:read` and
        `connect:records:write` are granted only by name.
  headers:
    XSirenOID:
      description: The opportunity (tracking) id associated with the event.
      schema: { type: integer }
    XSirenEstimatedCount:
      description: Total number of records across all pages.
      schema: { type: integer }
  parameters:
    Number:
      name: number
      in: query
      description: Page size. A value above 200 is lowered to 200. Below 1 is refused with 400.
      schema: { type: integer, minimum: 1, default: 10 }
    Offset:
      name: offset
      in: query
      description: The first row to return.
      schema: { type: integer, minimum: 0, default: 0 }
    Fields:
      name: fields
      in: query
      description: Comma-separated fields to return. Each list has a default set.
      schema: { type: string }
      example: id,status,dateCreated
    Order:
      name: order
      in: query
      schema: { type: string, enum: [ASC, DESC] }
    Search:
      name: s
      in: query
      description: A search term matched against the resource's text columns.
      schema: { type: string }
    Id:
      name: id
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    AppKey:
      name: key
      in: path
      required: true
      description: The app key, lowercase letters and digits joined by single dashes. `requests`, `events`, `scopes` and `kinds` are kept for Siren's own app routes.
      schema: { type: string, pattern: '^[a-z0-9]+(-[a-z0-9]+)*$', maxLength: 64 }
    PropertyId:
      name: propertyId
      in: query
      description: |
        Narrows an organization-wide read to one store (Property). A key
        bound to one store reads only its own store's rows, whatever it
        sends here.
      schema: { type: integer, minimum: 1 }
    XSirenProperty:
      name: X-Siren-Property
      in: header
      description: The same one-store filter as `propertyId`, sent as a header.
      schema: { type: integer, minimum: 1 }
  schemas:
    AppFeatureDeclaration:
      type: object
      required: [kind, key, name]
      additionalProperties: false
      properties:
        kind: { type: string, enum: [postConversionAction, postAllocationAction, payoutMethod, distributionResolver, customEvent, metricCalculation, metricFilter, incentiveResolver, incentiveType, engagementCalculation, engagementFilter, programGroupSorter, transactionFilter, collaboratorGroupStructure], description: 'Locks once Siren makes the feature, as `key` does. Siren refuses the old `fulfillmentMethod`.' }
        key: { type: string, description: Unique within the app for its kind. }
        name: { type: string, minLength: 1 }
        description: { type: string }
        currencies:
          type: array
          description: The currencies a payout method pays in. Only a payout method takes it.
          items: { type: string }
        answerWindowMinutes:
          type: integer
          minimum: 1
          maximum: 43200
          description: How long Siren waits for an answer to each send of an ask. A payout method waits 1440 minutes and a distribution resolver 60 when it is left out.
        scoresMoney:
          type: boolean
          description: Whether a metric calculation's score is an amount of money in the distributor's currency. Only a metric calculation takes it.
        conversionTypes:
          type: array
          minItems: 1
          uniqueItems: true
          description: The conversions an incentive type pays. An incentive type requires it, and no other kind takes it.
          items: { type: string, enum: [sale, lead, renewal] }
    AppDeclaration:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1 }
        description: { type: string }
        url: { type: [string, 'null'], format: uri, description: "Where Siren sends the app's requests. Left out, the app holds no address, and an app with features needs one." }
        scopes:
          type: array
          description: The scopes of the app's own API key, such as `event:sale`.
          items: { type: string }
        events:
          type: array
          description: The webhook events the app's subscription receives.
          items: { type: string }
        features:
          type: array
          items: { $ref: '#/components/schemas/AppFeatureDeclaration' }
    AppFeature:
      type: object
      properties:
        id: { type: integer }
        ref: { type: string, description: 'The `app:{id}` a record stores to select the feature.' }
        appId: { type: integer }
        kind: { type: string }
        key: { type: string }
        name: { type: string }
        description: { type: string }
        settings:
          type: object
          properties:
            currencies: { type: array, items: { type: string } }
            answerWindowMinutes: { type: integer }
        status: { type: string }
        entitled: { type: boolean }
        requiredCapability: { type: [string, 'null'] }
        requiredPlan: { type: [string, 'null'], description: 'The plan the feature needs, such as `pro`, when `entitled` is false.' }
    AppFeaturePage:
      allOf:
        - $ref: '#/components/schemas/AppFeature'
        - type: object
          properties:
            uses: { type: integer, minimum: 0 }
            usedBy:
              type: array
              items:
                type: object
                properties:
                  record: { type: string, enum: [program, distributor, autofulfiller] }
                  id: { type: [integer, string], description: An autofulfiller's id is its currency code. }
    AppPlanAccess:
      type: object
      properties:
        entitled: { type: boolean }
        requiredCapability: { type: [string, 'null'] }
        requiredPlan: { type: [string, 'null'] }
    AppFeatureKindEntry:
      allOf:
        - $ref: '#/components/schemas/AppPlanAccess'
        - type: object
          properties:
            kind: { type: string }
            term: { type: string }
            name: { type: string }
            description: { type: string }
            mode: { type: string, enum: [tell, ask] }
            direction: { type: string, enum: [out, in] }
            aliases: { type: array, items: { type: string } }
            docs: { type: [string, 'null'] }
            settings:
              type: array
              items:
                type: object
                properties:
                  field: { type: string }
                  label: { type: string }
                  type: { type: string }
                  required: { type: boolean }
                  min: { type: integer }
                  max: { type: integer }
                  help: { type: string }
    AppCreate:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1 }
        description: { type: string }
        url: { type: [string, 'null'], format: uri }
        scopes: { type: [array, 'null'], items: { type: string }, description: A list, even empty, makes a key. }
        events: { type: [array, 'null'], items: { type: string } }
    AppChange:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1 }
        description: { type: string }
        url: { type: [string, 'null'], format: uri, description: Null removes the address. }
        events: { type: array, items: { type: string } }
        scopes: { type: array, items: { type: string } }
    App:
      type: object
      required: [key, features]
      properties:
        id: { type: integer }
        key: { type: string }
        name: { type: string }
        description: { type: string }
        status: { type: string, enum: [active, inactive] }
        source: { type: string, enum: [code, dashboard, site] }
        url: { type: [string, 'null'] }
        apiKey:
          type: [object, 'null']
          properties:
            id: { type: integer }
            prefix: { type: string }
            lastFour: { type: [string, 'null'] }
            scopes: { type: array, items: { type: string } }
            propertyId: { type: [integer, 'null'] }
            lastUsedAt: { type: [string, 'null'] }
            dateCreated: { type: [string, 'null'] }
        address:
          type: [object, 'null']
          properties:
            id: { type: integer }
            url: { type: string }
            events: { type: array, items: { type: string } }
            status: { type: string, enum: [active, paused] }
            dateCreated: { type: [string, 'null'] }
        eventsAccess: { $ref: '#/components/schemas/AppPlanAccess' }
        events: { type: array, items: { type: string } }
        scopes: { type: array, items: { type: string } }
        apiKeyPrefix: { type: [string, 'null'] }
        needsAttention: { type: integer, minimum: 0, description: 'How many of the app''s requests need a person now (AppSerializer, capture apps-list-200-count-1).' }
        features:
          type: array
          items: { $ref: '#/components/schemas/AppFeature' }
    AppWithSecrets:
      description: An app with the secret of each part the call made, shown this once.
      allOf:
        - $ref: '#/components/schemas/App'
        - type: object
          properties:
            rawKey: { type: string }
            signingSecret: { type: string }
    AppRequestRecord:
      type: object
      properties:
        id: { type: string, pattern: '^apr_[0-9a-f]{32}$' }
        appId: { type: integer }
        feature: { type: string, description: 'The feature, as `app:{id}`.' }
        kind: { type: string }
        mode: { type: string, enum: [tell, ask] }
        subject:
          type: object
          properties:
            type: { type: string }
            id: { type: string }
        status: { type: string, enum: [pending, sent, delivered, answered, applied, needs_attention, dropped] }
        sendCount: { type: integer }
        answerBy: { type: [string, 'null'], format: date-time }
        answeredBy: { type: [string, 'null'], description: '`app:{appId}` or `user:{userId}`.' }
        answeredAt: { type: [string, 'null'], format: date-time }
        lastError: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
    AppRequestDetail:
      allOf:
        - { $ref: '#/components/schemas/AppRequestRecord' }
        - type: object
          required: [data, answer, answeredByUser]
          properties:
            data: { type: object, additionalProperties: true, description: 'The data Siren sent the app, `{}` when there was none.' }
            answer: { type: [object, 'null'], additionalProperties: true, description: 'The answer Siren took, or null before one.' }
            answeredByUser:
              type: [object, 'null']
              description: The person behind a `user:{id}` answer, or null when the app answered, before an answer, or when that user is gone.
              required: [id, email]
              properties:
                id: { type: integer }
                email: { type: string }
    AppAnswer:
      type: object
      required: [outcome]
      additionalProperties: true
      properties:
        outcome: { type: string, minLength: 1 }
    AppAnswerReceipt:
      type: object
      required: [status]
      properties:
        status: { type: string, const: accepted }
        duplicate: { type: boolean, description: True when Siren already had this answer, so nothing more was applied. }
    SalePayload:
      type: object
      description: |
        A real sale requires `source`, `externalId`, `total` and `trackingId`.
        A test sale sends `test: true` and needs no other field.
      properties:
        source:
          type: string
          description: Commerce source identifier.
          example: stripe
        externalId:
          type: [string, number]
          minLength: 1
          maxLength: 32
          description: |
            Your order or transaction id, used to match refunds later. Siren
            also takes a number and stores it as text.
          example: cs_test_a1b2c3
        total:
          type: number
          minimum: 0
          maximum: 999999999.99
          description: Order total in major currency units.
          example: 49.99
        trackingId:
          type: integer
          minimum: 0
          description: Opportunity id from the Siren tracking cookie / attribution.
          example: 4021
        currency:
          type: string
          description: |
            A currency code the organization uses. Every line is recorded in
            it. Without it, the lines read as the organization's default
            currency. A code the organization does not use is refused with 400.
          example: USD
        items:
          type: array
          maxItems: 500
          items: { $ref: '#/components/schemas/LineItem' }
        test:
          type: boolean
          default: false
          description: |
            `true` records a test sale, to check an integration. Siren needs no
            other field, marks the sale as a test, counts it toward nothing and
            ignores `trackingId`. A repeat of a test reads as a pass.
      if:
        required: [test]
        properties:
          test: { const: true }
      else:
        required: [source, externalId, total, trackingId]
    LineItem:
      type: object
      required: [amount]
      properties:
        lineId:
          type: [string, number]
          minLength: 1
          maxLength: 191
          description: |
            Your id for this order line. Siren keeps it on the line, so a later
            refund can name the line by it in `RefundLine.lineId`. Siren stores
            a number as text.
          example: line-1
        externalId: { type: [string, number], maxLength: 255, description: 'Text, or a number that Siren stores as text.' }
        name: { type: [string, number], maxLength: 255, description: 'Text, or a number that Siren stores as text.', example: Pro Plan (annual) }
        quantity: { type: integer, minimum: 1, maximum: 1000000, default: 1 }
        amount:
          type: number
          minimum: 0
          maximum: 999999999.99
          description: Per-unit price in major currency units.
          example: 49.99
    SaleOutcome:
      type: object
      properties:
        status:
          type: string
          enum: [created, recorded, duplicate, unattributed, ignored]
        created: { type: boolean }
        transactionId: { type: [integer, 'null'] }
        conversions:
          type: array
          items:
            type: object
            properties:
              id: { type: integer }
              status: { type: string }
        message: { type: string }
        test: { type: boolean, const: true, description: Sent only on a test sale. }
        reason:
          type: string
          description: Why a recorded sale earned nothing.
          enum: [no_engagement, engagement_used, engagement_ended, not_awarded]
    SiteVisitOutcome:
      type: object
      properties:
        status:
          type: string
          enum: [attributed, recorded, not_attributed, queued]
        attributed: { type: boolean }
        queued: { type: boolean }
        opportunityId: { type: [integer, 'null'] }
        message: { type: string }
        reason:
          type: string
          enum: [collaborator_not_found, collaborator_not_active]
    QueuedOutcome:
      type: object
      properties:
        status: { type: string, const: queued }
        queued: { type: boolean, const: true }
        message: { type: string }
    RefundPayload:
      type: object
      required: [source, externalId, refundId]
      properties:
        source: { type: string, example: stripe }
        externalId: { type: [string, number], minLength: 1, maxLength: 32, example: cs_test_a1b2c3 }
        refundId:
          description: The store's own id for this refund, such as WooCommerce refund 2201. `externalId` names the order and `refundId` names one refund of it. Siren records each refund id once per order.
          type: [string, number]
          minLength: 1
          maxLength: 191
          example: re_3Nf8a2
        amount:
          type: number
          minimum: 0
          maximum: 999999999.99
          description: Money refunded, in major currency units (9.99 = $9.99). Sending it makes the refund partial unless `whole` is `true`.
          example: 20
        currency:
          type: string
          description: |
            A currency code the organization uses, for the amounts. When it is
            left out, Siren reads them in the sale's own currency, or else the
            organization's default.
          example: USD
        lines:
          type: array
          maxItems: 500
          description: The refunded order lines. Sending them makes the refund partial unless `whole` is `true`.
          items: { $ref: '#/components/schemas/RefundLine' }
        whole:
          type: boolean
          description: |
            `true` refunds the whole order, whatever else is sent. A refund
            with neither `amount` nor `lines` is also a whole refund.
        kind:
          type: string
          enum: [refund, cancelled, voided]
          default: refund
          description: How the whole order ended. Siren reads `refund` when it is left out.
    RefundLine:
      type: object
      description: |
        One refunded order line. Name the line by `lineId`, as the sale's item
        sent it, or by `sku`. Siren refuses a line that names neither.
      properties:
        lineId:
          type: [string, number]
          minLength: 1
          maxLength: 191
          description: The sale line's `lineId`. Siren stores a number as text.
          example: line-1
        sku:
          type: [string, number]
          minLength: 1
          maxLength: 191
          description: The product SKU of the line, when the sale sent no `lineId`.
        quantity:
          type: integer
          minimum: 0
          maximum: 1000000
          description: Units returned.
        amount:
          type: number
          minimum: 0
          maximum: 999999999.99
          description: Money refunded for this line, in major currency units.
          example: 20
    SiteVisitedPayload:
      type: object
      required: [collaboratorId]
      properties:
        collaboratorId:
          description: |
            The collaborator to attribute the visit to: their numeric id, or
            one of their tracking codes as `tracking:{code}`, such as
            `tracking:summer-sale`. Siren resolves the code to its collaborator.
          oneOf:
            - { type: integer }
            - { type: string, pattern: '^tracking:.+' }
          example: 88
        userId: { type: integer, example: 12345 }
    WebhookSubscription:
      type: object
      properties:
        id: { type: integer }
        targetUrl: { type: string, format: uri }
        urlValid:
          type: boolean
          description: Whether the stored URL passes the outbound URL rules. A URL that fails gets no deliveries.
        urlProblem: { type: [string, 'null'] }
        events:
          type: array
          items: { $ref: '#/components/schemas/WebhookEventType' }
        description: { type: string }
        status: { type: string, example: active }
        propertyId: { type: [integer, 'null'] }
        oauthClientId: { type: [string, 'null'] }
        appId:
          type: [integer, 'null']
          description: The app that owns the subscription. An app's subscription changes only when the app is declared again, and an update or delete of it gets 409 app_owned_subscription.
        dateCreated: { type: [string, 'null'] }
        dateModified: { type: [string, 'null'] }
    WebhookEventType:
      type: string
      description: |
        A subscribable event type. Use `*` to subscribe to all. The list matches
        Siren's webhook catalog, which `GET /webhooks/events` serves, and Siren
        may add an event there before this list has it.
      enum:
        - '*'
        - allocation.completed
        - collaborator.applied
        - collaborator.created
        - collaborator.deactivated
        - collaborator.declined
        - collaborator.deleted
        - collaborator_group.created
        - collaborator_group.deleted
        - collaborator_group.member_added
        - collaborator_group.member_removed
        - collaborator_group.updated
        - collaborator.joined
        - collaborator.registered
        - collaborator.updated
        - conversion.approved
        - conversion.created
        - conversion.rejected
        - conversion.renewed
        - coupon.applied
        - coupon.linked
        - coupon.merged
        - coupon.unlinked
        - credit.issued
        - credit.redeemed
        - currency.created
        - currency.deleted
        - distribution.completed
        - distributor.created
        - distributor.deleted
        - distributor.updated
        - engagement.awarded
        - engagement.completed
        - engagement.created
        - fulfillment.created
        - fulfillment.updated
        - lead.created
        - metrics.updated
        - obligation.approved
        - obligation.completed
        - obligation.created
        - obligation.rejected
        - obligation.superseded
        - opportunity.created
        - opportunity.invalidated
        - payout.created
        - payout.failed
        - payout.paid
        - payout.waiting
        - product.merged
        - program.created
        - program.deleted
        - program_group.created
        - program_group.deleted
        - program_group.updated
        - program.status_changed
        - program.updated
        - refund.created
        - refund.recorded
        - renewal.created
        - sale.created
        - store.connected
        - store.disconnected
        - transaction.completed
        - transaction.created
    ApiKeyScopeEntry:
      type: object
      description: One scope an app's key may hold, as `GET /apps/scopes` lists it.
      properties:
        scope: { type: string, description: The scope string an app's key may hold., example: 'ledger:conversions:read' }
        resource: { type: string, description: The group the scope belongs to., example: ledger }
        action: { type: string, description: What the scope allows within its group., example: 'conversions:read' }
        label: { type: string, example: Read conversions }
    ErrorCode:
      type: string
      description: |
        The machine-readable `error.code` Siren sends beside a refusal's
        message. Branch on the code, not the message, which can change. A
        reply from an older or newer Siren deployment may carry no code, or a
        code this list lacks.

        401: `site_disconnected` when the organization revoked or deleted the
        connected site's connection, and `api_key_not_accepted` when the route
        takes a dashboard session and not an API key.

        403: `missing_scope` and `store_key_not_allowed` refuse an API key.
        `field_not_allowed`, `pending_status_required`, `user_type_not_allowed`,
        `program_not_on_site`, `collaborator_not_on_site`,
        `site_filter_required`, `report_not_allowed` and `not_permitted` mean
        Siren's policy refused the request, so sending it again fails again.
        `migration_closed`, `plan_required`, `admin_required` and
        `email_confirmation_required` lift once the organization changes.

        409: `code_held` when someone already holds a tracking or coupon code,
        `mapping_exists`, `hold_no_credit` and `hold_token_in_use` when Siren
        refuses a store credit hold, `hold_currency_not_at_store` and
        `currency_resolution_required`.

        422: `invalid_currency_resolution`, `collaborator_deletion_refused` and
        `reserved_address`. 503: `plan_unavailable` when Siren could not read
        the organization's plan.
      enum:
        - site_disconnected
        - api_key_not_accepted
        - missing_scope
        - store_key_not_allowed
        - field_not_allowed
        - pending_status_required
        - user_type_not_allowed
        - program_not_on_site
        - collaborator_not_on_site
        - site_filter_required
        - report_not_allowed
        - not_permitted
        - migration_closed
        - plan_required
        - admin_required
        - email_confirmation_required
        - code_held
        - mapping_exists
        - hold_no_credit
        - hold_token_in_use
        - hold_currency_not_at_store
        - currency_resolution_required
        - invalid_currency_resolution
        - collaborator_deletion_refused
        - reserved_address
        - plan_unavailable
    Error:
      type: object
      description: |
        `error` is polymorphic. Some checks return a plain string message.
        Most return an object with `message`, an optional stable `code`, and
        `context`. A failed validation sets `context.type` to
        `VALIDATION_FAILED` and lists each broken rule in
        `context.failedValidations`. Clients must handle both shapes.

        An API key's refusals carry a stable `code`: `api_key_not_accepted`
        (401) when the route takes a session and not a key, `missing_scope`
        (403) when the key holds none of the route's scopes, with
        `context.scope` and `context.anyOf`, and `store_key_not_allowed`
        (403) when a key bound to one store asks for payouts or webhook
        subscriptions, with `context.propertyId`. Branch on the code, not the
        message.
      properties:
        error:
          oneOf:
            - type: string
            - type: object
              properties:
                message: { type: string }
                code:
                  type: string
                  description: A stable code, one of the `ErrorCode` values when Siren sends one this document lists.
                context:
                  type: [object, array]
                  description: Extra detail. PHP sends an empty context as `[]`.
                  properties:
                    type: { type: string, example: VALIDATION_FAILED }
                    failedValidations:
                      type: array
                      items:
                        type: object
                        properties:
                          field: { type: string }
                          message: { type: string }
                          type: { type: string, example: REQUIRED }
                          context: { type: object, additionalProperties: true }
    Record:
      type: object
      description: |
        A Siren record. The fields present depend on the resource and on the
        `fields` the request asked for.
      additionalProperties: true
    SiteName:
      type: string
      pattern: '^[A-Za-z0-9_-]+$'
      description: |
        A plain type, platform or token: letters, digits, underscores and
        hyphens. Cloud refuses an `@` qualifier or a comma from a connected
        site, and adds the site's Property itself.
    Alias:
      type: object
      properties:
        code: { type: string, example: SAVE10 }
        type: { type: string, description: 'Qualified for a connected site, as in coupon@property:5. The SDK answers the plain type and the Property in propertyId.' }
        collaboratorId: { type: integer }
        dateIssued: { type: string }
    Enrollment:
      type: object
      properties:
        collaboratorId: { type: integer }
        programId: { type: integer }
    GroupMember:
      type: object
      required: [collaboratorId]
      properties:
        collaboratorId: { type: integer, minimum: 1 }
        metadata:
          oneOf:
            - type: object
              additionalProperties: true
            - type: string
    ForwardedEventEnvelope:
      type: object
      description: |
        The versioned envelope a connected site forwards to
        `POST /event/{eventSlug}`, as Siren's `EventWireFormat` reads it.
        The slug is one of the 28 forwarded slugs, such as `sale-triggered`
        or `product-deleted`, and names the shape of `data`. Cloud claims
        each event once per Property, on its natural key or on `eventId`,
        and answers a resend with `status: duplicate`.
      required: [version, eventId, origin, occurredAt, data]
      properties:
        version: { type: integer, const: 1 }
        eventId:
          type: string
          format: uuid
          description: The site's id for this event, the same on every try of it.
        origin: { type: string, const: site }
        occurredAt:
          type: [string, 'null']
          description: ISO 8601 with a `Z` or `+hh:mm` offset, or `null`.
          example: '2026-11-12T09:30:00+00:00'
        data:
          type: object
          additionalProperties: true
          description: The event's fields. Each slug's codec names the keys it takes.
        optional:
          type: object
          additionalProperties: true
          description: Fields a slug takes beside `data`, such as a refund's `refundKind`.
    OAuthClientRegistration:
      type: object
      description: The registered client, as RFC 7591 names its fields.
      required: [client_id]
      properties:
        client_id: { type: string }
        client_name: { type: string }
        redirect_uris:
          type: array
          items: { type: string, format: uri }
        grant_types:
          type: array
          items: { type: string }
        token_endpoint_auth_method: { type: string, example: none }
        scope: { type: string }
        software_id: { type: string, enum: [siren-wordpress, siren-medusa] }
    OAuthToken:
      type: object
      description: A token pair, as RFC 6749 names its fields.
      required: [access_token, refresh_token]
      properties:
        access_token: { type: string }
        token_type: { type: string, example: Bearer }
        expires_in: { type: integer, example: 3600 }
        scope: { type: string }
        refresh_token:
          type: string
          description: The next refresh token. Cloud rotates it on every refresh, so the one sent is spent.
    AppAccessToken:
      type: object
      description: An app's token from the `client_credentials` grant. It has no refresh token, so the app asks again before it runs out.
      required: [access_token, token_type, expires_in]
      properties:
        access_token: { type: string }
        token_type: { type: string, example: Bearer }
        expires_in: { type: integer, description: 1200 for a server token, 600 for a browser token. }
        scope: { type: string, description: "`browser:{eventKey}` for a browser token. Absent for a server token." }
    OAuthError:
      type: object
      description: |
        The RFC 6749 and RFC 7591 error envelope. A refresh refused with
        `invalid_grant` or `invalid_client` means the grant is gone and the
        site connects again.
      required: [error]
      properties:
        error:
          type: string
          enum:
            - invalid_request
            - invalid_grant
            - invalid_client
            - invalid_scope
            - unsupported_grant_type
            - invalid_client_metadata
            - invalid_redirect_uri
        error_description: { type: string }
    ConnectPlan:
      type: object
      required: [status, capabilities, trial, paidPlan, pricingUrl]
      properties:
        status: { type: string, enum: [active, lapsed, none, unrestricted] }
        capabilities:
          type: array
          items: { type: string }
        trial:
          type: object
          required: [active, plan, endsAt, ended]
          properties:
            active: { type: boolean }
            plan: { type: [string, 'null'], description: '`essentials`, `plus` or `pro` during a trial.' }
            endsAt: { type: [string, 'null'], format: date-time }
            ended: { type: boolean }
        paidPlan: { type: [string, 'null'] }
        pricingUrl: { type: string, format: uri }
    ConnectorWebhook:
      description: The site's own webhook subscription, with its Property.
      allOf:
        - { $ref: '#/components/schemas/WebhookSubscription' }
        - type: object
          required: [property]
          properties:
            property:
              type: object
              properties:
                id: { type: integer }
                siteUrl: { type: string, format: uri }
    ConnectorWebhookWithSecret:
      description: The subscription with its new signing secret, shown only in this answer.
      allOf:
        - { $ref: '#/components/schemas/ConnectorWebhook' }
        - type: object
          required: [signingSecret]
          properties:
            signingSecret: { type: string }
    WebhookDelivery:
      type: object
      description: One delivery to an organization's subscription. Dates are `Y-m-d H:i:s` in UTC with no offset.
      properties:
        id: { type: integer }
        webhookSubscriptionId: { type: integer }
        eventType: { type: string }
        eventId: { type: string, description: The `X-Siren-Delivery` value the endpoint received. }
        payload: { type: object, additionalProperties: true }
        status: { type: string, enum: [pending, delivered, failed] }
        attemptCount: { type: integer }
        httpStatusCode: { type: [integer, 'null'] }
        responseBody: { type: [string, 'null'], description: The first 200 bytes of the endpoint's answer. }
        errorMessage: { type: [string, 'null'] }
        nextRetryAt: { type: [string, 'null'] }
        deliveredAt: { type: [string, 'null'] }
        dateCreated: { type: [string, 'null'] }
        dateModified: { type: [string, 'null'] }
    ConnectorWebhookDelivery:
      type: object
      description: One delivery to the site's subscription. Dates are `Y-m-d H:i:s` with no offset.
      properties:
        id: { type: integer }
        webhookSubscriptionId: { type: integer }
        eventType: { type: string }
        eventId: { type: [string, 'null'] }
        payload: { type: [object, 'null'], additionalProperties: true }
        status: { type: string }
        attemptCount: { type: integer }
        httpStatusCode: { type: [integer, 'null'] }
        responseBody: { type: [string, 'null'] }
        errorMessage: { type: [string, 'null'] }
        nextRetryAt: { type: [string, 'null'] }
        deliveredAt: { type: [string, 'null'] }
        dateCreated: { type: [string, 'null'] }
        dateModified: { type: [string, 'null'] }
    CreditBalance:
      type: object
      properties:
        collaboratorId: { type: integer }
        currency: { type: string }
        balance: { type: integer }
        reserved: { type: integer }
        available: { type: integer }
        held:
          type: integer
          description: Credit a store's migration imported that waits for an admin's approval. Not part of the balance.
    CreditHold:
      type: object
      properties:
        id: { type: integer }
        collaboratorId: { type: integer }
        currency: { type: string }
        amount: { type: integer }
        status: { type: string, enum: [active, settled, released, expired] }
        reference: { type: string, example: 'hold:woocommerce@property:5:0b6f3c2e-8a1d-4c55-9a0e-0d6c1b7f4e21' }
        idempotencyKey: { type: [string, 'null'] }
        expiresAt: { type: string }
        createdDate: { type: string }
    HoldReference:
      type: string
      pattern: '^hold:[A-Za-z0-9_-]+:[A-Za-z0-9_-]+$'
      description: A checkout session's hold reference, `hold:{platform}:{token}`, as a site sends it.
      example: hold:woocommerce:0b6f3c2e-8a1d-4c55-9a0e-0d6c1b7f4e21
    Mapping:
      type: object
      properties:
        localId: { type: integer }
        localType: { type: string, example: collaborator }
        externalId: { type: string }
        externalType: { type: string, description: 'Qualified for a connected site, as in wordpress_user@property:5. The SDK answers the plain type and the Property in propertyId.' }
    TransactionDetail:
      type: object
      required: [name, value]
      properties:
        name: { type: string }
        description: { type: string }
        type: { type: string, example: credit }
        value: { type: integer, description: Per-unit value in minor units. }
        quantity: { type: integer, default: 1 }
        units: { type: string, example: USD }
        attributes: { type: object, additionalProperties: true }
  responses:
    PaginatedList:
      description: |
        One page of records in Siren's list envelope. The total also travels
        in the `x-siren-estimated-count` response header.
      headers:
        x-siren-estimated-count: { $ref: '#/components/headers/XSirenEstimatedCount' }
      content:
        application/json:
          schema:
            type: object
            properties:
              items:
                type: array
                items: { type: object, additionalProperties: true }
              total: { type: integer }
              page: { type: integer }
              perPage: { type: integer }
              totalPages: { type: integer }
    Queued:
      description: |
        The organization's engine is paused, so Siren queued the event and
        will process it once the organization can run again. Do not resend it.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/QueuedOutcome' }
    Unauthorized:
      description: |
        Missing, invalid, expired or revoked credential. A valid API key sent
        to a route that takes a session gets `error.code`
        `api_key_not_accepted`. A connected site whose connection the
        organization revoked or deleted gets `site_disconnected`.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: |
        The credential may not do this. For an API key, `error.code`
        `missing_scope` means the key holds none of the route's scopes,
        `error.context.scope` names one and `error.context.anyOf` lists every
        scope that opens the route. `store_key_not_allowed` means a key bound
        to one store asked for payouts or webhook subscriptions, which are
        not kept by store. A policy code, such as `field_not_allowed` with
        `error.context.param` naming the field, means Siren refuses the
        request itself, so sending it again fails again. `ErrorCode` lists
        every code.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Record:
      description: A record, or the result of an action.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Record' }
    Deleted:
      description: Removed, or nothing matched.
      content:
        application/json:
          schema:
            type: object
            properties:
              deleted: { type: boolean, const: true }
    AppRefused:
      description: Siren refused the app call. `error.code` says why, and `AppErrorCode` in the SDK lists the codes.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    BadRequest:
      description: A query parameter is out of range, such as `number` below 1 or a negative `offset`.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: The record would duplicate one that exists.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ValidationError:
      description: |
        The request failed validation (400). `error.context.type` is
        `VALIDATION_FAILED` and `error.context.failedValidations` names each
        field.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    RateLimited:
      description: |
        Too many requests, or the organization's engine is paused and its
        event queue is full.
      headers:
        Retry-After:
          schema: { type: integer }
          description: Seconds to wait before retrying.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    OAuthRefused:
      description: |
        Cloud refused the OAuth call, with the RFC error envelope. The SDK
        raises it as `OAuthError`.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/OAuthError' }
