openapi: 3.1.0
info:
  title: Siren Affiliate Platform API
  version: 0.1.0
  summary: Headless affiliate & incentive tracking API for the Siren SaaS.
  description: |
    The Siren API lets any commerce stack record sales, refunds, and referred
    visits, subscribe to program events via signed webhooks, and reconcile
    Siren's ledger against its own.

    This document describes the **developer-facing surface**: event ingestion,
    webhooks, API keys, and read endpoints for reconciliation. The full admin
    surface used by the Siren dashboard is intentionally out of scope here.

    Every request sends a bearer token (`Authorization: Bearer ...`). On Siren
    Cloud an API key (`sk_live_...`) authenticates event ingestion
    (`POST /event/{eventSlug}`) and `GET /ping`, and nothing else. The
    webhook, API key and reconciliation routes need a signed-in session
    token, and answer 401 to an API key. The reconciliation routes also take
    a connected site's OAuth token that holds `connect:records:read`. Each
    operation lists the credentials it takes in its `security`.

    Success bodies are bare: a record is a JSON object and a reconciliation
    list is `{ items, total, page, perPage, totalPages }`. There is no
    `{ "data": ... }` wrapper. Failures send `{ "error": "message" }` or
    `{ "error": { "message", "code"?, "context" } }`. A failed validation is
    a 400 whose `context.type` is `VALIDATION_FAILED`.
  contact:
    name: Siren
    url: https://sirenaffiliates.com
  license:
    name: Proprietary
servers:
  - url: https://api.sirenaffiliates.com/siren/v1
    description: Production
  - url: http://localhost:8080/siren/v1
    description: Local development
security:
  - dashboardSession: []
tags:
  - name: Events
    description: Ingest commerce and tracking events.
  - name: Webhooks
    description: Subscribe to program events; delivered as signed HTTP callbacks.
  - name: API Keys
    description: Manage API keys.
  - name: Reconciliation
    description: Read Siren's ledger to reconcile against your own records.
paths:
  /event/sale:
    post:
      tags: [Events]
      operationId: recordSale
      summary: Record a completed sale
      description: |
        Records a sale so conversions and payouts compute for the attributed
        collaborator. `total` is in major currency units (9.99 = $9.99). If
        `items` are supplied, reward pools compute `amount × quantity` per line;
        otherwise `total` is treated as one line. The opportunity id is returned
        in the `X-Siren-OID` response header. Sending the same `source` and
        `externalId` again records nothing and answers `status: duplicate`.
      security:
        - apiKey: []
        - dashboardSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SalePayload' }
      responses:
        '200':
          description: Sale processed. The body says what Siren recorded.
          headers:
            X-Siren-OID: { $ref: '#/components/headers/XSirenOID' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SaleOutcome' }
        '202': { $ref: '#/components/responses/Queued' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /event/refund:
    post:
      tags: [Events]
      operationId: recordRefund
      summary: Record a refund
      description: |
        Reverses a previously recorded sale, matched by `(externalId, source)`.
        Returns 404 if no matching sale transaction exists.
      security:
        - apiKey: []
        - dashboardSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefundPayload' }
      responses:
        '200':
          description: Refund accepted. The body is empty.
          headers:
            X-Siren-OID: { $ref: '#/components/headers/XSirenOID' }
        '202': { $ref: '#/components/responses/Queued' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /event/site-visited:
    post:
      tags: [Events]
      operationId: recordSiteVisited
      summary: Record a referred visit
      description: |
        Records a referred visit and opens an opportunity attributed to the
        given collaborator. A collaborator who does not exist or is not
        active gets nothing written and `status: not_attributed`.
      security:
        - apiKey: []
        - connectorToken: []
        - dashboardSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SiteVisitedPayload' }
      responses:
        '200':
          description: Visit processed. The body says what Siren recorded.
          headers:
            X-Siren-OID: { $ref: '#/components/headers/XSirenOID' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SiteVisitOutcome' }
        '202':
          description: |
            The organization's engine is paused, so the visit was queued. The
            body carries `status: queued`, `queued: true` and the
            `opportunityId` the visit will be recorded on.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SiteVisitOutcome' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /event/{eventSlug}:
    post:
      tags: [Events]
      operationId: recordEvent
      summary: Record a custom event
      description: |
        Ingests any event type registered on the organization, including custom
        event types. The three built-in slugs are `sale`, `refund`, and
        `site-visited`. The API key needs `event:*` or `event:{eventSlug}`. The
        events a connected WordPress site forwards, such as `sale-triggered`,
        need their exact scope.
      security:
        - apiKey: []
        - connectorToken: []
        - dashboardSession: []
      parameters:
        - name: eventSlug
          in: path
          required: true
          schema: { type: string }
          example: loyalty-points-earned
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: Event accepted.
          headers:
            X-Siren-OID: { $ref: '#/components/headers/XSirenOID' }
        '202': { $ref: '#/components/responses/Queued' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /ping:
    get:
      tags: [Events]
      operationId: ping
      summary: Check a credential
      description: |
        Answers with the organization the credential belongs to, so a sender
        can check its API key before it sends events.
      security:
        - apiKey: []
        - connectorToken: []
        - dashboardSession: []
      responses:
        '200':
          description: The credential works.
          content:
            application/json:
              schema:
                type: object
                required: [ok, org]
                properties:
                  ok: { type: boolean, const: true }
                  org:
                    type: object
                    properties:
                      id: { type: integer }
                      name: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /webhooks:
    get:
      tags: [Webhooks]
      operationId: listWebhookSubscriptions
      summary: List webhook subscriptions
      description: |
        Oldest first. Pages with `number` (default 200, and a size above 200
        is lowered to 200) and `offset`.
        The `x-siren-estimated-count` header carries the total.
      security:
        - dashboardSession: []
      parameters:
        - { $ref: '#/components/parameters/Offset' }
        - name: number
          in: query
          schema: { type: integer, minimum: 1, default: 200 }
      responses:
        '200':
          description: Subscriptions (bare array).
          headers:
            x-siren-estimated-count: { $ref: '#/components/headers/XSirenEstimatedCount' }
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/WebhookSubscription' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Webhooks]
      operationId: createWebhookSubscription
      summary: Create a webhook subscription
      description: |
        Registers a URL to receive event callbacks. The response includes
        `signingSecret`, returned **once** — store it to verify future
        deliveries. Each delivery is a POST whose body is the event payload
        itself. The headers carry the rest:
        `X-Siren-Signature: sha256=<hmac-sha256(rawBody, signingSecret)>`,
        `X-Siren-Event` (the event type) and `X-Siren-Delivery` (`evt_` and 32
        hex characters, for skipping repeats). An organization holds at most
        100 subscriptions. Siren does not check `events` against
        `GET /webhooks/events`, so an unknown name is stored and never fires.
      security:
        - dashboardSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WebhookSubscriptionCreate' }
      responses:
        '201':
          description: Subscription created.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/WebhookSubscription'
                  - type: object
                    properties:
                      signingSecret:
                        type: string
                        description: HMAC signing secret. Returned once.
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /webhooks/events:
    get:
      tags: [Webhooks]
      operationId: listWebhookEventTypes
      summary: List the event types a subscription can receive
      description: Exactly the events Siren sends, in the order the dashboard shows them.
      security:
        - dashboardSession: []
      responses:
        '200':
          description: Event types (bare array).
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    event: { $ref: '#/components/schemas/WebhookEventType' }
                    category: { type: string, example: Conversions }
                    label: { type: string, example: A conversion was approved }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /webhooks/{id}:
    get:
      tags: [Webhooks]
      operationId: getWebhookSubscription
      summary: Get a webhook subscription
      security:
        - dashboardSession: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: Subscription (bare object).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebhookSubscription' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Webhooks]
      operationId: deleteWebhookSubscription
      summary: Delete a webhook subscription
      security:
        - dashboardSession: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: Deleted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, const: true }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api-keys:
    get:
      tags: [API Keys]
      operationId: listApiKeys
      summary: List API keys
      description: |
        Oldest first. Pages with `number` (default 200, and a size above 200
        is lowered to 200) and `offset`.
        The `x-siren-estimated-count` header carries the total.
      security:
        - dashboardSession: []
      parameters:
        - { $ref: '#/components/parameters/Offset' }
        - name: number
          in: query
          schema: { type: integer, minimum: 1, default: 200 }
      responses:
        '200':
          description: API keys (bare array, without raw key material).
          headers:
            x-siren-estimated-count: { $ref: '#/components/headers/XSirenEstimatedCount' }
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ApiKey' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [API Keys]
      operationId: createApiKey
      summary: Create an API key
      description: |
        Creates a new API key. The plaintext `rawKey` (`sk_live_...`) is
        returned **once** and cannot be retrieved later. A key sends events and
        nothing else, so `scopes` takes event scopes only (`event:*`,
        `event:{slug}`, or the older `*`). An organization holds at most 250
        active keys.
      security:
        - dashboardSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApiKeyCreate' }
      responses:
        '201':
          description: API key created.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiKey'
                  - type: object
                    properties:
                      rawKey:
                        type: string
                        description: Plaintext key. Returned once.
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api-keys/{id}:
    delete:
      tags: [API Keys]
      operationId: revokeApiKey
      summary: Revoke an API key
      security:
        - dashboardSession: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: Revoked. The body is the key with `status` set to `revoked`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiKey' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /conversions:
    get:
      tags: [Reconciliation]
      operationId: listConversions
      summary: List conversions
      security:
        - dashboardSession: []
        - connectorToken: []
      parameters:
        - { $ref: '#/components/parameters/Number' }
        - { $ref: '#/components/parameters/Offset' }
      responses:
        '200': { $ref: '#/components/responses/PaginatedList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /transactions:
    get:
      tags: [Reconciliation]
      operationId: listTransactions
      summary: List transactions
      security:
        - dashboardSession: []
        - connectorToken: []
      parameters:
        - { $ref: '#/components/parameters/Number' }
        - { $ref: '#/components/parameters/Offset' }
      responses:
        '200': { $ref: '#/components/responses/PaginatedList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /obligations:
    get:
      tags: [Reconciliation]
      operationId: listObligations
      summary: List obligations
      security:
        - dashboardSession: []
        - connectorToken: []
      parameters:
        - { $ref: '#/components/parameters/Number' }
        - { $ref: '#/components/parameters/Offset' }
      responses:
        '200': { $ref: '#/components/responses/PaginatedList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /payouts:
    get:
      tags: [Reconciliation]
      operationId: listPayouts
      summary: List payouts
      security:
        - dashboardSession: []
        - connectorToken: []
      parameters:
        - { $ref: '#/components/parameters/Number' }
        - { $ref: '#/components/parameters/Offset' }
      responses:
        '200': { $ref: '#/components/responses/PaginatedList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
components:
  securitySchemes:
    apiKey:
      type: http
      scheme: bearer
      bearerFormat: sk_live_...
      description: |
        An API key minted in the Siren dashboard or via createApiKey. It sends
        events and is refused on every other route.
    dashboardSession:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        The access token of a person signed in to the Siren dashboard. Some
        routes need the admin role, and refuse other roles with a 403 whose
        code is `admin_required`.
    connectorToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        A connected site's OAuth access token, issued when an organization
        admin approves the site. The reconciliation routes take it when it
        holds `connect:records:read`.
  headers:
    XSirenOID:
      description: The opportunity (tracking) id associated with the event.
      schema: { type: integer }
    XSirenEstimatedCount:
      description: Total number of records across all pages.
      schema: { type: integer }
  parameters:
    Number:
      name: number
      in: query
      description: Page size. A value above 200 is lowered to 200. Below 1 is refused with 400.
      schema: { type: integer, minimum: 1, default: 10 }
    Offset:
      name: offset
      in: query
      description: The first row to return.
      schema: { type: integer, minimum: 0, default: 0 }
  schemas:
    SalePayload:
      type: object
      required: [source, externalId, total, trackingId]
      properties:
        source:
          type: string
          description: Commerce source identifier.
          example: stripe
        externalId:
          type: [string, number]
          minLength: 1
          maxLength: 32
          description: |
            Your order or transaction id, used to match refunds later. Siren
            also takes a number and stores it as text.
          example: cs_test_a1b2c3
        total:
          type: number
          minimum: 0
          maximum: 999999999.99
          description: Order total in major currency units.
          example: 49.99
        trackingId:
          type: integer
          minimum: 0
          description: Opportunity id from the Siren tracking cookie / attribution.
          example: 4021
        currency:
          type: string
          description: |
            A currency code the organization uses. Every line is recorded in
            it. Without it, the lines read as the organization's default
            currency. A code the organization does not use is refused with 400.
          example: USD
        items:
          type: array
          maxItems: 500
          items: { $ref: '#/components/schemas/LineItem' }
    LineItem:
      type: object
      required: [amount]
      properties:
        externalId: { type: [string, number], maxLength: 255, description: 'Text, or a number that Siren stores as text.' }
        name: { type: [string, number], maxLength: 255, description: 'Text, or a number that Siren stores as text.', example: Pro Plan (annual) }
        quantity: { type: integer, minimum: 1, maximum: 1000000, default: 1 }
        amount:
          type: number
          minimum: 0
          maximum: 999999999.99
          description: Per-unit price in major currency units.
          example: 49.99
    SaleOutcome:
      type: object
      properties:
        status:
          type: string
          enum: [created, recorded, duplicate, unattributed, ignored]
        created: { type: boolean }
        transactionId: { type: [integer, 'null'] }
        conversions:
          type: array
          items:
            type: object
            properties:
              id: { type: integer }
              status: { type: string }
        message: { type: string }
        reason:
          type: string
          description: Why a recorded sale earned nothing.
          enum: [no_engagement, engagement_used, engagement_ended, not_awarded]
    SiteVisitOutcome:
      type: object
      properties:
        status:
          type: string
          enum: [attributed, recorded, not_attributed, queued]
        attributed: { type: boolean }
        queued: { type: boolean }
        opportunityId: { type: [integer, 'null'] }
        message: { type: string }
        reason:
          type: string
          enum: [collaborator_not_found, collaborator_not_active]
    QueuedOutcome:
      type: object
      properties:
        status: { type: string, const: queued }
        queued: { type: boolean, const: true }
        message: { type: string }
    RefundPayload:
      type: object
      required: [source, externalId]
      properties:
        source: { type: string, example: stripe }
        externalId: { type: [string, number], minLength: 1, maxLength: 32, example: cs_test_a1b2c3 }
    SiteVisitedPayload:
      type: object
      required: [collaboratorId]
      properties:
        collaboratorId: { type: integer, example: 88 }
        userId: { type: integer, example: 12345 }
    WebhookSubscription:
      type: object
      properties:
        id: { type: integer }
        targetUrl: { type: string, format: uri }
        urlValid:
          type: boolean
          description: Whether the stored URL passes the outbound URL rules. A URL that fails gets no deliveries.
        urlProblem: { type: [string, 'null'] }
        events:
          type: array
          items: { $ref: '#/components/schemas/WebhookEventType' }
        description: { type: string }
        status: { type: string, example: active }
        propertyId: { type: [integer, 'null'] }
        oauthClientId: { type: [string, 'null'] }
        dateCreated: { type: [string, 'null'] }
        dateModified: { type: [string, 'null'] }
    WebhookSubscriptionCreate:
      type: object
      required: [targetUrl, events]
      properties:
        targetUrl: { type: string, format: uri, example: https://example.com/webhooks/siren }
        events:
          type: array
          items: { $ref: '#/components/schemas/WebhookEventType' }
          example: ['conversion.approved', 'payout.paid']
        description: { type: string }
    WebhookEventType:
      type: string
      description: A subscribable event type. Use `*` to subscribe to all.
      enum:
        - '*'
        - allocation.completed
        - collaborator.created
        - collaborator.deactivated
        - collaborator.registered
        - collaborator.updated
        - conversion.approved
        - conversion.created
        - conversion.rejected
        - conversion.renewed
        - coupon.applied
        - credit.issued
        - credit.redeemed
        - currency.created
        - currency.deleted
        - distribution.completed
        - engagement.awarded
        - engagement.completed
        - engagement.created
        - fulfillment.created
        - fulfillment.updated
        - lead.created
        - metrics.updated
        - obligation.completed
        - obligation.created
        - opportunity.created
        - opportunity.invalidated
        - payout.created
        - payout.paid
        - program.created
        - refund.created
        - renewal.created
        - sale.created
        - transaction.completed
        - transaction.created
    ApiKey:
      type: object
      properties:
        id: { type: integer }
        keyPrefix: { type: string, example: sk_live_a1b2c3d4 }
        label: { type: string }
        status: { type: string, enum: [active, revoked] }
        propertyId: { type: [integer, 'null'] }
        scopes:
          type: array
          items: { type: string }
        expiresAt: { type: [string, 'null'] }
        lastUsedAt: { type: [string, 'null'] }
        revokedAt: { type: [string, 'null'] }
        dateCreated: { type: [string, 'null'] }
        dateModified: { type: [string, 'null'] }
    ApiKeyCreate:
      type: object
      required: [scopes]
      properties:
        label: { type: string, example: Production server }
        scopes:
          type: array
          minItems: 1
          items: { type: string }
          example: ['event:sale', 'event:refund']
          description: Event scopes only. A resource scope such as `programs:read` is refused with 400.
        expiresAt:
          type: string
          description: ISO 8601 date in the future. Omit for a key that never expires.
        propertyId:
          type: integer
          minimum: 1
          description: Bind the key to one of the organization's Properties.
    Error:
      type: object
      description: |
        `error` is polymorphic. Some checks return a plain string message.
        Most return an object with `message`, an optional stable `code`, and
        `context`. A failed validation sets `context.type` to
        `VALIDATION_FAILED` and lists each broken rule in
        `context.failedValidations`. Clients must handle both shapes.
      properties:
        error:
          oneOf:
            - type: string
            - type: object
              properties:
                message: { type: string }
                code: { type: string }
                context:
                  type: [object, array]
                  description: Extra detail. PHP sends an empty context as `[]`.
                  properties:
                    type: { type: string, example: VALIDATION_FAILED }
                    failedValidations:
                      type: array
                      items:
                        type: object
                        properties:
                          field: { type: string }
                          message: { type: string }
                          type: { type: string, example: REQUIRED }
                          context: { type: object, additionalProperties: true }
  responses:
    PaginatedList:
      description: |
        One page of records in Siren's list envelope. The total also travels
        in the `x-siren-estimated-count` response header.
      headers:
        x-siren-estimated-count: { $ref: '#/components/headers/XSirenEstimatedCount' }
      content:
        application/json:
          schema:
            type: object
            properties:
              items:
                type: array
                items: { type: object, additionalProperties: true }
              total: { type: integer }
              page: { type: integer }
              perPage: { type: integer }
              totalPages: { type: integer }
    Queued:
      description: |
        The organization's engine is paused, so Siren queued the event and
        will process it once the organization can run again. Do not resend it.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/QueuedOutcome' }
    Unauthorized:
      description: |
        Missing or invalid credential. On Siren Cloud an API key on any route
        but event ingestion also gets 401.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: The credential may not do this, such as an API key without the event's scope.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ValidationError:
      description: |
        The request failed validation (400). `error.context.type` is
        `VALIDATION_FAILED` and `error.context.failedValidations` names each
        field.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    RateLimited:
      description: |
        Too many requests, or the organization's engine is paused and its
        event queue is full.
      headers:
        Retry-After:
          schema: { type: integer }
          description: Seconds to wait before retrying.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
