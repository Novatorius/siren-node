openapi: 3.1.0
info:
  title: Siren Affiliate Platform API
  version: 0.3.0
  summary: Headless affiliate & incentive tracking API for the Siren SaaS.
  description: |
    The Siren API lets any commerce stack record sales, refunds, and referred
    visits, subscribe to program events via signed webhooks, and reconcile
    Siren's ledger against its own.

    This document describes the **developer-facing surface**: event ingestion,
    webhooks, API keys, read endpoints for reconciliation, and the record
    routes a connector reads and writes: collaborators with their codes and
    program enrollments, collaborator groups with their members, programs,
    program groups, opportunities, engagements, conversion and transaction
    writes, distributors, custom currencies, store credit, mappings and the
    shared settings. The rest of the admin surface used by the Siren
    dashboard is out of scope here.

    Every request sends a bearer token (`Authorization: Bearer ...`). An API
    key (`sk_live_...`) sends events (`POST /event/{eventSlug}`) with an
    event scope and calls `GET /ping`. With a ledger scope it reads
    conversions, transactions, obligations and payouts, and with a webhook
    scope it reads and manages webhook subscriptions. Every other route,
    the API key routes included, answers an API key with 401
    `api_key_not_accepted`. Those take a signed-in dashboard session's
    token. The reconciliation routes also take a connected site's OAuth
    token that holds `connect:records:read`. Each operation lists the
    credentials it takes in its `security`, and the scopes an API key needs.
    The record routes take a dashboard session's token, and a connected
    site's token on the routes Siren opens to sites, with
    `connect:records:read` for reads and `connect:records:write` for writes.
    A site creates collaborators only as `pending` and updates only
    `fullName` and `nickname`.

    A connected site registers through `/oauth/register` and gets its token
    pair from `/oauth/token`, both public. With that token it calls the
    `/connect/*` routes, each with the one `connect` scope it names, and
    forwards its events to `POST /event/{eventSlug}` with `connect:ingest`.

    Success bodies are bare: a record is a JSON object and a reconciliation
    list is `{ items, total, page, perPage, totalPages }`. There is no
    `{ "data": ... }` wrapper. Failures send `{ "error": "message" }` or
    `{ "error": { "message", "code"?, "context" } }`. A failed validation is
    a 400 whose `context.type` is `VALIDATION_FAILED`.
  contact:
    name: Siren
    url: https://sirenaffiliates.com
  license:
    name: Proprietary
servers:
  - url: https://api.sirenaffiliates.com/siren/v1
    description: Production
  - url: http://localhost:8080/siren/v1
    description: Local development
security:
  - dashboardSession: []
tags:
  - name: Events
    description: Ingest commerce and tracking events.
  - name: Webhooks
    description: Subscribe to program events; delivered as signed HTTP callbacks.
  - name: API Keys
    description: Manage API keys.
  - name: Reconciliation
    description: Read Siren's ledger to reconcile against your own records.
  - name: OAuth
    description: Register a connected site and get its tokens.
  - name: Connected sites
    description: The routes a connected site calls with its OAuth token.
  - name: Collaborators
    description: |
      Affiliates and partners. Tracking and coupon codes live on
      `/collaborator-aliases` and program enrollments on
      `/collaborator-programs`. The collaborator record also carries them in
      its `aliases`, `referralCode` and `programs` fields.
  - name: Collaborator Groups
    description: Named sets of collaborators that programs and distributors target.
  - name: Programs
    description: Incentive rules that turn engagements into rewards.
  - name: Program Groups
    description: Sets of programs that compete for the same engagement.
  - name: Opportunities
    description: A tracked visitor's chance to convert.
  - name: Transactions
    description: Transactions and their line-item details.
  - name: Conversions
    description: Engagements that turned into a reward.
  - name: Engagements
    description: A collaborator's claim on an opportunity in one program. Read only.
  - name: Distributors
    description: Revenue pools shared among collaborators on a schedule.
  - name: Custom Currencies
    description: Points, store credit, and other organization-defined units, keyed by code.
  - name: Credits
    description: Store credit balances, ledger entries, checkout holds, and adjustments.
  - name: Mappings
    description: Links between collaborators and records outside Siren, such as WordPress users and products.
  - name: Settings
    description: The organization settings Siren shares with a connected site.
paths:
  /event/sale:
    post:
      tags: [Events]
      operationId: recordSale
      summary: Record a completed sale
      description: |
        Records a sale so conversions and payouts compute for the attributed
        collaborator. `total` is in major currency units (9.99 = $9.99). If
        `items` are supplied, reward pools compute `amount × quantity` per line;
        otherwise `total` is treated as one line. The opportunity id is returned
        in the `X-Siren-OID` response header. Sending the same `source` and
        `externalId` again records nothing and answers `status: duplicate`.

        A test sale sends `test: true` to check an integration, and needs no
        other field. Siren marks it as a test, counts it toward nothing,
        ignores `trackingId` so a real visit is never spent, and reads a
        repeat as a pass. Its answer carries `test: true`.
      security:
        - apiKey: []
        - dashboardSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SalePayload' }
      responses:
        '200':
          description: Sale processed. The body says what Siren recorded.
          headers:
            X-Siren-OID: { $ref: '#/components/headers/XSirenOID' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SaleOutcome' }
        '202': { $ref: '#/components/responses/Queued' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /event/refund:
    post:
      tags: [Events]
      operationId: recordRefund
      summary: Record a refund
      description: |
        Records a refund of a previously recorded sale, matched by
        `(externalId, source)`, and named by `refundId`, the store's own id for
        this refund. Siren records each refund id once per order, so sending
        the same refund again is safe. Returns 404 if no matching sale
        transaction exists.

        Siren refunds the whole order when `whole` is `true`, or when neither
        `amount` nor `lines` is sent. `kind` then says how the order ended.
        Anything else refunds part of the order: `amount` is the money
        refunded, and `lines` names each refunded line by the sale item's
        `lineId` or by `sku`. A partial refund that leaves the order worth
        nothing counts as a whole refund.
      security:
        - apiKey: []
        - dashboardSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefundPayload' }
      responses:
        '200':
          description: Refund accepted. The body is empty.
          headers:
            X-Siren-OID: { $ref: '#/components/headers/XSirenOID' }
        '202': { $ref: '#/components/responses/Queued' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /event/site-visited:
    post:
      tags: [Events]
      operationId: recordSiteVisited
      summary: Record a referred visit
      description: |
        Records a referred visit and opens an opportunity attributed to the
        given collaborator. `collaboratorId` takes the collaborator's numeric
        id, or one of their tracking codes as `tracking:{code}`, which Siren
        resolves to its collaborator. A collaborator who does not exist or is
        not active gets nothing written and `status: not_attributed`.

        Siren records every visit it receives, so send a visit once. A visit
        sent again after a lost reply is recorded twice.

        A visit from a shopper who already holds a tracking value carries it
        in a request header, so Siren adds the visit to that opportunity.
      security:
        - apiKey: []
        - connectorToken: []
        - dashboardSession: []
      parameters:
        - name: X-Siren-Token
          in: header
          required: false
          description: A signed tracking token the shopper already holds, such as `318.4f2a9c`.
          schema: { type: string }
        - name: X-Siren-Oid
          in: header
          required: false
          description: A bare opportunity id the shopper already holds, kept from before Siren signed them.
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SiteVisitedPayload' }
      responses:
        '200':
          description: Visit processed. The body says what Siren recorded.
          headers:
            X-Siren-OID: { $ref: '#/components/headers/XSirenOID' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SiteVisitOutcome' }
        '202':
          description: |
            The organization's engine is paused, so the visit was queued. The
            body carries `status: queued`, `queued: true` and the
            `opportunityId` the visit will be recorded on.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SiteVisitOutcome' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /event/{eventSlug}:
    post:
      tags: [Events]
      operationId: recordEvent
      summary: Record a custom event
      description: |
        Ingests any event type registered on the organization, including custom
        event types. The three built-in slugs are `sale`, `refund`, and
        `site-visited`. The API key needs `event:*` or `event:{eventSlug}`. The
        events a connected site forwards, such as `sale-triggered`, need their
        exact scope on an API key.

        A connected site forwards each event in a `ForwardedEventEnvelope`
        with its OAuth token, which needs `connect:ingest`. The site's outbox
        resends a failed event with the same `eventId` and the same token,
        and Cloud answers a resend it already recorded with
        `status: duplicate`. A 500 whose `error.context.reason` is
        `waiting_for_record`, or a 404 `reference_not_found`, means the
        outbox tries again later. On its last try the outbox sends the final
        attempt header below.
      security:
        - apiKey: []
        - connectorToken: [connect:ingest]
        - dashboardSession: []
      parameters:
        - name: eventSlug
          in: path
          required: true
          schema: { type: string }
          example: loyalty-points-earned
        - name: X-Siren-Final-Attempt
          in: header
          required: false
          description: |
            `1` on the last try a connected site's outbox makes of a
            forwarded event, so Cloud logs an event it will never record.
            Left out on every other send.
          schema: { type: string, enum: ['1'] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              anyOf:
                - $ref: '#/components/schemas/ForwardedEventEnvelope'
                - type: object
                  additionalProperties: true
      responses:
        '200':
          description: Event accepted.
          headers:
            X-Siren-OID: { $ref: '#/components/headers/XSirenOID' }
        '202': { $ref: '#/components/responses/Queued' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /ping:
    get:
      tags: [Events]
      operationId: ping
      summary: Check a credential
      description: |
        Answers with the organization the credential belongs to, so a sender
        can check its API key before it sends events.
      security:
        - apiKey: []
        - connectorToken: []
        - dashboardSession: []
      responses:
        '200':
          description: The credential works.
          content:
            application/json:
              schema:
                type: object
                required: [ok, org]
                properties:
                  ok: { type: boolean, const: true }
                  org:
                    type: object
                    properties:
                      id: { type: integer }
                      name: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /webhooks:
    get:
      tags: [Webhooks]
      operationId: listWebhookSubscriptions
      summary: List webhook subscriptions
      description: |
        Oldest first. Pages with `number` (default 200, and a size above 200
        is lowered to 200) and `offset`.
        The `x-siren-estimated-count` header carries the total.

        An API key needs `webhook-subscriptions:read` or
        `webhook-subscriptions:manage`, and must be organization-wide. A key
        bound to one store is refused with 403 `store_key_not_allowed`.
      security:
        - apiKey: ['webhook-subscriptions:read']
        - apiKey: ['webhook-subscriptions:manage']
        - dashboardSession: []
      parameters:
        - { $ref: '#/components/parameters/Offset' }
        - name: number
          in: query
          schema: { type: integer, minimum: 1, default: 200 }
      responses:
        '200':
          description: Subscriptions (bare array).
          headers:
            x-siren-estimated-count: { $ref: '#/components/headers/XSirenEstimatedCount' }
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/WebhookSubscription' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Webhooks]
      operationId: createWebhookSubscription
      summary: Create a webhook subscription
      description: |
        Registers a URL to receive event callbacks. The response includes
        `signingSecret`, returned **once** — store it to verify future
        deliveries. Each delivery is a POST whose body is the event payload
        itself. The headers carry the rest:
        `X-Siren-Signature: sha256=<hmac-sha256(rawBody, signingSecret)>`,
        `X-Siren-Event` (the event type) and `X-Siren-Delivery` (`evt_` and 32
        hex characters, for skipping repeats). An organization holds at most
        100 subscriptions. Siren does not check `events` against
        `GET /webhooks/events`, so an unknown name is stored and never fires.

        An API key needs `webhook-subscriptions:manage`, and must be
        organization-wide. A key bound to one store is refused with 403
        `store_key_not_allowed`.
      security:
        - apiKey: ['webhook-subscriptions:manage']
        - dashboardSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WebhookSubscriptionCreate' }
      responses:
        '201':
          description: Subscription created.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/WebhookSubscription'
                  - type: object
                    properties:
                      signingSecret:
                        type: string
                        description: HMAC signing secret. Returned once.
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /webhooks/events:
    get:
      tags: [Webhooks]
      operationId: listWebhookEventTypes
      summary: List the event types a subscription can receive
      description: |
        Exactly the events Siren sends, in the order the dashboard shows them.

        An API key needs `webhook-subscriptions:read` or
        `webhook-subscriptions:manage`, and must be organization-wide. A key
        bound to one store is refused with 403 `store_key_not_allowed`.
      security:
        - apiKey: ['webhook-subscriptions:read']
        - apiKey: ['webhook-subscriptions:manage']
        - dashboardSession: []
      responses:
        '200':
          description: Event types (bare array).
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    event: { $ref: '#/components/schemas/WebhookEventType' }
                    category: { type: string, example: Conversions }
                    label: { type: string, example: A conversion was approved }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /webhooks/{id}:
    get:
      tags: [Webhooks]
      operationId: getWebhookSubscription
      summary: Get a webhook subscription
      description: |
        An API key needs `webhook-subscriptions:read` or
        `webhook-subscriptions:manage`, and must be organization-wide. A key
        bound to one store is refused with 403 `store_key_not_allowed`.
      security:
        - apiKey: ['webhook-subscriptions:read']
        - apiKey: ['webhook-subscriptions:manage']
        - dashboardSession: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: Subscription (bare object).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebhookSubscription' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Webhooks]
      operationId: deleteWebhookSubscription
      summary: Delete a webhook subscription
      description: |
        An API key needs `webhook-subscriptions:manage`, and must be
        organization-wide. A key bound to one store is refused with 403
        `store_key_not_allowed`.
      security:
        - apiKey: ['webhook-subscriptions:manage']
        - dashboardSession: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: Deleted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, const: true }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /webhooks/{id}/test:
    post:
      tags: [Webhooks]
      operationId: sendWebhookTest
      summary: Send a test delivery
      description: |
        Sends the subscription one signed sample delivery now. Siren answers
        200 whatever the endpoint answered, with what came of it, and the
        test shows in the subscription's delivery history. Siren answers 404
        for a subscription the organization does not have and 409 for a
        paused one. Each test makes Siren send a request, so the number of
        tests per hour is limited, and Siren answers 429 past it.

        An API key needs `webhook-subscriptions:manage`, and must be
        organization-wide. A key that holds only `webhook-subscriptions:read`
        is refused with 403 `missing_scope`, and a key bound to one store
        with 403 `store_key_not_allowed`.
      security:
        - apiKey: ['webhook-subscriptions:manage']
        - dashboardSession: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: The test was sent. The body says what the endpoint answered.
          content:
            application/json:
              schema:
                type: object
                properties:
                  delivered: { type: boolean, description: Whether the endpoint accepted the delivery. }
                  httpStatus: { type: [integer, 'null'], description: The status the endpoint answered with, or null when it could not be reached. }
                  error: { type: [string, 'null'], description: Why the delivery failed, when it did. }
                  eventType: { type: string, description: The event type the sample delivery named. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The subscription is paused.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429':
          description: Too many test deliveries in the last hour.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /api-keys:
    get:
      tags: [API Keys]
      operationId: listApiKeys
      summary: List API keys
      description: |
        Oldest first. Pages with `number` (default 200, and a size above 200
        is lowered to 200) and `offset`.
        The `x-siren-estimated-count` header carries the total.

        Takes a signed-in dashboard session. No API key scope reaches this
        route, and Siren answers an API key with 401 `api_key_not_accepted`.
      security:
        - dashboardSession: []
      parameters:
        - { $ref: '#/components/parameters/Offset' }
        - name: number
          in: query
          schema: { type: integer, minimum: 1, default: 200 }
      responses:
        '200':
          description: API keys (bare array, without raw key material).
          headers:
            x-siren-estimated-count: { $ref: '#/components/headers/XSirenEstimatedCount' }
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ApiKey' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [API Keys]
      operationId: createApiKey
      summary: Create an API key
      description: |
        Creates a new API key. The plaintext `rawKey` (`sk_live_...`) is
        returned **once** and cannot be retrieved later. `scopes` takes event
        scopes (`event:*`, `event:{slug}`, or the older `*`), the ledger read
        scopes and the webhook scopes. An older resource scope such as
        `programs:read` or `conversions:read` is refused with 400. An
        organization holds at most 250 active keys.

        Takes a signed-in dashboard session. No API key scope reaches this
        route, and Siren answers an API key with 401 `api_key_not_accepted`.
      security:
        - dashboardSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApiKeyCreate' }
      responses:
        '201':
          description: API key created.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiKey'
                  - type: object
                    properties:
                      rawKey:
                        type: string
                        description: Plaintext key. Returned once.
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api-keys/scopes:
    get:
      tags: [API Keys]
      operationId: listApiKeyScopes
      summary: List the scopes a new API key may be given
      description: |
        The scopes `createApiKey` takes, grouped by resource. Siren lists the
        event scopes under `events`, the ledger read scopes under `ledger`,
        the webhook scopes under `webhook-subscriptions`, and the record
        scopes under one `records:*` group each, such as `records:programs`.
        It leaves out a group with no scopes. The event scopes include each
        custom event type the organization has added.

        Takes a signed-in dashboard session. No API key scope reaches this
        route, and Siren answers an API key with 401 `api_key_not_accepted`.
      security:
        - dashboardSession: []
      responses:
        '200':
          description: Scopes grouped by resource (bare object).
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: array
                  items: { $ref: '#/components/schemas/ApiKeyScopeEntry' }
                example:
                  events:
                    - { scope: 'event:sale', resource: events, action: sale, label: Sale }
                  ledger:
                    - { scope: 'ledger:conversions:read', resource: ledger, action: 'conversions:read', label: Read conversions }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api-keys/{id}:
    delete:
      tags: [API Keys]
      operationId: revokeApiKey
      summary: Revoke an API key
      description: |
        Takes a signed-in dashboard session. No API key scope reaches this
        route, and Siren answers an API key with 401 `api_key_not_accepted`.
      security:
        - dashboardSession: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: Revoked. The body is the key with `status` set to `revoked`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiKey' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /conversions:
    get:
      tags: [Reconciliation]
      operationId: listConversions
      summary: List conversions
      description: |
        An API key needs the `ledger:conversions:read` scope. A key bound to one
        store reads only its own store's rows. An organization-wide key may
        narrow the read to one store with `propertyId` or the
        `X-Siren-Property` header.
      security:
        - apiKey: ['ledger:conversions:read']
        - dashboardSession: []
        - connectorToken: []
      parameters:
        - { $ref: '#/components/parameters/Number' }
        - { $ref: '#/components/parameters/Offset' }
        - { $ref: '#/components/parameters/PropertyId' }
        - { $ref: '#/components/parameters/XSirenProperty' }
      responses:
        '200': { $ref: '#/components/responses/PaginatedList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Conversions]
      operationId: createConversion
      summary: Create a conversion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [engagementId, type, status]
              properties:
                engagementId: { type: integer }
                type: { type: string }
                status: { type: string, enum: [pending, approved, rejected, expired] }
                transactionId: { type: integer }
                obligationId: { type: integer }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Record' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '400': { $ref: '#/components/responses/ValidationError' }
  /conversions/{id}:
    get:
      tags: [Reconciliation]
      operationId: retrieveConversion
      summary: Retrieve one conversion
      description: |
        Reads one conversion by id. An API key needs the `ledger:conversions:read` scope.
        A key bound to one store reads only its own store's conversions, and
        Siren answers 404 for another store's conversion, as it does for an id
        it does not have. A connected site's token needs
        `connect:records:read`.

        Siren answers with its default fields (`id`, `engagementId`, `transactionId`, `obligationId`, `status`, `type`,
        `dateCreated` and `dateModified`) unless `fields` or
        `include` asks for others.
      security:
        - apiKey: ['ledger:conversions:read']
        - dashboardSession: []
        - connectorToken: []
      parameters:
        - name: id
          in: path
          required: true
          description: The conversion's id, a positive whole number.
          schema: { type: integer, minimum: 1 }
        - name: fields
          in: query
          description: The fields to return, comma-separated.
          schema: { type: string }
          example: id,status,dateCreated
        - name: include
          in: query
          description: |
            `extended` returns every field Siren can resolve for the record.
          schema: { type: string }
        - { $ref: '#/components/parameters/PropertyId' }
      responses:
        '200':
          description: The conversion (bare object).
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: |
            No conversion with that id, or one the credential cannot see. Siren
            answers "No record found with that ID."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    put:
      tags: [Conversions]
      operationId: updateConversion
      summary: Update a conversion
      parameters:
        - { $ref: '#/components/parameters/Id' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                engagementId: { type: integer }
                type: { type: string }
                status: { type: string, enum: [pending, approved, rejected, expired] }
                transactionId: { type: integer }
                obligationId: { type: integer }
      responses:
        '200':
          description: Updated. The response has no body.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '400': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Conversions]
      operationId: deleteConversion
      summary: Delete a conversion
      description: |
        The first call marks the record `deleted` and returns it. A second call on a
        deleted record removes it and answers 204.
      parameters:
        - { $ref: '#/components/parameters/Id' }
      responses:
        '200': { $ref: '#/components/responses/Record' }
        '204': { description: Removed. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /transactions:
    get:
      tags: [Reconciliation]
      operationId: listTransactions
      summary: List transactions
      description: |
        An API key needs the `ledger:transactions:read` scope. A key bound to one
        store reads only its own store's rows. An organization-wide key may
        narrow the read to one store with `propertyId` or the
        `X-Siren-Property` header.
      security:
        - apiKey: ['ledger:transactions:read']
        - dashboardSession: []
        - connectorToken: []
      parameters:
        - { $ref: '#/components/parameters/Number' }
        - { $ref: '#/components/parameters/Offset' }
        - { $ref: '#/components/parameters/PropertyId' }
        - { $ref: '#/components/parameters/XSirenProperty' }
      responses:
        '200': { $ref: '#/components/responses/PaginatedList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Transactions]
      operationId: createTransaction
      summary: Create a transaction
      description: |
        Records a transaction directly. Commerce sales should use `POST /event/sale`,
        which also runs attribution.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [details]
              properties:
                details: { type: array, minItems: 1, items: { $ref: '#/components/schemas/TransactionDetail' } }
                bindingId: { type: string, description: An external reference Siren stores as a mapping. }
                bindingDataType: { type: string, description: The external reference type. }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Record' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '400': { $ref: '#/components/responses/ValidationError' }
  /transactions/{id}:
    get:
      tags: [Reconciliation]
      operationId: retrieveTransaction
      summary: Retrieve one transaction
      description: |
        Reads one transaction by id. An API key needs the `ledger:transactions:read` scope.
        A key bound to one store reads only its own store's transactions, and
        Siren answers 404 for another store's transaction, as it does for an id
        it does not have. A connected site's token needs
        `connect:records:read`.

        Siren answers with its default fields (`id`, `status` and `dateCreated`) unless `fields` or
        `include` asks for others.
      security:
        - apiKey: ['ledger:transactions:read']
        - dashboardSession: []
        - connectorToken: []
      parameters:
        - name: id
          in: path
          required: true
          description: The transaction's id, a positive whole number.
          schema: { type: integer, minimum: 1 }
        - name: fields
          in: query
          description: The fields to return, comma-separated.
          schema: { type: string }
          example: id,status,dateCreated
        - name: include
          in: query
          description: |
            `extended` returns every field Siren can resolve for the record.
          schema: { type: string }
        - { $ref: '#/components/parameters/PropertyId' }
      responses:
        '200':
          description: The transaction (bare object).
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: |
            No transaction with that id, or one the credential cannot see. Siren
            answers "No record found with that ID."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /obligations:
    get:
      tags: [Reconciliation]
      operationId: listObligations
      summary: List obligations
      description: |
        An API key needs the `ledger:obligations:read` scope. A key bound to one
        store reads only its own store's rows. An organization-wide key may
        narrow the read to one store with `propertyId` or the
        `X-Siren-Property` header.
      security:
        - apiKey: ['ledger:obligations:read']
        - dashboardSession: []
        - connectorToken: []
      parameters:
        - { $ref: '#/components/parameters/Number' }
        - { $ref: '#/components/parameters/Offset' }
        - { $ref: '#/components/parameters/PropertyId' }
        - { $ref: '#/components/parameters/XSirenProperty' }
      responses:
        '200': { $ref: '#/components/responses/PaginatedList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /payouts:
    get:
      tags: [Reconciliation]
      operationId: listPayouts
      summary: List payouts
      description: |
        An API key needs the `ledger:payouts:read` scope, and must be
        organization-wide. Payouts are not kept by store, so a key bound to
        one store is refused with 403 `store_key_not_allowed`.
      security:
        - apiKey: ['ledger:payouts:read']
        - dashboardSession: []
        - connectorToken: []
      parameters:
        - { $ref: '#/components/parameters/Number' }
        - { $ref: '#/components/parameters/Offset' }
      responses:
        '200': { $ref: '#/components/responses/PaginatedList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /collaborators:
    get:
      tags: [Collaborators]
      operationId: listCollaborators
      summary: List collaborators
      description: |
        Filters on `id`, `status`, `fullName`, `nickname`, and `email` match exactly, and a
        comma-separated value means "any of". `s` searches name, nickname, email, and
        tracking codes. Ask for `aliases`, `referralCode`, `programs`, `distributors`,
        `creditBalances`, or `groups` through `fields`.
      parameters:
        - { $ref: '#/components/parameters/Number' }
        - { $ref: '#/components/parameters/Offset' }
        - { $ref: '#/components/parameters/Fields' }
        - { $ref: '#/components/parameters/Order' }
        - name: orderBy
          in: query
          schema: { type: string, enum: [id, status, fullName, nickname, email, dateCreated, dateModified] }
        - name: id
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { type: string }
        - name: fullName
          in: query
          schema: { type: string }
        - name: nickname
          in: query
          schema: { type: string }
        - name: email
          in: query
          schema: { type: string }
        - { $ref: '#/components/parameters/Search' }
        - name: programId
          in: query
          schema: { type: integer }
          description: Only collaborators enrolled in this program.
        - name: distributorId
          in: query
          schema: { type: integer }
          description: Only collaborators this distributor covers.
      responses:
        '200': { $ref: '#/components/responses/PaginatedList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Collaborators]
      operationId: createCollaborator
      summary: Create a collaborator
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fullName, nickname, email, status]
              properties:
                fullName: { type: string }
                nickname: { type: string }
                email: { type: string, format: email }
                status: { type: string, enum: [active, inactive, pending] }
                trackingId: { type: string, description: The tracking code. One is generated when empty. }
                programs: { type: array, items: { type: integer } }
                distributors: { type: array, items: { type: integer } }
                groups: { type: array, items: { type: integer } }
      responses:
        '201':
          description: |
            Created. When a connected site names someone the organization
            already has and the site does not, Siren Cloud answers 201 with a
            held record for the site: its own `id`, status `pending`, no
            tracking code. Siren emails the person to confirm, then merges
            the held record into their collaborator and deletes it.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Record' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '422':
          description: The email belongs to a held record that waits for its person (`error.code` `reserved_address`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /collaborators/{id}:
    get:
      tags: [Collaborators]
      operationId: getCollaborator
      summary: Get a collaborator
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { $ref: '#/components/parameters/Fields' }
      responses:
        '200': { $ref: '#/components/responses/Record' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Collaborators]
      operationId: updateCollaborator
      summary: Update a collaborator
      description: |
        Send only the fields to change. `programs` replaces the collaborator's
        program enrollments, and `trackingId` gives them a new tracking code.
        A connected site may send only `fullName`, `nickname` and custom
        `fields`. Siren Cloud answers any other field from a site with 403
        `field_not_allowed`, and a collaborator that does not belong to the
        site with 403 `collaborator_not_on_site`.
      parameters:
        - { $ref: '#/components/parameters/Id' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                fullName: { type: string }
                nickname: { type: string }
                email: { type: string, format: email }
                status: { type: string, enum: [active, inactive, pending, rejected] }
                trackingId: { type: string, description: A new tracking code. Empty leaves it unchanged. }
                programs: { type: array, items: { type: integer }, description: Replaces every program enrollment. }
                distributors: { type: array, items: { type: integer } }
                groups: { type: array, items: { type: integer } }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Record' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '400': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Collaborators]
      operationId: deleteCollaborator
      summary: Delete a collaborator
      description: |
        The first call marks the record `deleted` and returns it. A second call on a
        deleted record removes it and answers 204. An `invited` collaborator
        is removed on the first call, which answers 204.
      parameters:
        - { $ref: '#/components/parameters/Id' }
      responses:
        '200': { $ref: '#/components/responses/Record' }
        '204': { description: Removed. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /collaborators/bulk:
    post:
      tags: [Collaborators]
      operationId: bulkCollaborators
      summary: Run a bulk action on collaborators
      description: |
        `addToProgram` and `removeFromProgram` enroll and unenroll collaborators in
        one program without touching their other enrollments.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action, ids]
              properties:
                action: { type: string, enum: [activate, deactivate, restore, delete, permanent_delete, addToProgram, removeFromProgram, addToDistributor, removeFromDistributor, sendSignupEmail] }
                ids: { type: array, items: { type: integer } }
                programId: { type: integer, description: Required by addToProgram and removeFromProgram. }
                distributorId: { type: integer, description: Required by addToDistributor and removeFromDistributor. }
      responses:
        '200': { $ref: '#/components/responses/Record' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '400': { $ref: '#/components/responses/ValidationError' }
  /collaborators/status-types:
    get:
      tags: [Collaborators]
      operationId: listCollaboratorStatusTypes
      summary: List collaborator statuses
      responses:
        '200': { $ref: '#/components/responses/Record' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /collaborators/generate-referral-code:
    get:
      tags: [Collaborators]
      operationId: generateReferralCode
      summary: Suggest an unused tracking code
      responses:
        '200': { $ref: '#/components/responses/Record' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /collaborator-aliases:
    get:
      tags: [Collaborators]
      operationId: listCollaboratorAliases
      summary: Find tracking and coupon codes
      description: |
        Every filter is an exact match, and `type` matches the plain type in
        every namespace, so `coupon` also finds a site's `coupon@property:5`.
        Newest first. `?code=SAVE10&type=coupon&number=1` answers "who holds
        this coupon". A connected site sends one plain type.
      parameters:
        - { $ref: '#/components/parameters/Number' }
        - { $ref: '#/components/parameters/Offset' }
        - { name: order, in: query, schema: { type: string, enum: [ASC, DESC], default: DESC } }
        - { name: orderBy, in: query, schema: { type: string, enum: [dateIssued, code, type, collaboratorId], default: dateIssued } }
        - { name: code, in: query, schema: { type: string } }
        - { name: type, in: query, schema: { $ref: '#/components/schemas/SiteName' }, example: coupon }
        - { name: collaboratorId, in: query, schema: { type: integer } }
      responses:
        '200': { $ref: '#/components/responses/PaginatedList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
    post:
      tags: [Collaborators]
      operationId: createCollaboratorAlias
      summary: Give a collaborator a code
      description: |
        A code has one holder per type across every namespace. Cloud files a
        connected site's code under the site's Property.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, type, collaboratorId]
              properties:
                code: { type: string }
                type: { $ref: '#/components/schemas/SiteName' }
                collaboratorId: { type: integer, minimum: 1 }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Alias' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Someone already holds the code under this type, in any namespace (`error.code` `code_held`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    delete:
      tags: [Collaborators]
      operationId: freeCollaboratorAlias
      summary: Free one code of one type
      description: |
        A connected site frees only codes in its own namespace. Freeing a code
        nobody holds answers 200 too.
      parameters:
        - { name: code, in: query, required: true, schema: { type: string } }
        - { name: type, in: query, required: true, schema: { $ref: '#/components/schemas/SiteName' } }
      responses:
        '200': { $ref: '#/components/responses/Deleted' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /collaborator-programs:
    get:
      tags: [Collaborators]
      operationId: listCollaboratorPrograms
      summary: List program enrollments
      description: One row `{collaboratorId, programId}` per enrollment. A comma-separated value matches any of its values.
      parameters:
        - { $ref: '#/components/parameters/Number' }
        - { $ref: '#/components/parameters/Offset' }
        - { $ref: '#/components/parameters/Order' }
        - { name: orderBy, in: query, schema: { type: string, enum: [collaboratorId, programId], default: collaboratorId } }
        - { name: collaboratorId, in: query, schema: { type: string }, example: '4' }
        - { name: programId, in: query, schema: { type: string }, example: '2,3' }
      responses:
        '200': { $ref: '#/components/responses/PaginatedList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
    post:
      tags: [Collaborators]
      operationId: addCollaboratorToProgram
      summary: Enroll a collaborator in a program
      description: |
        Enrolling someone already enrolled changes nothing and still answers
        201. A connected site may only name a program that runs on its own
        Property.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [collaboratorId, programId]
              properties:
                collaboratorId: { type: integer, minimum: 1 }
                programId: { type: integer, minimum: 1 }
      responses:
        '201':
          description: Enrolled.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Enrollment' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Collaborators]
      operationId: removeCollaboratorFromProgram
      summary: End one enrollment
      description: Removing an enrollment that does not exist answers 200 too. A connected site may only name a program that runs on its own Property.
      parameters:
        - { name: collaboratorId, in: query, required: true, schema: { type: integer, minimum: 1 } }
        - { name: programId, in: query, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        '200': { $ref: '#/components/responses/Deleted' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /collaborator-groups:
    get:
      tags: [Collaborator Groups]
      operationId: listCollaboratorGroups
      summary: List collaborator groups
      parameters:
        - { $ref: '#/components/parameters/Number' }
        - { $ref: '#/components/parameters/Offset' }
        - { $ref: '#/components/parameters/Fields' }
        - { $ref: '#/components/parameters/Order' }
        - name: orderBy
          in: query
          schema: { type: string, enum: [id, name, description, structure, dateCreated, dateModified] }
        - name: structure
          in: query
          schema: { type: string }
        - { $ref: '#/components/parameters/Search' }
      responses:
        '200': { $ref: '#/components/responses/PaginatedList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Collaborator Groups]
      operationId: createCollaboratorGroup
      summary: Create a collaborator group
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, structure]
              properties:
                name: { type: string }
                description: { type: string }
                structure: { type: string, example: flat }
                members: { type: array, items: { $ref: '#/components/schemas/GroupMember' } }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Record' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '400': { $ref: '#/components/responses/ValidationError' }
  /collaborator-groups/structures:
    get:
      tags: [Collaborator Groups]
      operationId: listCollaboratorGroupStructures
      summary: List group structures
      responses:
        '200': { $ref: '#/components/responses/Record' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /collaborator-groups/{id}:
    get:
      tags: [Collaborator Groups]
      operationId: getCollaboratorGroup
      summary: Get a collaborator group
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { $ref: '#/components/parameters/Fields' }
      responses:
        '200': { $ref: '#/components/responses/Record' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Collaborator Groups]
      operationId: updateCollaboratorGroup
      summary: Update a collaborator group
      parameters:
