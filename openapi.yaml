        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                description: { type: string }
                distributionResolver: { type: string }
                distributionPoolResolver: { type: string, example: revenueSinceLastDistribution }
                status: { type: string, enum: [active, inactive] }
                units: { type: string }
                revenuePercentage: { type: number }
                schedule: { type: array, items: { type: string }, example: [first day of next month] }
                engagementTypes: { type: object, additionalProperties: true }
                collaboratorIds: { type: array, items: { type: integer } }
                collaboratorGroupId: { type: integer }
                transactionCompilers: { type: object, additionalProperties: true }
                lineItemFilters: { type: object, additionalProperties: true }
                postAllocationActions: { type: object, additionalProperties: true }
                metricFilters: { type: object, additionalProperties: true }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Record' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '400': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Distributors]
      operationId: deleteDistributor
      summary: Delete a distributor
      description: |
        The first call marks the record `deleted` and returns it. A second call on a
        deleted record removes it and answers 204.
      parameters:
        - { $ref: '#/components/parameters/Id' }
      responses:
        '200': { $ref: '#/components/responses/Record' }
        '204': { description: Removed. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /distributors/bulk:
    post:
      tags: [Distributors]
      operationId: bulkDistributors
      summary: Run a bulk action on distributors
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action, ids]
              properties:
                action: { type: string, enum: [activate, deactivate, restore, delete, permanent_delete] }
                ids: { type: array, items: { type: integer } }
      responses:
        '200': { $ref: '#/components/responses/Record' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '400': { $ref: '#/components/responses/ValidationError' }
  /distributors/credit-metric:
    post:
      tags: [Distributors]
      operationId: creditDistributorMetric
      summary: Credit a manual metric to a collaborator
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [collaboratorId]
              properties:
                collaboratorId: { type: integer }
      responses:
        '200':
          description: Credited.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Record' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '400': { $ref: '#/components/responses/ValidationError' }
  /currencies/custom:
    get:
      tags: [Custom Currencies]
      operationId: listCustomCurrencies
      summary: List custom currencies
      parameters:
        - { $ref: '#/components/parameters/Number' }
        - { $ref: '#/components/parameters/Offset' }
        - { $ref: '#/components/parameters/Fields' }
        - { $ref: '#/components/parameters/Order' }
        - name: orderBy
          in: query
          schema: { type: string, enum: [code, name, symbol, symbolPosition, type, exchangeRate, dateCreated, dateModified] }
        - name: type
          in: query
          schema: { type: string, enum: [internal, monetary] }
        - name: code
          in: query
          schema: { type: string }
          description: One currency by its code. `customCurrencies.retrieve()` uses it.
          example: STORE_CREDIT
      responses:
        '200': { $ref: '#/components/responses/PaginatedList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Custom Currencies]
      operationId: createCustomCurrency
      summary: Create a custom currency
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, name, symbol, type]
              properties:
                code: { type: string, description: Upper case and unique. Real currency codes are refused. }
                name: { type: string }
                symbol: { type: string }
                symbolPosition: { type: string, enum: [before, after] }
                type: { type: string, enum: [internal, monetary] }
                exchangeRate: { type: integer, minimum: 1 }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Record' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '400': { $ref: '#/components/responses/ValidationError' }
  /currencies/custom/{code}:
    put:
      tags: [Custom Currencies]
      operationId: updateCustomCurrency
      summary: Update a custom currency
      description: |
        The type cannot change. Siren answers 400 when the body sends `type`.
      parameters:
        - { name: code, in: path, required: true, schema: { type: string }, example: PTS }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                symbol: { type: string }
                symbolPosition: { type: string, enum: [before, after] }
                exchangeRate: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Record' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '400': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Custom Currencies]
      operationId: deleteCustomCurrency
      summary: Delete a custom currency
      description: |
        Sets every program that pays in the currency to `inactive`, deletes the
        currency, and answers `{success, deactivatedPrograms}`. With
        `wipeLedger` true, the ledger entries in the currency are deleted too.
      parameters:
        - { name: code, in: path, required: true, schema: { type: string }, example: PTS }
        - name: wipeLedger
          in: query
          schema: { type: boolean }
          description: Also delete the ledger entries that use the currency.
      responses:
        '200': { $ref: '#/components/responses/Record' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /credits/adjust:
    post:
      tags: [Credits]
      operationId: adjustCreditBalance
      summary: Adjust a collaborator's credit balance
      description: |
        Only a dashboard session may adjust a balance. Read balances with
        `GET /credit-balances` and the ledger with `GET /credit-entries`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [collaboratorId, currency, amount]
              properties:
                collaboratorId: { type: integer }
                currency: { type: string, description: An internal custom currency code. }
                amount: { type: integer, description: Minor units. Negative takes credit away. Must not be zero. }
                description: { type: string }
      responses:
        '200':
          description: Adjusted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Record' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '400': { $ref: '#/components/responses/ValidationError' }
  /credit-balances:
    get:
      tags: [Credits]
      operationId: getCreditBalances
      summary: Read a collaborator's store credit for a checkout
      description: |
        One row per internal currency. `balance` is the ledger sum, `reserved`
        the live holds, and `available` the balance less reserved, never below
        zero, all in minor units. Pass the checkout's own hold reference as
        `excludeReference` so its hold does not count against itself. A
        connected site sends the plain reference and Cloud adds its Property.
      parameters:
        - { name: collaboratorId, in: query, required: true, schema: { type: integer, minimum: 1 } }
        - { name: currency, in: query, schema: { type: string, maxLength: 50 }, description: Just this internal currency. }
        - name: excludeReference
          in: query
          schema: { $ref: '#/components/schemas/HoldReference' }
      responses:
        '200':
          description: The balances.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/CreditBalance' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /credit-entries:
    get:
      tags: [Credits]
      operationId: listCreditEntries
      summary: List store credit ledger entries
      description: |
        A query must name `collaboratorId` or `idempotencyKey`, so it never
        lists a whole organization's ledger. Every filter is an exact match.
        Only Siren writes the ledger.
      parameters:
        - { $ref: '#/components/parameters/Number' }
        - { $ref: '#/components/parameters/Offset' }
        - { $ref: '#/components/parameters/Order' }
        - { name: orderBy, in: query, schema: { type: string, enum: [id, dateCreated, amount], default: id } }
        - { name: collaboratorId, in: query, schema: { type: integer } }
        - { name: currency, in: query, schema: { type: string } }
        - { name: sourceType, in: query, schema: { type: string } }
        - { name: sourceId, in: query, schema: { type: string } }
        - { name: description, in: query, schema: { type: string } }
        - { name: idempotencyKey, in: query, schema: { type: string } }
      responses:
        '200': { $ref: '#/components/responses/PaginatedList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /credit-holds:
    get:
      tags: [Credits]
      operationId: listCreditHolds
      summary: List store credit holds
      description: |
        A query must name `collaboratorId`, `reference` or `idempotencyKey`.
        Every filter is an exact match. A connected site reads only the holds
        its own checkouts placed, and their references come back with its
        Property, as in `hold:woocommerce@property:5:{token}`.
      parameters:
        - { $ref: '#/components/parameters/Number' }
        - { $ref: '#/components/parameters/Offset' }
        - { $ref: '#/components/parameters/Order' }
        - { name: orderBy, in: query, schema: { type: string, enum: [id, dateCreated, expiresAt], default: id } }
        - { name: collaboratorId, in: query, schema: { type: integer } }
        - { name: currency, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string, enum: [active, settled, released, expired] } }
        - { name: reference, in: query, schema: { $ref: '#/components/schemas/HoldReference' } }
        - { name: idempotencyKey, in: query, schema: { type: string } }
      responses:
        '200': { $ref: '#/components/responses/PaginatedList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
    post:
      tags: [Credits]
      operationId: placeCreditHold
      summary: Reserve store credit for a checkout
      description: |
        Placing again for the same token and currency replaces that session's
        hold. The hold's `amount` may be lower than asked, because Siren caps
        it at the credit available outside this session's own hold. A hold
        lapses at its `ttl`, the site can release it early with
        `DELETE /credit-holds/{id}`, and Siren settles it when the order's
        redemption arrives as an event.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [collaboratorId, currency, amount, token, platformId]
              properties:
                collaboratorId: { type: integer, minimum: 1 }
                currency: { type: string, description: An internal custom currency code. }
                amount: { type: integer, minimum: 1, description: Minor units. }
                token: { $ref: '#/components/schemas/SiteName', description: 'The checkout session, at most 120 characters.' }
                platformId: { $ref: '#/components/schemas/SiteName', description: 'The commerce platform, such as woocommerce. Plain. Cloud adds the Property (`@property:5`) and then allows at most 60 characters, suffix included.' }
                ttl: { type: integer, minimum: 60, maximum: 3600, default: 1800 }
      responses:
        '201':
          description: Placed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreditHold' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: |
            No credit is available in that currency (`error.code`
            `hold_no_credit`), or another site's checkout already holds
            credit for this collaborator and currency under the same token
            (`hold_token_in_use`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429':
          description: |
            The site spent its request budget (with `Retry-After`). Siren no
            longer caps how many checkouts hold a collaborator's credit, so it
            never sends `hold_limit`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /credit-holds/{id}:
    delete:
      tags: [Credits]
      operationId: releaseCreditHold
      summary: Release a store credit hold early
      description: |
        Releases one hold, so the credit it reserved is available again. Call
        it only when the shopper abandons the credit, or it no longer applies
        to a cart that never became an order. Never release the hold of a
        checkout that became an order: settlement consumes that hold, and
        releasing it first lets another checkout spend the same credit.
        A hold that already ended (released, expired or settled) comes back
        unchanged with 200, so a retry is safe. A connected site may release
        only holds its own checkouts placed, and any other id answers 404.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        '200':
          description: The hold, now released, or as it was when it had already ended.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreditHold' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /mappings:
    get:
      tags: [Mappings]
      operationId: listMappings
      summary: Find links to records outside Siren
      description: |
        A query must name a type. A connected site must name `externalType`,
        reads only its own namespace, and may never use the `user` type.
      parameters:
        - { $ref: '#/components/parameters/Number' }
        - { $ref: '#/components/parameters/Offset' }
        - { $ref: '#/components/parameters/Order' }
        - { name: orderBy, in: query, schema: { type: string, enum: [localId, externalId, localType, externalType], default: localId } }
        - { name: localId, in: query, schema: { type: integer } }
        - { name: localType, in: query, schema: { $ref: '#/components/schemas/SiteName' }, example: collaborator }
        - { name: externalId, in: query, schema: { type: string } }
        - { name: externalType, in: query, schema: { $ref: '#/components/schemas/SiteName' }, example: wordpress_user }
      responses:
        '200': { $ref: '#/components/responses/PaginatedList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
    post:
      tags: [Mappings]
      operationId: createMapping
      summary: Link a collaborator to an outside record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [localId, localType, externalId, externalType]
              properties:
                localId: { type: integer, minimum: 1, description: A collaborator id. }
                localType: { type: string, enum: [collaborator] }
                externalId: { type: string }
                externalType: { $ref: '#/components/schemas/SiteName' }
      responses:
        '201':
          description: Linked.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Mapping' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The link already exists (`error.code` `mapping_exists`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    delete:
      tags: [Mappings]
      operationId: deleteMappings
      summary: Remove collaborator links
      description: |
        Send `localId`, or `externalId` with its `externalType`. A connected
        site always sends `externalType`.
      parameters:
        - { name: localType, in: query, required: true, schema: { type: string, enum: [collaborator] } }
        - { name: localId, in: query, schema: { type: integer, minimum: 1 } }
        - { name: externalId, in: query, schema: { type: string } }
        - { name: externalType, in: query, schema: { $ref: '#/components/schemas/SiteName' } }
      responses:
        '200': { $ref: '#/components/responses/Deleted' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /configs:
    get:
      tags: [Settings]
      operationId: listSharedConfigs
      summary: Read the settings shared with a connected site
      description: |
        Only named settings leave Cloud. Today that is `collaborator` /
        `urlReference` / `key`, the referral link's query parameter.
      parameters:
        - { $ref: '#/components/parameters/Number' }
        - { $ref: '#/components/parameters/Offset' }
        - { $ref: '#/components/parameters/Order' }
        - { name: orderBy, in: query, schema: { type: string, enum: [type, subtype, configKey], default: type } }
        - { name: type, in: query, required: true, schema: { type: string, enum: [collaborator] } }
        - { name: subtype, in: query, schema: { type: string }, example: urlReference }
        - { name: configKey, in: query, schema: { type: string }, example: key }
      responses:
        '200': { $ref: '#/components/responses/PaginatedList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /oauth/register:
    post:
      tags: [OAuth]
      operationId: registerOAuthClient
      summary: Register a connected site's OAuth client
      description: |
        RFC 7591 dynamic registration. A site registers once, before it sends
        the merchant to the consent screen, and keeps the `client_id` it gets
        back. Each registration makes a new client, so the SDK sends it once.
        `scope` defaults to the connected-site scopes. A client that sends no
        `software_id` registers as the WordPress connector.

        A refusal is a 400 with the RFC 7591 error envelope, `error` and
        `error_description`, such as `invalid_redirect_uri`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [client_name, redirect_uris]
              properties:
                client_name: { type: string, maxLength: 200, description: The store's name. Cloud names the Property after it. }
                redirect_uris:
                  type: array
                  maxItems: 10
                  description: https URIs, or http on `localhost`, `127.0.0.1` or `[::1]`.
                  items: { type: string, format: uri }
                scope:
                  type: string
                  description: Space-separated scopes.
                  example: 'connect:* connect:webhooks connect:records:read connect:records:write'
                software_id: { type: string, enum: [siren-wordpress, siren-medusa] }
      responses:
        '201':
          description: The client is registered.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OAuthClientRegistration' }
        '400': { $ref: '#/components/responses/OAuthRefused' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /oauth/token:
    post:
      tags: [OAuth]
      operationId: requestOAuthToken
      summary: Exchange a code or refresh a token
      description: |
        RFC 6749 token route. With `grant_type: authorization_code` it
        exchanges the callback's single-use code and the PKCE verifier for a
        token pair. With `grant_type: refresh_token` it spends the refresh
        token for a new pair, and Cloud rotates the refresh token every time.

        Cloud answers a repeat of a rotated refresh token for 30 seconds. A
        repeat that carries the same `attempt_id` gets the pair Cloud already
        issued. A repeat after 30 seconds makes Cloud revoke the whole token
        family. The SDK sends each call once, and the store locks its own
        refresh. After a lost answer, a 429 or a 5xx the store may resend a
        refresh once, at once, with the same `attempt_id`.

        A refusal is a 400 or 401 with the RFC 6749 error envelope, `error`
        and `error_description`. A refresh refused with `invalid_grant` or
        `invalid_client` means the grant is gone and the site connects again.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [grant_type, client_id]
              properties:
                grant_type: { type: string, enum: [authorization_code, refresh_token] }
                client_id: { type: string }
                code: { type: string, description: The callback's code. Single use. Required for `authorization_code`. }
                redirect_uri: { type: string, format: uri, description: The redirect URI the authorization request named. Required for `authorization_code`. }
                code_verifier: { type: string, description: The PKCE verifier whose S256 challenge the authorization request carried. Required for `authorization_code`. }
                refresh_token: { type: string, description: Required for `refresh_token`. }
                attempt_id: { type: string, description: A random id for one refresh, sent again unchanged on each try of it. }
      responses:
        '200':
          description: A new token pair.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OAuthToken' }
        '400': { $ref: '#/components/responses/OAuthRefused' }
        '401': { $ref: '#/components/responses/OAuthRefused' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /connect/plan:
    get:
      tags: [Connected sites]
      operationId: getConnectPlan
      summary: Read the organization's plan
      description: |
        The organization's plan, trial and capabilities. Cloud answers 503
        with code `plan_unavailable` when it cannot read billing, and the
        site keeps the plan it last read.
      security:
        - connectorToken: [connect:read]
      responses:
        '200':
          description: The plan.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConnectPlan' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503':
          description: Cloud could not read the plan. `error.code` is `plan_unavailable`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /connect/update-grant:
    post:
      tags: [Connected sites]
      operationId: issueConnectUpdateGrant
      summary: Sign a grant for a paid build
      description: |
        A short-lived signed grant the site's updater sends to fetch a paid
        build. Each call signs a new grant and records nothing. No body.
      security:
        - connectorToken: [connect:read]
      responses:
        '200':
          description: The grant.
          content:
            application/json:
              schema:
                type: object
                required: [grant, expiresAt, expiresIn]
                properties:
                  grant: { type: string }
                  expiresAt: { type: integer, description: Unix time. }
                  expiresIn: { type: integer, description: Seconds. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /connect/site-state:
    put:
      tags: [Connected sites]
      operationId: reportConnectedSiteState
      summary: Report the site's forwarding and migration state
      security:
        - connectorToken: [connect:read]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [forwarding]
              properties:
                forwarding: { type: boolean }
                cutOverAt: { type: [integer, 'null'], description: Unix time, 2020 or later. }
                localDataDeletedAt: { type: [integer, 'null'], description: Unix time, 2020 or later. }
                migrationComplete: { type: boolean, description: Closes the site's migration window. }
      responses:
        '200':
          description: The state Cloud now holds.
          content:
            application/json:
              schema:
                type: object
                required: [reported, forwarding, cutOverAt, localDataDeletedAt]
                properties:
                  reported: { type: boolean, const: true }
                  forwarding: { type: boolean }
                  cutOverAt: { type: [integer, 'null'] }
                  localDataDeletedAt: { type: [integer, 'null'] }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /connect/disconnect:
    post:
      tags: [Connected sites]
      operationId: disconnectConnectedSite
      summary: Disconnect the site
      description: |
        Revokes the site's client, its tokens and its webhook. No body. Cloud
        cuts the client off as the disconnect commits, so a resend after a
        lost answer gets 401, and the site treats that as disconnected.
      security:
        - connectorToken: [connect:read]
      responses:
        '200':
          description: The site is disconnected.
          content:
            application/json:
              schema:
                type: object
                required: [disconnected, clientRevoked, tokensRevoked, webhooksRemoved]
                properties:
                  disconnected: { type: boolean, const: true }
                  clientRevoked: { type: boolean }
                  tokensRevoked: { type: integer }
                  webhooksRemoved: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /connect/integrations:
    put:
      tags: [Connected sites]
      operationId: replaceConnectedSiteIntegrations
      summary: Report the site's integrations
      description: The whole list, up to 50, replaces the one Cloud held.
      security:
        - connectorToken: [connect:records:write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [integrations]
              properties:
                integrations:
                  type: array
                  maxItems: 50
                  items:
                    type: object
                    required: [id]
                    properties:
                      id: { type: string, pattern: '^[A-Za-z0-9._-]+$' }
                      name: { type: string }
                      supports:
                        type: array
                        description: Feature values such as `coupons`, `customers` and `products`. Cloud drops values it does not know.
                        items: { type: string }
      responses:
        '204':
          description: The list is replaced. No body.
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /connect/products:
    put:
      tags: [Connected sites]
      operationId: syncConnectedStoreProducts
      summary: Sync the store's products
      description: |
        Upserts and removes up to 200 products a call. To end a full sync,
        send the `serverTime` an earlier answer gave as `pruneBefore`, and
        Cloud removes every product the sync did not touch.
      security:
        - connectorToken: [connect:records:write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [platform]
              properties:
                platform: { type: string, example: medusa }
                products:
                  type: array
                  maxItems: 200
                  items:
                    type: object
                    required: [id]
                    properties:
                      id: { type: [string, integer] }
                      parentId: { type: [string, integer, 'null'] }
                      name: { type: [string, 'null'] }
                      sku: { type: [string, 'null'] }
                      type: { type: [string, 'null'] }
                      status: { type: [string, 'null'] }
                      editUrl: { type: [string, 'null'], format: uri }
                removed:
                  type: array
                  maxItems: 200
                  items: { type: [string, integer] }
                pruneBefore: { type: [integer, 'null'] }
      responses:
        '200':
          description: What the call changed.
          content:
            application/json:
              schema:
                type: object
                required: [upserted, skipped, removed, pruned, serverTime]
                properties:
                  upserted: { type: integer }
                  skipped: { type: integer }
                  removed: { type: integer }
                  pruned: { type: integer }
                  serverTime: { type: integer, description: Unix time by Cloud's clock. }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /connect/migration-window:
    get:
      tags: [Connected sites]
      operationId: getMigrationWindow
      summary: Read the site's migration window
      security:
        - connectorToken: [connect:migrate]
      responses:
        '200':
          description: Whether the site may still migrate, and until when.
          content:
            application/json:
              schema:
                type: object
                required: [open, closesAt]
                properties:
                  open: { type: boolean }
                  closesAt: { type: [integer, 'null'], description: Unix time. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /connect/customer-email-key:
    get:
      tags: [Connected sites]
      operationId: getCustomerEmailKey
      summary: Read the customer email key
      description: |
        The HMAC key the site hashes customer emails with. Cloud sends it
        with `Cache-Control: no-store`. Never log it.
      security:
        - connectorToken: [connect:records:read]
      responses:
        '200':
          description: The key.
          content:
            application/json:
              schema:
                type: object
                required: [keyId, secret]
                properties:
                  keyId: { type: string }
                  secret: { type: string, contentEncoding: base64, description: At least 16 bytes, standard base64. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /connect/webhook:
    put:
      tags: [Connected sites]
      operationId: replaceConnectorWebhook
      summary: Create or replace the site's webhook subscription
      description: |
        Creates the subscription (201) or replaces it (200). Either way the
        answer carries a new signing secret, shown only here, so each call
        rotates the secret.
      security:
        - connectorToken: [connect:webhooks]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [targetUrl, events]
              properties:
                targetUrl: { type: string, format: uri }
                events:
                  type: array
                  maxItems: 100
                  items: { $ref: '#/components/schemas/WebhookEventType' }
      responses:
        '200':
          description: The subscription is replaced.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConnectorWebhookWithSecret' }
        '201':
          description: The subscription is created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConnectorWebhookWithSecret' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    get:
      tags: [Connected sites]
      operationId: getConnectorWebhook
      summary: Read the site's webhook subscription
      security:
        - connectorToken: [connect:webhooks]
      responses:
        '200':
          description: The subscription.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConnectorWebhook' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Connected sites]
      operationId: deleteConnectorWebhook
      summary: Delete the site's webhook subscription
      description: |
        A repeat removes nothing more. `deleted: false` means the site had no
        webhook left to remove, which is also what a retry after a lost answer
        meets, so it counts as success.
      security:
        - connectorToken: [connect:webhooks]
      responses:
        '200':
          description: The subscription is gone.
          content:
            application/json:
              schema:
                type: object
                required: [deleted]
                properties:
                  deleted: { type: boolean }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /connect/webhook/test:
    post:
      tags: [Connected sites]
      operationId: testConnectorWebhook
      summary: Send one signed test delivery
      description: |
        Cloud signs one test delivery to the site and reports what the site
        answered. Cloud allows ten tests a site an hour.
      security:
        - connectorToken: [connect:webhooks]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nonce]
              properties:
                nonce: { type: string, pattern: '^[A-Za-z0-9_-]{16,128}$' }
      responses:
        '200':
          description: What the site answered.
          content:
            application/json:
              schema:
                type: object
                required: [delivered, httpStatus, error]
                properties:
                  delivered: { type: boolean }
                  httpStatus: { type: [integer, 'null'] }
                  error: { type: [string, 'null'] }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /connect/webhook/deliveries:
    get:
      tags: [Connected sites]
      operationId: listConnectorWebhookDeliveries
      summary: List deliveries to the site's subscription
      security:
        - connectorToken: [connect:webhooks]
      responses:
        '200':
          description: The deliveries, newest first.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ConnectorWebhookDelivery' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
components:
  securitySchemes:
    apiKey:
      type: http
      scheme: bearer
      bearerFormat: sk_live_...
      description: |
        An API key minted in the Siren dashboard or via createApiKey. Event
        scopes send events. The ledger scopes read conversions, transactions,
        obligations and payouts, and the webhook scopes read and manage
        webhook subscriptions. Each operation lists the scopes that open it,
        and holding any one listed requirement is enough. Every other route
        answers an API key with 401 `api_key_not_accepted`, the API key
        routes included. A key's requests count against the organization's
        API rate limit.
    dashboardSession:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        The access token of a person signed in to the Siren dashboard. Some
        routes need the admin role, and refuse other roles with a 403 whose
        code is `admin_required`.
    connectorToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        A connected site's OAuth access token, issued when an organization
        admin approves the site. The reconciliation routes take it when it
        holds `connect:records:read`. Each `/connect/*` route names the one
        `connect` scope it needs, and forwarded events need `connect:ingest`.
        `connect:*` grants `connect:read`, `connect:ingest` and
        `connect:migrate`. `connect:webhooks`, `connect:records:read` and
        `connect:records:write` are granted only by name.
  headers:
    XSirenOID:
      description: The opportunity (tracking) id associated with the event.
      schema: { type: integer }
    XSirenEstimatedCount:
      description: Total number of records across all pages.
      schema: { type: integer }
  parameters:
    Number:
      name: number
      in: query
      description: Page size. A value above 200 is lowered to 200. Below 1 is refused with 400.
      schema: { type: integer, minimum: 1, default: 10 }
    Offset:
      name: offset
      in: query
      description: The first row to return.
      schema: { type: integer, minimum: 0, default: 0 }
    Fields:
      name: fields
      in: query
      description: Comma-separated fields to return. Each list has a default set.
      schema: { type: string }
      example: id,status,dateCreated
    Order:
      name: order
      in: query
      schema: { type: string, enum: [ASC, DESC] }
    Search:
      name: s
      in: query
      description: A search term matched against the resource's text columns.
      schema: { type: string }
    Id:
      name: id
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    PropertyId:
      name: propertyId
      in: query
      description: |
        Narrows an organization-wide read to one store (Property). A key
        bound to one store reads only its own store's rows, whatever it
        sends here.
      schema: { type: integer, minimum: 1 }
    XSirenProperty:
      name: X-Siren-Property
      in: header
      description: The same one-store filter as `propertyId`, sent as a header.
      schema: { type: integer, minimum: 1 }
  schemas:
    SalePayload:
      type: object
      description: |
        A real sale requires `source`, `externalId`, `total` and `trackingId`.
        A test sale sends `test: true` and needs no other field.
      properties:
        source:
          type: string
          description: Commerce source identifier.
          example: stripe
        externalId:
          type: [string, number]
          minLength: 1
          maxLength: 32
          description: |
            Your order or transaction id, used to match refunds later. Siren
            also takes a number and stores it as text.
          example: cs_test_a1b2c3
        total:
          type: number
          minimum: 0
          maximum: 999999999.99
          description: Order total in major currency units.
          example: 49.99
        trackingId:
          type: integer
          minimum: 0
          description: Opportunity id from the Siren tracking cookie / attribution.
          example: 4021
        currency:
          type: string
          description: |
            A currency code the organization uses. Every line is recorded in
            it. Without it, the lines read as the organization's default
            currency. A code the organization does not use is refused with 400.
          example: USD
        items:
          type: array
          maxItems: 500
          items: { $ref: '#/components/schemas/LineItem' }
        test:
          type: boolean
          default: false
          description: |
            `true` records a test sale, to check an integration. Siren needs no
            other field, marks the sale as a test, counts it toward nothing and
            ignores `trackingId`. A repeat of a test reads as a pass.
      if:
        required: [test]
        properties:
          test: { const: true }
      else:
        required: [source, externalId, total, trackingId]
    LineItem:
      type: object
      required: [amount]
      properties:
        lineId:
          type: [string, number]
          minLength: 1
          maxLength: 191
          description: |
            Your id for this order line. Siren keeps it on the line, so a later
            refund can name the line by it in `RefundLine.lineId`. Siren stores
            a number as text.
          example: line-1
        externalId: { type: [string, number], maxLength: 255, description: 'Text, or a number that Siren stores as text.' }
        name: { type: [string, number], maxLength: 255, description: 'Text, or a number that Siren stores as text.', example: Pro Plan (annual) }
        quantity: { type: integer, minimum: 1, maximum: 1000000, default: 1 }
        amount:
          type: number
          minimum: 0
          maximum: 999999999.99
          description: Per-unit price in major currency units.
          example: 49.99
    SaleOutcome:
      type: object
      properties:
        status:
          type: string
          enum: [created, recorded, duplicate, unattributed, ignored]
        created: { type: boolean }
        transactionId: { type: [integer, 'null'] }
        conversions:
          type: array
          items:
            type: object
            properties:
              id: { type: integer }
              status: { type: string }
        message: { type: string }
        test: { type: boolean, const: true, description: Sent only on a test sale. }
        reason:
          type: string
          description: Why a recorded sale earned nothing.
          enum: [no_engagement, engagement_used, engagement_ended, not_awarded]
    SiteVisitOutcome:
      type: object
      properties:
        status:
          type: string
          enum: [attributed, recorded, not_attributed, queued]
        attributed: { type: boolean }
        queued: { type: boolean }
        opportunityId: { type: [integer, 'null'] }
        message: { type: string }
        reason:
          type: string
          enum: [collaborator_not_found, collaborator_not_active]
    QueuedOutcome:
      type: object
      properties:
        status: { type: string, const: queued }
        queued: { type: boolean, const: true }
        message: { type: string }
    RefundPayload:
      type: object
      required: [source, externalId, refundId]
      properties:
        source: { type: string, example: stripe }
        externalId: { type: [string, number], minLength: 1, maxLength: 32, example: cs_test_a1b2c3 }
        refundId:
          description: The store's own id for this refund, such as WooCommerce refund 2201. `externalId` names the order and `refundId` names one refund of it. Siren records each refund id once per order.
          type: [string, number]
          minLength: 1
          maxLength: 191
          example: re_3Nf8a2
        amount:
          type: number
          minimum: 0
          maximum: 999999999.99
          description: Money refunded, in major currency units (9.99 = $9.99). Sending it makes the refund partial unless `whole` is `true`.
          example: 20
        currency:
          type: string
          description: |
            A currency code the organization uses, for the amounts. When it is
            left out, Siren reads them in the sale's own currency, or else the
            organization's default.
          example: USD
        lines:
          type: array
          maxItems: 500
          description: The refunded order lines. Sending them makes the refund partial unless `whole` is `true`.
          items: { $ref: '#/components/schemas/RefundLine' }
        whole:
          type: boolean
          description: |
            `true` refunds the whole order, whatever else is sent. A refund
            with neither `amount` nor `lines` is also a whole refund.
        kind:
          type: string
          enum: [refund, cancelled, voided]
          default: refund
          description: How the whole order ended. Siren reads `refund` when it is left out.
    RefundLine:
      type: object
      description: |
        One refunded order line. Name the line by `lineId`, as the sale's item
        sent it, or by `sku`. Siren refuses a line that names neither.
      properties:
        lineId:
          type: [string, number]
          minLength: 1
          maxLength: 191
          description: The sale line's `lineId`. Siren stores a number as text.
          example: line-1
        sku:
          type: [string, number]
          minLength: 1
          maxLength: 191
          description: The product SKU of the line, when the sale sent no `lineId`.
        quantity:
          type: integer
          minimum: 0
          maximum: 1000000
          description: Units returned.
        amount:
          type: number
          minimum: 0
          maximum: 999999999.99
          description: Money refunded for this line, in major currency units.
          example: 20
    SiteVisitedPayload:
      type: object
      required: [collaboratorId]
      properties:
        collaboratorId:
          description: |
            The collaborator to attribute the visit to: their numeric id, or
            one of their tracking codes as `tracking:{code}`, such as
            `tracking:summer-sale`. Siren resolves the code to its collaborator.
          oneOf:
            - { type: integer }
            - { type: string, pattern: '^tracking:.+' }
          example: 88
        userId: { type: integer, example: 12345 }
    WebhookSubscription:
      type: object
      properties:
        id: { type: integer }
        targetUrl: { type: string, format: uri }
        urlValid:
          type: boolean
          description: Whether the stored URL passes the outbound URL rules. A URL that fails gets no deliveries.
        urlProblem: { type: [string, 'null'] }
        events:
          type: array
          items: { $ref: '#/components/schemas/WebhookEventType' }
        description: { type: string }
        status: { type: string, example: active }
        propertyId: { type: [integer, 'null'] }
        oauthClientId: { type: [string, 'null'] }
        dateCreated: { type: [string, 'null'] }
        dateModified: { type: [string, 'null'] }
    WebhookSubscriptionCreate:
      type: object
      required: [targetUrl, events]
      properties:
        targetUrl: { type: string, format: uri, example: https://example.com/webhooks/siren }
        events:
          type: array
          items: { $ref: '#/components/schemas/WebhookEventType' }
          example: ['conversion.approved', 'payout.paid']
        description: { type: string }
    WebhookEventType:
      type: string
      description: |
        A subscribable event type. Use `*` to subscribe to all. The list matches
        Siren's webhook catalog, which `GET /webhooks/events` serves, and Siren
        may add an event there before this list has it.
      enum:
        - '*'
        - allocation.completed
        - collaborator.applied
        - collaborator.created
        - collaborator.deactivated
        - collaborator.declined
        - collaborator.deleted
        - collaborator_group.created
        - collaborator_group.deleted
        - collaborator_group.member_added
        - collaborator_group.member_removed
        - collaborator_group.updated
        - collaborator.joined
        - collaborator.registered
        - collaborator.updated
        - conversion.approved
        - conversion.created
        - conversion.rejected
        - conversion.renewed
        - coupon.applied
        - coupon.linked
        - coupon.merged
        - coupon.unlinked
        - credit.issued
        - credit.redeemed
        - currency.created
        - currency.deleted
        - distribution.completed
        - distributor.created
        - distributor.deleted
        - distributor.updated
        - engagement.awarded
        - engagement.completed
        - engagement.created
        - fulfillment.created
        - fulfillment.updated
        - lead.created
        - metrics.updated
        - obligation.approved
        - obligation.completed
        - obligation.created
        - obligation.rejected
        - obligation.superseded
        - opportunity.created
        - opportunity.invalidated
        - payout.created
        - payout.failed
        - payout.paid
        - payout.waiting
        - product.merged
        - program.created
        - program.deleted
        - program_group.created
        - program_group.deleted
        - program_group.updated
        - program.status_changed
        - program.updated
        - refund.created
        - refund.recorded
        - renewal.created
        - sale.created
        - store.connected
        - store.disconnected
        - transaction.completed
        - transaction.created
    ApiKey:
      type: object
      properties:
        id: { type: integer }
        keyPrefix: { type: string, example: sk_live_a1b2c3d4 }
        label: { type: string }
        status: { type: string, enum: [active, revoked] }
        propertyId: { type: [integer, 'null'] }
        scopes:
          type: array
          items: { type: string }
        expiresAt: { type: [string, 'null'] }
        lastUsedAt: { type: [string, 'null'] }
        revokedAt: { type: [string, 'null'] }
        dateCreated: { type: [string, 'null'] }
        dateModified: { type: [string, 'null'] }
    ApiKeyCreate:
      type: object
      required: [scopes]
      properties:
        label: { type: string, example: Production server }
        scopes:
          type: array
          minItems: 1
          items: { type: string }
          example: ['event:sale', 'ledger:conversions:read']
          description: |
            Event scopes: `event:*` for every event, or `event:{slug}` for one
            event type. `*` is also accepted and grants what `event:*` grants.

            Ledger and webhook scopes: `ledger:conversions:read`,
            `ledger:transactions:read`, `ledger:obligations:read`,
            `ledger:payouts:read`, `webhook-subscriptions:read` and
            `webhook-subscriptions:manage`. Each is granted only by its exact
            name. `*`, `event:*` and wildcards such as `ledger:*` grant none
            of them.

            An older resource scope such as `programs:read` or
            `conversions:read` is refused with 400.
        expiresAt:
          type: string
          description: ISO 8601 date in the future. Omit for a key that never expires.
        propertyId:
          type: integer
          minimum: 1
          description: |
            Binds the key to this Property of the organization. Siren stamps
            it on the key's events, the key reads only that store's
            conversions, transactions and obligations, and it is refused on
            payouts and webhook subscriptions with 403 `store_key_not_allowed`.
    ApiKeyScopeEntry:
      type: object
      description: One scope a new API key may be given, as `GET /api-keys/scopes` lists it.
      properties:
        scope: { type: string, description: The scope string to pass to `createApiKey`., example: 'ledger:conversions:read' }
        resource: { type: string, description: The group the scope belongs to., example: ledger }
        action: { type: string, description: What the scope allows within its group., example: 'conversions:read' }
        label: { type: string, example: Read conversions }
    ErrorCode:
      type: string
      description: |
        The machine-readable `error.code` Siren sends beside a refusal's
        message. Branch on the code, not the message, which can change. A
        reply from an older or newer Siren deployment may carry no code, or a
        code this list lacks.

        401: `site_disconnected` when the organization revoked or deleted the
        connected site's connection, and `api_key_not_accepted` when the route
        takes a dashboard session and not an API key.

        403: `missing_scope` and `store_key_not_allowed` refuse an API key.
        `field_not_allowed`, `pending_status_required`, `user_type_not_allowed`,
        `program_not_on_site`, `collaborator_not_on_site`,
        `site_filter_required`, `report_not_allowed` and `not_permitted` mean
        Siren's policy refused the request, so sending it again fails again.
        `migration_closed`, `plan_required`, `admin_required` and
        `email_confirmation_required` lift once the organization changes.

        409: `code_held` when someone already holds a tracking or coupon code,
        `mapping_exists`, `hold_no_credit` and `hold_token_in_use` when Siren
        refuses a store credit hold, `hold_currency_not_at_store` and
        `currency_resolution_required`.

        422: `invalid_currency_resolution`, `collaborator_deletion_refused` and
        `reserved_address`. 503: `plan_unavailable` when Siren could not read
        the organization's plan.
      enum:
        - site_disconnected
        - api_key_not_accepted
        - missing_scope
        - store_key_not_allowed
        - field_not_allowed
        - pending_status_required
        - user_type_not_allowed
        - program_not_on_site
        - collaborator_not_on_site
        - site_filter_required
        - report_not_allowed
        - not_permitted
        - migration_closed
        - plan_required
        - admin_required
        - email_confirmation_required
        - code_held
        - mapping_exists
        - hold_no_credit
        - hold_token_in_use
        - hold_currency_not_at_store
        - currency_resolution_required
        - invalid_currency_resolution
        - collaborator_deletion_refused
        - reserved_address
        - plan_unavailable
    Error:
      type: object
      description: |
        `error` is polymorphic. Some checks return a plain string message.
        Most return an object with `message`, an optional stable `code`, and
        `context`. A failed validation sets `context.type` to
        `VALIDATION_FAILED` and lists each broken rule in
        `context.failedValidations`. Clients must handle both shapes.

        An API key's refusals carry a stable `code`: `api_key_not_accepted`
        (401) when the route takes a session and not a key, `missing_scope`
        (403) when the key holds none of the route's scopes, with
        `context.scope` and `context.anyOf`, and `store_key_not_allowed`
        (403) when a key bound to one store asks for payouts or webhook
        subscriptions, with `context.propertyId`. Branch on the code, not the
        message.
      properties:
        error:
          oneOf:
            - type: string
            - type: object
              properties:
                message: { type: string }
                code:
                  type: string
                  description: A stable code, one of the `ErrorCode` values when Siren sends one this document lists.
                context:
                  type: [object, array]
                  description: Extra detail. PHP sends an empty context as `[]`.
                  properties:
                    type: { type: string, example: VALIDATION_FAILED }
                    failedValidations:
                      type: array
                      items:
                        type: object
                        properties:
                          field: { type: string }
                          message: { type: string }
                          type: { type: string, example: REQUIRED }
                          context: { type: object, additionalProperties: true }
    Record:
      type: object
      description: |
        A Siren record. The fields present depend on the resource and on the
        `fields` the request asked for.
      additionalProperties: true
    SiteName:
      type: string
      pattern: '^[A-Za-z0-9_-]+$'
      description: |
        A plain type, platform or token: letters, digits, underscores and
        hyphens. Cloud refuses an `@` qualifier or a comma from a connected
        site, and adds the site's Property itself.
    Alias:
      type: object
      properties:
        code: { type: string, example: SAVE10 }
        type: { type: string, description: 'Qualified for a connected site, as in coupon@property:5. The SDK answers the plain type and the Property in propertyId.' }
        collaboratorId: { type: integer }
        dateIssued: { type: string }
    Enrollment:
      type: object
      properties:
        collaboratorId: { type: integer }
        programId: { type: integer }
    GroupMember:
      type: object
      required: [collaboratorId]
      properties:
        collaboratorId: { type: integer, minimum: 1 }
        metadata:
          oneOf:
            - type: object
              additionalProperties: true
            - type: string
    ForwardedEventEnvelope:
      type: object
      description: |
        The versioned envelope a connected site forwards to
        `POST /event/{eventSlug}`, as Siren's `EventWireFormat` reads it.
        The slug is one of the 28 forwarded slugs, such as `sale-triggered`
        or `product-deleted`, and names the shape of `data`. Cloud claims
        each event once per Property, on its natural key or on `eventId`,
        and answers a resend with `status: duplicate`.
      required: [version, eventId, origin, occurredAt, data]
      properties:
        version: { type: integer, const: 1 }
        eventId:
          type: string
          format: uuid
          description: The site's id for this event, the same on every try of it.
        origin: { type: string, const: site }
        occurredAt:
          type: [string, 'null']
          description: ISO 8601 with a `Z` or `+hh:mm` offset, or `null`.
          example: '2026-11-12T09:30:00+00:00'
        data:
          type: object
          additionalProperties: true
          description: The event's fields. Each slug's codec names the keys it takes.
        optional:
          type: object
          additionalProperties: true
          description: Fields a slug takes beside `data`, such as a refund's `refundKind`.
    OAuthClientRegistration:
      type: object
      description: The registered client, as RFC 7591 names its fields.
      required: [client_id]
      properties:
        client_id: { type: string }
        client_name: { type: string }
        redirect_uris:
          type: array
          items: { type: string, format: uri }
        grant_types:
          type: array
          items: { type: string }
        token_endpoint_auth_method: { type: string, example: none }
        scope: { type: string }
        software_id: { type: string, enum: [siren-wordpress, siren-medusa] }
    OAuthToken:
      type: object
      description: A token pair, as RFC 6749 names its fields.
      required: [access_token, refresh_token]
      properties:
        access_token: { type: string }
        token_type: { type: string, example: Bearer }
        expires_in: { type: integer, example: 3600 }
        scope: { type: string }
        refresh_token:
          type: string
          description: The next refresh token. Cloud rotates it on every refresh, so the one sent is spent.
    OAuthError:
      type: object
      description: |
        The RFC 6749 and RFC 7591 error envelope. A refresh refused with
        `invalid_grant` or `invalid_client` means the grant is gone and the
        site connects again.
      required: [error]
      properties:
        error:
          type: string
          enum:
            - invalid_request
            - invalid_grant
            - invalid_client
            - invalid_scope
            - unsupported_grant_type
            - invalid_client_metadata
            - invalid_redirect_uri
        error_description: { type: string }
    ConnectPlan:
      type: object
      required: [status, capabilities, trial, paidPlan, pricingUrl]
      properties:
        status: { type: string, enum: [active, lapsed, none, unrestricted] }
        capabilities:
          type: array
          items: { type: string }
        trial:
          type: object
          required: [active, plan, endsAt, ended]
          properties:
            active: { type: boolean }
            plan: { type: [string, 'null'], description: '`essentials`, `plus` or `pro` during a trial.' }
            endsAt: { type: [string, 'null'], format: date-time }
            ended: { type: boolean }
        paidPlan: { type: [string, 'null'] }
        pricingUrl: { type: string, format: uri }
    ConnectorWebhook:
      description: The site's own webhook subscription, with its Property.
      allOf:
        - { $ref: '#/components/schemas/WebhookSubscription' }
        - type: object
          required: [property]
          properties:
            property:
              type: object
              properties:
                id: { type: integer }
                siteUrl: { type: string, format: uri }
    ConnectorWebhookWithSecret:
      description: The subscription with its new signing secret, shown only in this answer.
      allOf:
        - { $ref: '#/components/schemas/ConnectorWebhook' }
        - type: object
          required: [signingSecret]
          properties:
            signingSecret: { type: string }
    ConnectorWebhookDelivery:
      type: object
      description: One delivery to the site's subscription. Dates are `Y-m-d H:i:s` with no offset.
      properties:
        id: { type: integer }
        webhookSubscriptionId: { type: integer }
        eventType: { type: string }
        eventId: { type: [string, 'null'] }
        payload: { type: [object, 'null'], additionalProperties: true }
        status: { type: string }
        attemptCount: { type: integer }
        httpStatusCode: { type: [integer, 'null'] }
        responseBody: { type: [string, 'null'] }
        errorMessage: { type: [string, 'null'] }
        nextRetryAt: { type: [string, 'null'] }
        deliveredAt: { type: [string, 'null'] }
        dateCreated: { type: [string, 'null'] }
        dateModified: { type: [string, 'null'] }
    CreditBalance:
      type: object
      properties:
        collaboratorId: { type: integer }
        currency: { type: string }
        balance: { type: integer }
        reserved: { type: integer }
        available: { type: integer }
        held:
          type: integer
          description: Credit a store's migration imported that waits for an admin's approval. Not part of the balance.
    CreditHold:
      type: object
      properties:
        id: { type: integer }
        collaboratorId: { type: integer }
        currency: { type: string }
        amount: { type: integer }
        status: { type: string, enum: [active, settled, released, expired] }
        reference: { type: string, example: 'hold:woocommerce@property:5:0b6f3c2e-8a1d-4c55-9a0e-0d6c1b7f4e21' }
        idempotencyKey: { type: [string, 'null'] }
        expiresAt: { type: string }
        createdDate: { type: string }
    HoldReference:
      type: string
      pattern: '^hold:[A-Za-z0-9_-]+:[A-Za-z0-9_-]+$'
      description: A checkout session's hold reference, `hold:{platform}:{token}`, as a site sends it.
      example: hold:woocommerce:0b6f3c2e-8a1d-4c55-9a0e-0d6c1b7f4e21
    Mapping:
      type: object
      properties:
        localId: { type: integer }
        localType: { type: string, example: collaborator }
        externalId: { type: string }
        externalType: { type: string, description: 'Qualified for a connected site, as in wordpress_user@property:5. The SDK answers the plain type and the Property in propertyId.' }
    TransactionDetail:
      type: object
      required: [name, value]
      properties:
        name: { type: string }
        description: { type: string }
        type: { type: string, example: credit }
        value: { type: integer, description: Per-unit value in minor units. }
        quantity: { type: integer, default: 1 }
        units: { type: string, example: USD }
        attributes: { type: object, additionalProperties: true }
  responses:
    PaginatedList:
      description: |
        One page of records in Siren's list envelope. The total also travels
        in the `x-siren-estimated-count` response header.
      headers:
        x-siren-estimated-count: { $ref: '#/components/headers/XSirenEstimatedCount' }
      content:
        application/json:
          schema:
            type: object
            properties:
              items:
                type: array
                items: { type: object, additionalProperties: true }
              total: { type: integer }
              page: { type: integer }
              perPage: { type: integer }
              totalPages: { type: integer }
    Queued:
      description: |
        The organization's engine is paused, so Siren queued the event and
        will process it once the organization can run again. Do not resend it.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/QueuedOutcome' }
    Unauthorized:
      description: |
        Missing, invalid, expired or revoked credential. A valid API key sent
        to a route that takes a session gets `error.code`
        `api_key_not_accepted`. A connected site whose connection the
        organization revoked or deleted gets `site_disconnected`.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: |
        The credential may not do this. For an API key, `error.code`
        `missing_scope` means the key holds none of the route's scopes,
        `error.context.scope` names one and `error.context.anyOf` lists every
        scope that opens the route. `store_key_not_allowed` means a key bound
        to one store asked for payouts or webhook subscriptions, which are
        not kept by store. A policy code, such as `field_not_allowed` with
        `error.context.param` naming the field, means Siren refuses the
        request itself, so sending it again fails again. `ErrorCode` lists
        every code.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Record:
      description: A record, or the result of an action.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Record' }
    Deleted:
      description: Removed, or nothing matched.
      content:
        application/json:
          schema:
            type: object
            properties:
              deleted: { type: boolean, const: true }
    BadRequest:
      description: A query parameter is out of range, such as `number` below 1 or a negative `offset`.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: The record would duplicate one that exists.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ValidationError:
      description: |
        The request failed validation (400). `error.context.type` is
        `VALIDATION_FAILED` and `error.context.failedValidations` names each
        field.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    RateLimited:
      description: |
        Too many requests, or the organization's engine is paused and its
        event queue is full.
      headers:
        Retry-After:
          schema: { type: integer }
          description: Seconds to wait before retrying.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    OAuthRefused:
      description: |
        Cloud refused the OAuth call, with the RFC error envelope. The SDK
        raises it as `OAuthError`.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/OAuthError' }
