        - { $ref: '#/components/parameters/Id' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                description: { type: string }
                distributionResolver: { type: string }
                distributionPoolResolver: { type: string, example: revenueSinceLastDistribution }
                status: { type: string, enum: [active, inactive] }
                units: { type: string }
                revenuePercentage: { type: number }
                schedule: { type: array, items: { type: string }, example: [first day of next month] }
                engagementTypes: { type: object, additionalProperties: true }
                collaboratorIds: { type: array, items: { type: integer } }
                collaboratorGroupId: { type: integer }
                transactionCompilers: { type: object, additionalProperties: true }
                lineItemFilters: { type: object, additionalProperties: true }
                postAllocationActions: { type: object, additionalProperties: true }
                metricFilters: { type: object, additionalProperties: true }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Record' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '400': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Distributors]
      operationId: deleteDistributor
      summary: Delete a distributor
      description: |
        The first call marks the record `deleted` and returns it. A second call on a
        deleted record removes it and answers 204.
      parameters:
        - { $ref: '#/components/parameters/Id' }
      responses:
        '200': { $ref: '#/components/responses/Record' }
        '204': { description: Removed. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /distributors/bulk:
    post:
      tags: [Distributors]
      operationId: bulkDistributors
      summary: Run a bulk action on distributors
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action, ids]
              properties:
                action: { type: string, enum: [activate, deactivate, restore, delete, permanent_delete] }
                ids: { type: array, items: { type: integer } }
      responses:
        '200': { $ref: '#/components/responses/Record' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '400': { $ref: '#/components/responses/ValidationError' }
  /distributors/credit-metric:
    post:
      tags: [Distributors]
      operationId: creditDistributorMetric
      summary: Credit a manual metric to a collaborator
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [collaboratorId]
              properties:
                collaboratorId: { type: integer }
      responses:
        '200':
          description: Credited.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Record' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '400': { $ref: '#/components/responses/ValidationError' }
  /currencies/custom:
    get:
      tags: [Custom Currencies]
      operationId: listCustomCurrencies
      summary: List custom currencies
      parameters:
        - { $ref: '#/components/parameters/Number' }
        - { $ref: '#/components/parameters/Offset' }
        - { $ref: '#/components/parameters/Fields' }
        - { $ref: '#/components/parameters/Order' }
        - name: orderBy
          in: query
          schema: { type: string, enum: [code, name, symbol, symbolPosition, type, exchangeRate, dateCreated, dateModified] }
        - name: type
          in: query
          schema: { type: string, enum: [internal, monetary] }
        - name: code
          in: query
          schema: { type: string }
          description: One currency by its code. `customCurrencies.retrieve()` uses it.
          example: STORE_CREDIT
      responses:
        '200': { $ref: '#/components/responses/PaginatedList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Custom Currencies]
      operationId: createCustomCurrency
      summary: Create a custom currency
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, name, symbol, type]
              properties:
                code: { type: string, description: Upper case and unique. Real currency codes are refused. }
                name: { type: string }
                symbol: { type: string }
                symbolPosition: { type: string, enum: [before, after] }
                type: { type: string, enum: [internal, monetary] }
                exchangeRate: { type: integer, minimum: 1 }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Record' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '400': { $ref: '#/components/responses/ValidationError' }
  /currencies/custom/{code}:
    put:
      tags: [Custom Currencies]
      operationId: updateCustomCurrency
      summary: Update a custom currency
      description: |
        The type cannot change. Siren answers 400 when the body sends `type`.
      parameters:
        - { name: code, in: path, required: true, schema: { type: string }, example: PTS }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                symbol: { type: string }
                symbolPosition: { type: string, enum: [before, after] }
                exchangeRate: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Record' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '400': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Custom Currencies]
      operationId: deleteCustomCurrency
      summary: Delete a custom currency
      description: |
        Sets every program that pays in the currency to `inactive`, deletes the
        currency, and answers `{success, deactivatedPrograms}`. With
        `wipeLedger` true, the ledger entries in the currency are deleted too.
      parameters:
        - { name: code, in: path, required: true, schema: { type: string }, example: PTS }
        - name: wipeLedger
          in: query
          schema: { type: boolean }
          description: Also delete the ledger entries that use the currency.
      responses:
        '200': { $ref: '#/components/responses/Record' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /credits/adjust:
    post:
      tags: [Credits]
      operationId: adjustCreditBalance
      summary: Adjust a collaborator's credit balance
      description: |
        Only a dashboard session may adjust a balance. Read balances with
        `GET /credit-balances` and the ledger with `GET /credit-entries`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [collaboratorId, currency, amount]
              properties:
                collaboratorId: { type: integer }
                currency: { type: string, description: An internal custom currency code. }
                amount: { type: integer, description: Minor units. Negative takes credit away. Must not be zero. }
                description: { type: string }
      responses:
        '200':
          description: Adjusted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Record' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '400': { $ref: '#/components/responses/ValidationError' }
  /credit-balances:
    get:
      tags: [Credits]
      operationId: getCreditBalances
      summary: Read a collaborator's store credit for a checkout
      description: |
        One row per internal currency. `balance` is the ledger sum, `reserved`
        the live holds, and `available` the balance less reserved, never below
        zero, all in minor units. Pass the checkout's own hold reference as
        `excludeReference` so its hold does not count against itself. A
        connected site sends the plain reference and Cloud adds its Property.
      parameters:
        - { name: collaboratorId, in: query, required: true, schema: { type: integer, minimum: 1 } }
        - { name: currency, in: query, schema: { type: string, maxLength: 50 }, description: Just this internal currency. }
        - name: excludeReference
          in: query
          schema: { $ref: '#/components/schemas/HoldReference' }
      responses:
        '200':
          description: The balances.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/CreditBalance' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /credit-entries:
    get:
      tags: [Credits]
      operationId: listCreditEntries
      summary: List store credit ledger entries
      description: |
        A query must name `collaboratorId` or `idempotencyKey`, so it never
        lists a whole organization's ledger. Every filter is an exact match.
        Only Siren writes the ledger.
      parameters:
        - { $ref: '#/components/parameters/Number' }
        - { $ref: '#/components/parameters/Offset' }
        - { $ref: '#/components/parameters/Order' }
        - { name: orderBy, in: query, schema: { type: string, enum: [id, dateCreated, amount], default: id } }
        - { name: collaboratorId, in: query, schema: { type: integer } }
        - { name: currency, in: query, schema: { type: string } }
        - { name: sourceType, in: query, schema: { type: string } }
        - { name: sourceId, in: query, schema: { type: string } }
        - { name: description, in: query, schema: { type: string } }
        - { name: idempotencyKey, in: query, schema: { type: string } }
      responses:
        '200': { $ref: '#/components/responses/PaginatedList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /credit-holds:
    get:
      tags: [Credits]
      operationId: listCreditHolds
      summary: List store credit holds
      description: |
        A query must name `collaboratorId`, `reference` or `idempotencyKey`.
        Every filter is an exact match. A connected site reads only the holds
        its own checkouts placed, and their references come back with its
        Property, as in `hold:woocommerce@property:5:{token}`.
      parameters:
        - { $ref: '#/components/parameters/Number' }
        - { $ref: '#/components/parameters/Offset' }
        - { $ref: '#/components/parameters/Order' }
        - { name: orderBy, in: query, schema: { type: string, enum: [id, dateCreated, expiresAt], default: id } }
        - { name: collaboratorId, in: query, schema: { type: integer } }
        - { name: currency, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string, enum: [active, settled, released, expired] } }
        - { name: reference, in: query, schema: { $ref: '#/components/schemas/HoldReference' } }
        - { name: idempotencyKey, in: query, schema: { type: string } }
      responses:
        '200': { $ref: '#/components/responses/PaginatedList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
    post:
      tags: [Credits]
      operationId: placeCreditHold
      summary: Reserve store credit for a checkout
      description: |
        Placing again for the same token and currency replaces that session's
        hold. The hold's `amount` may be lower than asked, because Siren caps
        it at the credit available outside this session's own hold. A hold
        lapses at its `ttl`, the site can release it early with
        `DELETE /credit-holds/{id}`, and Siren settles it when the order's
        redemption arrives as an event.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [collaboratorId, currency, amount, token, platformId]
              properties:
                collaboratorId: { type: integer, minimum: 1 }
                currency: { type: string, description: An internal custom currency code. }
                amount: { type: integer, minimum: 1, description: Minor units. }
                token: { $ref: '#/components/schemas/SiteName', description: 'The checkout session, at most 120 characters.' }
                platformId: { $ref: '#/components/schemas/SiteName', description: 'The commerce platform, such as woocommerce. Plain. Cloud adds the Property (`@property:5`) and then allows at most 60 characters, suffix included.' }
                ttl: { type: integer, minimum: 60, maximum: 3600, default: 1800 }
      responses:
        '201':
          description: Placed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreditHold' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: |
            No credit is available in that currency (`error.code`
            `hold_no_credit`), or another site's checkout already holds
            credit for this collaborator and currency under the same token
            (`hold_token_in_use`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429':
          description: |
            The site spent its request budget (with `Retry-After`). Siren no
            longer caps how many checkouts hold a collaborator's credit, so it
            never sends `hold_limit`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /credit-holds/{id}:
    delete:
      tags: [Credits]
      operationId: releaseCreditHold
      summary: Release a store credit hold early
      description: |
        Releases one hold, so the credit it reserved is available again. Call
        it only when the shopper abandons the credit, or it no longer applies
        to a cart that never became an order. Never release the hold of a
        checkout that became an order: settlement consumes that hold, and
        releasing it first lets another checkout spend the same credit.
        A hold that already ended (released, expired or settled) comes back
        unchanged with 200, so a retry is safe. A connected site may release
        only holds its own checkouts placed, and any other id answers 404.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        '200':
          description: The hold, now released, or as it was when it had already ended.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreditHold' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /mappings:
    get:
      tags: [Mappings]
      operationId: listMappings
      summary: Find links to records outside Siren
      description: |
        A query must name a type. A connected site must name `externalType`,
        reads only its own namespace, and may never use the `user` type.
      parameters:
        - { $ref: '#/components/parameters/Number' }
        - { $ref: '#/components/parameters/Offset' }
        - { $ref: '#/components/parameters/Order' }
        - { name: orderBy, in: query, schema: { type: string, enum: [localId, externalId, localType, externalType], default: localId } }
        - { name: localId, in: query, schema: { type: integer } }
        - { name: localType, in: query, schema: { $ref: '#/components/schemas/SiteName' }, example: collaborator }
        - { name: externalId, in: query, schema: { type: string } }
        - { name: externalType, in: query, schema: { $ref: '#/components/schemas/SiteName' }, example: wordpress_user }
      responses:
        '200': { $ref: '#/components/responses/PaginatedList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
    post:
      tags: [Mappings]
      operationId: createMapping
      summary: Link a collaborator to an outside record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [localId, localType, externalId, externalType]
              properties:
                localId: { type: integer, minimum: 1, description: A collaborator id. }
                localType: { type: string, enum: [collaborator] }
                externalId: { type: string }
                externalType: { $ref: '#/components/schemas/SiteName' }
      responses:
        '201':
          description: Linked.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Mapping' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The link already exists (`error.code` `mapping_exists`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    delete:
      tags: [Mappings]
      operationId: deleteMappings
      summary: Remove collaborator links
      description: |
        Send `localId`, or `externalId` with its `externalType`. A connected
        site always sends `externalType`.
      parameters:
        - { name: localType, in: query, required: true, schema: { type: string, enum: [collaborator] } }
        - { name: localId, in: query, schema: { type: integer, minimum: 1 } }
        - { name: externalId, in: query, schema: { type: string } }
        - { name: externalType, in: query, schema: { $ref: '#/components/schemas/SiteName' } }
      responses:
        '200': { $ref: '#/components/responses/Deleted' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /configs:
    get:
      tags: [Settings]
      operationId: listSharedConfigs
      summary: Read the settings shared with a connected site
      description: |
        Only named settings leave Cloud. Today that is `collaborator` /
        `urlReference` / `key`, the referral link's query parameter.
      parameters:
        - { $ref: '#/components/parameters/Number' }
        - { $ref: '#/components/parameters/Offset' }
        - { $ref: '#/components/parameters/Order' }
        - { name: orderBy, in: query, schema: { type: string, enum: [type, subtype, configKey], default: type } }
        - { name: type, in: query, required: true, schema: { type: string, enum: [collaborator] } }
        - { name: subtype, in: query, schema: { type: string }, example: urlReference }
        - { name: configKey, in: query, schema: { type: string }, example: key }
      responses:
        '200': { $ref: '#/components/responses/PaginatedList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /oauth/register:
    post:
      tags: [OAuth]
      operationId: registerOAuthClient
      summary: Register a connected site's OAuth client
      description: |
        RFC 7591 dynamic registration. A site registers once, before it sends
        the merchant to the consent screen, and keeps the `client_id` it gets
        back. Each registration makes a new client, so the SDK sends it once.
        `scope` defaults to the connected-site scopes. A client that sends no
        `software_id` registers as the WordPress connector.

        A refusal is a 400 with the RFC 7591 error envelope, `error` and
        `error_description`, such as `invalid_redirect_uri`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [client_name, redirect_uris]
              properties:
                client_name: { type: string, maxLength: 200, description: The store's name. Cloud names the Property after it. }
                redirect_uris:
                  type: array
                  maxItems: 10
                  description: https URIs, or http on `localhost`, `127.0.0.1` or `[::1]`.
                  items: { type: string, format: uri }
                scope:
                  type: string
                  description: Space-separated scopes.
                  example: 'connect:* connect:webhooks connect:records:read connect:records:write'
                software_id: { type: string, enum: [siren-wordpress, siren-medusa] }
      responses:
        '201':
          description: The client is registered.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OAuthClientRegistration' }
        '400': { $ref: '#/components/responses/OAuthRefused' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /oauth/token:
    post:
      tags: [OAuth]
      operationId: requestOAuthToken
      summary: Exchange a code or refresh a token
      description: |
        RFC 6749 token route. With `grant_type: authorization_code` it
        exchanges the callback's single-use code and the PKCE verifier for a
        token pair. With `grant_type: refresh_token` it spends the refresh
        token for a new pair, and Cloud rotates the refresh token every time.

        Cloud answers a repeat of a rotated refresh token for 30 seconds. A
        repeat that carries the same `attempt_id` gets the pair Cloud already
        issued. A repeat after 30 seconds makes Cloud revoke the whole token
        family. The SDK sends each call once, and the store locks its own
        refresh. After a lost answer, a 429 or a 5xx the store may resend a
        refresh once, at once, with the same `attempt_id`.

        A refusal is a 400 or 401 with the RFC 6749 error envelope, `error`
        and `error_description`. A refresh refused with `invalid_grant` or
        `invalid_client` means the grant is gone and the site connects again.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [grant_type, client_id]
              properties:
                grant_type: { type: string, enum: [authorization_code, refresh_token] }
                client_id: { type: string }
                code: { type: string, description: The callback's code. Single use. Required for `authorization_code`. }
                redirect_uri: { type: string, format: uri, description: The redirect URI the authorization request named. Required for `authorization_code`. }
                code_verifier: { type: string, description: The PKCE verifier whose S256 challenge the authorization request carried. Required for `authorization_code`. }
                refresh_token: { type: string, description: Required for `refresh_token`. }
                attempt_id: { type: string, description: A random id for one refresh, sent again unchanged on each try of it. }
      responses:
        '200':
          description: A new token pair.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OAuthToken' }
        '400': { $ref: '#/components/responses/OAuthRefused' }
        '401': { $ref: '#/components/responses/OAuthRefused' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /connect/plan:
    get:
      tags: [Connected sites]
      operationId: getConnectPlan
      summary: Read the organization's plan
      description: |
        The organization's plan, trial and capabilities. Cloud answers 503
        with code `plan_unavailable` when it cannot read billing, and the
        site keeps the plan it last read.
      security:
        - connectorToken: [connect:read]
      responses:
        '200':
          description: The plan.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConnectPlan' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503':
          description: Cloud could not read the plan. `error.code` is `plan_unavailable`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /connect/update-grant:
    post:
      tags: [Connected sites]
      operationId: issueConnectUpdateGrant
      summary: Sign a grant for a paid build
      description: |
        A short-lived signed grant the site's updater sends to fetch a paid
        build. Each call signs a new grant and records nothing. No body.
      security:
        - connectorToken: [connect:read]
      responses:
        '200':
          description: The grant.
          content:
            application/json:
              schema:
                type: object
                required: [grant, expiresAt, expiresIn]
                properties:
                  grant: { type: string }
                  expiresAt: { type: integer, description: Unix time. }
                  expiresIn: { type: integer, description: Seconds. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /connect/site-state:
    put:
      tags: [Connected sites]
      operationId: reportConnectedSiteState
      summary: Report the site's forwarding and migration state
      security:
        - connectorToken: [connect:read]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [forwarding]
              properties:
                forwarding: { type: boolean }
                cutOverAt: { type: [integer, 'null'], description: Unix time, 2020 or later. }
                localDataDeletedAt: { type: [integer, 'null'], description: Unix time, 2020 or later. }
                migrationComplete: { type: boolean, description: Closes the site's migration window. }
      responses:
        '200':
          description: The state Cloud now holds.
          content:
            application/json:
              schema:
                type: object
                required: [reported, forwarding, cutOverAt, localDataDeletedAt]
                properties:
                  reported: { type: boolean, const: true }
                  forwarding: { type: boolean }
                  cutOverAt: { type: [integer, 'null'] }
                  localDataDeletedAt: { type: [integer, 'null'] }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /connect/disconnect:
    post:
      tags: [Connected sites]
      operationId: disconnectConnectedSite
      summary: Disconnect the site
      description: |
        Revokes the site's client, its tokens and its webhook. No body. Cloud
        cuts the client off as the disconnect commits, so a resend after a
        lost answer gets 401, and the site treats that as disconnected.
      security:
        - connectorToken: [connect:read]
      responses:
        '200':
          description: The site is disconnected.
          content:
            application/json:
              schema:
                type: object
                required: [disconnected, clientRevoked, tokensRevoked, webhooksRemoved]
                properties:
                  disconnected: { type: boolean, const: true }
                  clientRevoked: { type: boolean }
                  tokensRevoked: { type: integer }
                  webhooksRemoved: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /connect/integrations:
    put:
      tags: [Connected sites]
      operationId: replaceConnectedSiteIntegrations
      summary: Report the site's integrations
      description: The whole list, up to 50, replaces the one Cloud held.
      security:
        - connectorToken: [connect:records:write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [integrations]
              properties:
                integrations:
                  type: array
                  maxItems: 50
                  items:
                    type: object
                    required: [id]
                    properties:
                      id: { type: string, pattern: '^[A-Za-z0-9._-]+$' }
                      name: { type: string }
                      supports:
                        type: array
                        description: Feature values such as `coupons`, `customers` and `products`. Cloud drops values it does not know.
                        items: { type: string }
      responses:
        '204':
          description: The list is replaced. No body.
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /connect/products:
    put:
      tags: [Connected sites]
      operationId: syncConnectedStoreProducts
      summary: Sync the store's products
      description: |
        Upserts and removes up to 200 products a call. To end a full sync,
        send the `serverTime` an earlier answer gave as `pruneBefore`, and
        Cloud removes every product the sync did not touch.
      security:
        - connectorToken: [connect:records:write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [platform]
              properties:
                platform: { type: string, example: medusa }
                products:
                  type: array
                  maxItems: 200
                  items:
                    type: object
                    required: [id]
                    properties:
                      id: { type: [string, integer] }
                      parentId: { type: [string, integer, 'null'] }
                      name: { type: [string, 'null'] }
                      sku: { type: [string, 'null'] }
                      type: { type: [string, 'null'] }
                      status: { type: [string, 'null'] }
                      editUrl: { type: [string, 'null'], format: uri }
                removed:
                  type: array
                  maxItems: 200
                  items: { type: [string, integer] }
                pruneBefore: { type: [integer, 'null'] }
      responses:
        '200':
          description: What the call changed.
          content:
            application/json:
              schema:
                type: object
                required: [upserted, skipped, removed, pruned, serverTime]
                properties:
                  upserted: { type: integer }
                  skipped: { type: integer }
                  removed: { type: integer }
                  pruned: { type: integer }
                  serverTime: { type: integer, description: Unix time by Cloud's clock. }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /connect/migration-window:
    get:
      tags: [Connected sites]
      operationId: getMigrationWindow
      summary: Read the site's migration window
      security:
        - connectorToken: [connect:migrate]
      responses:
        '200':
          description: Whether the site may still migrate, and until when.
          content:
            application/json:
              schema:
                type: object
                required: [open, closesAt]
                properties:
                  open: { type: boolean }
                  closesAt: { type: [integer, 'null'], description: Unix time. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /connect/customer-email-key:
    get:
      tags: [Connected sites]
      operationId: getCustomerEmailKey
      summary: Read the customer email key
      description: |
        The HMAC key the site hashes customer emails with. Cloud sends it
        with `Cache-Control: no-store`. Never log it.
      security:
        - connectorToken: [connect:records:read]
      responses:
        '200':
          description: The key.
          content:
            application/json:
              schema:
                type: object
                required: [keyId, secret]
                properties:
                  keyId: { type: string }
                  secret: { type: string, contentEncoding: base64, description: At least 16 bytes, standard base64. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /connect/webhook:
    put:
      tags: [Connected sites]
      operationId: replaceConnectorWebhook
      summary: Create or replace the site's webhook subscription
      description: |
        Creates the subscription (201) or replaces it (200). Either way the
        answer carries a new signing secret, shown only here, so each call
        rotates the secret.
      security:
        - connectorToken: [connect:webhooks]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [targetUrl, events]
              properties:
                targetUrl: { type: string, format: uri }
                events:
                  type: array
                  maxItems: 100
                  items: { $ref: '#/components/schemas/WebhookEventType' }
      responses:
        '200':
          description: The subscription is replaced.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConnectorWebhookWithSecret' }
        '201':
          description: The subscription is created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConnectorWebhookWithSecret' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    get:
      tags: [Connected sites]
      operationId: getConnectorWebhook
      summary: Read the site's webhook subscription
      security:
        - connectorToken: [connect:webhooks]
      responses:
        '200':
          description: The subscription.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConnectorWebhook' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Connected sites]
      operationId: deleteConnectorWebhook
      summary: Delete the site's webhook subscription
      description: |
        A repeat removes nothing more. `deleted: false` means the site had no
        webhook left to remove, which is also what a retry after a lost answer
        meets, so it counts as success.
      security:
        - connectorToken: [connect:webhooks]
      responses:
        '200':
          description: The subscription is gone.
          content:
            application/json:
              schema:
                type: object
                required: [deleted]
                properties:
                  deleted: { type: boolean }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /connect/webhook/test:
    post:
      tags: [Connected sites]
      operationId: testConnectorWebhook
      summary: Send one signed test delivery
      description: |
        Cloud signs one test delivery to the site and reports what the site
        answered. Cloud allows ten tests a site an hour.
      security:
        - connectorToken: [connect:webhooks]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nonce]
              properties:
                nonce: { type: string, pattern: '^[A-Za-z0-9_-]{16,128}$' }
      responses:
        '200':
          description: What the site answered.
          content:
            application/json:
              schema:
                type: object
                required: [delivered, httpStatus, error]
                properties:
                  delivered: { type: boolean }
                  httpStatus: { type: [integer, 'null'] }
                  error: { type: [string, 'null'] }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /connect/webhook/deliveries:
    get:
      tags: [Connected sites]
      operationId: listConnectorWebhookDeliveries
      summary: List deliveries to the site's subscription
      security:
        - connectorToken: [connect:webhooks]
      responses:
        '200':
          description: The deliveries, newest first.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ConnectorWebhookDelivery' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # Conventions in this file
  # - `x-siren-auth` states who may call a route. Keys: `people` (a signed-in
  #   person), `apiKey` (scopes, or none), `connectorSite` (a connected site's
  #   token), `capability` and `plan` (the plan gate), `role` (the role check).
  # - `x-unconfirmed: true` marks a field or answer read from code only, with no
  #   test that asserts it. The comment above it says why.
  # - Error envelope. On Siren Cloud a RestException answers
  #   `{"error": {"message", "code"?, "context"}}` (saas/Strategies/RestStrategy.php
  #   lines 258-283). A route that calls `$response->setError()` answers
  #   `{"error": "<sentence>"}`, a plain string (saas/Http/Response.php line 110).
  #   Enroller 404, 422, 500 answers are the string form. Condition set refusals,
  #   page-size and validation refusals, the plan refusal and the enroller 409
  #   are the object form. The WordPress strategy is not in this repository, so
  #   the WordPress envelope is x-unconfirmed. The integration tests run a
  #   test strategy that flattens `context` to the top level, so a test body
  #   differs from a Cloud body.

  /condition-sets:
    get:
      tags: [Condition Sets]
      operationId: listConditionSets
      summary: List condition sets
      description: |
        The organization's condition sets, archived ones included, oldest
        first, as a bare array. The list is not paged and carries no
        `x-siren-estimated-count` header and no envelope. With `usedBy=1` each
        set also carries `usedBy`, which costs each registered use lister one
        read per set.

        A person signed in only. An API key is refused (401
        `api_key_not_accepted`), and no connected-site token route lists it.
        The plan must include `audience-conditions` (Plus and up on Siren
        Cloud, and WordPress never refuses a capability). The person must be
        allowed to read programs. A collaborator is refused with 403.
        Source: lib/Plus/Service/ConditionSets/Rest/ListConditionSets.php.
      x-siren-auth:
        people: true
        apiKey: false
        connectorSite: false
        capability: audience-conditions
        plan: plus
        role: read on programs
      security:
        - dashboardSession: []
      parameters:
        - name: usedBy
          in: query
          description: |
            `1` or `true` adds `usedBy` to each set. Any other value, or none,
            leaves it out. Read as a string compare against `1` and `true`
            with no validation, so other values are ignored and never refused.
          schema: { type: string, enum: ['1', 'true'] }
      responses:
        '200':
          description: Every set, oldest first. An organization with none gets `[]`.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ConditionSet' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/ConditionSetForbidden' }
        '500': { $ref: '#/components/responses/ConditionSetServerError' }

  /condition-sets/conditions:
    get:
      tags: [Condition Sets]
      operationId: listConditionSetConditions
      summary: List the conditions a set can use
      description: |
        Every registered condition in registration order, as a bare array. An
        editor builds its cards from it. The shared conditions come first,
        then the ones the Plus enrollers register (the integration test
        asserts the ids and their order). The catalog holds collaborator
        conditions only, never a team-member condition.

        Same auth as `GET /condition-sets`: a person only, plan capability
        `audience-conditions`, read on programs.
        Source: lib/Plus/Service/ConditionSets/Rest/ListConditions.php.
      x-siren-auth:
        people: true
        apiKey: false
        connectorSite: false
        capability: audience-conditions
        plan: plus
        role: read on programs
      security:
        - dashboardSession: []
      responses:
        '200':
          description: The catalog.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ConditionDefinition' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/ConditionSetForbidden' }
        '500': { $ref: '#/components/responses/ConditionSetServerError' }

  /condition-sets/{id}:
    get:
      tags: [Condition Sets]
      operationId: getConditionSet
      summary: Get one condition set
      description: |
        One set as the list shows it. An archived set answers too, with its
        `archivedAt`. The path takes digits only (`(?P<id>\d+)`), so a
        non-numeric id matches no route and answers 404 `Not found.` from the
        router, not the sentence below.

        Same auth as `GET /condition-sets`.
        Source: lib/Plus/Service/ConditionSets/Rest/GetConditionSet.php.
      x-siren-auth:
        people: true
        apiKey: false
        connectorSite: false
        capability: audience-conditions
        plan: plus
        role: read on programs
      security:
        - dashboardSession: []
      parameters:
        - { $ref: '#/components/parameters/ConditionSetId' }
      responses:
        '200':
          description: The set.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConditionSet' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/ConditionSetForbidden' }
        '404': { $ref: '#/components/responses/ConditionSetNotFound' }
        '500': { $ref: '#/components/responses/ConditionSetServerError' }

  /condition-sets/{id}/uses:
    get:
      tags: [Condition Sets]
      operationId: listConditionSetUses
      summary: List what uses a condition set
      description: |
        What uses the set, for its page's "Used by" and before an archive.
        `usedBy` is every record the registered use listers name. `uses` is
        the rule ids by consumer id, as a refused delete answers them, and it
        also holds a use that only the usage event reported (such a use has no
        entry in `usedBy`). `uses` is always a JSON object, `{}` when empty.

        Same auth as `GET /condition-sets`.
        Source: lib/Plus/Service/ConditionSets/Rest/ListConditionSetUses.php.
      x-siren-auth:
        people: true
        apiKey: false
        connectorSite: false
        capability: audience-conditions
        plan: plus
        role: read on programs
      security:
        - dashboardSession: []
      parameters:
        - { $ref: '#/components/parameters/ConditionSetId' }
      responses:
        '200':
          description: The uses.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConditionSetUses' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/ConditionSetForbidden' }
        '404': { $ref: '#/components/responses/ConditionSetNotFound' }
        '500': { $ref: '#/components/responses/ConditionSetServerError' }

  /condition-sets/{id}/matches:
    get:
      tags: [Condition Sets]
      operationId: countConditionSetMatches
      summary: Count who matches a condition set now
      description: |
        How many collaborators match the set now, counted up to a cap
        (`ConditionSetMatches::COUNT_CAP`, whose value this fragment did not
        read). `more` is true when the count stopped at the cap. The cap
        keeps one request from costing a whole check on a large organization.

        Same auth as `GET /condition-sets`.
        Source: lib/Plus/Service/ConditionSets/Rest/GetConditionSetMatchCount.php.
      x-siren-auth:
        people: true
        apiKey: false
        connectorSite: false
        capability: audience-conditions
        plan: plus
        role: read on programs
      security:
        - dashboardSession: []
      parameters:
        - { $ref: '#/components/parameters/ConditionSetId' }
      responses:
        '200':
          description: The count.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConditionSetMatchCount' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/ConditionSetForbidden' }
        '404': { $ref: '#/components/responses/ConditionSetNotFound' }
        '409': { $ref: '#/components/responses/ConditionSetUnreadable' }
        '500': { $ref: '#/components/responses/ConditionSetServerError' }

  /condition-sets/{id}/people:
    get:
      tags: [Condition Sets]
      operationId: listConditionSetPeople
      summary: List who matches a condition set now
      description: |
        One page of the collaborators who match the set now, judged live. The
        route walks pages from `cursor` until it has `limit` matches or has
        tested 5 pages (`MAX_PAGES`), whatever the organization's size. It
        answers at most `limit` ids, lowest first. When a tested page holds
        more matches than `limit`, the extra ids are dropped and `nextCursor`
        is the last id returned. `nextCursor` is null at the end. The list is
        not enveloped, has no `number`/`offset`, and sends no
        `x-siren-estimated-count` header.

        Same auth as `GET /condition-sets`.
        Source: lib/Plus/Service/ConditionSets/Rest/ListConditionSetPeople.php.
      x-siren-auth:
        people: true
        apiKey: false
        connectorSite: false
        capability: audience-conditions
        plan: plus
        role: read on programs
      security:
        - dashboardSession: []
      parameters:
        - { $ref: '#/components/parameters/ConditionSetId' }
        - name: cursor
          in: query
          description: |
            Where to start: the id of the last collaborator already seen, as a
            previous `nextCursor` gave it. A value below 0 reads as 0. It is
            cast to an integer with no validation, so text reads as 0 and is
            never refused. Absent starts at the beginning.
          schema: { type: integer, minimum: 0 }
        - name: limit
          in: query
          description: |
            Matches to return. A value above 25 is lowered to 25 and a value
            below 1 is raised to 1 (the test sends 0 and gets one id). It is
            cast to an integer with no validation, so text reads as 0, then 1.
            Whether 500 is lowered to 25 is x-unconfirmed by a test, because
            the test org holds only two people.
          schema: { type: integer, minimum: 1, maximum: 25, default: 25 }
      responses:
        '200':
          description: One page of matching collaborator ids.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConditionSetPeoplePage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/ConditionSetForbidden' }
        '404': { $ref: '#/components/responses/ConditionSetNotFound' }
        '409':
          description: |
            `context.type` is `condition_set_unreadable` when the set cannot
            be judged (test: ConditionSetRoutesFlowTest, on the matches route,
            which shares this refusal), or `condition_set_changed` when the
            set's conditions changed during the walk (code only, so
            x-unconfirmed on this route). Try the second again.
          x-unconfirmed: true
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500': { $ref: '#/components/responses/ConditionSetServerError' }

  /enrollers:
    get:
      tags: [Enrollers]
      operationId: listEnrollers
      summary: List enrollers
      description: |
        The organization's enrollers, oldest first by default, in Siren's list
        envelope with the total also in `x-siren-estimated-count`. Each item
        carries `needsFix`, why its stored settings need a fix in a manager's
        words, or null.

        `placeType` with `placeId` lists the enrollers that name that place in
        the add list or the remove list of its kind, whatever their status. A
        place the organization does not hold answers an empty page. `triggerId`
        lists the enrollers that start on that moment. With it, `setting` and
        `settingId` list only those whose stored settings hold that id under
        that key. Both pairs must be sent together, and `setting` needs
        `triggerId`. With `setting`, the route reads every row of that moment
        and pages in memory, and the header counts the matches.

        Needs read on enrollers. There is no plan gate, so an organization
        whose plan dropped below Plus still lists its enrollers. On Siren
        Cloud an API key needs `records:enrollers:read` or
        `records:enrollers:manage`. A collaborator is refused with 403. Any
        staff role may read (the integration test checks every staff role).
        No connected-site route lists enrollers (x-unconfirmed: the absence
        from the connector allow list is the only evidence).
        Source: lib/Plus/Service/Enrollers/Rest/ListEnrollers.php.
      x-siren-auth:
        people: true
        apiKey: ['records:enrollers:read', 'records:enrollers:manage']
        connectorSite: false
        capability: null
        plan: none
        role: read on enrollers (every staff role)
      security:
        - dashboardSession: []
        - apiKey: ['records:enrollers:read']
        - apiKey: ['records:enrollers:manage']
      parameters:
        - { $ref: '#/components/parameters/Number' }
        - { $ref: '#/components/parameters/Offset' }
        - name: orderBy
          in: query
          description: A stored column. `enabled` sorts by `status`. Any other value answers 400 `Validations failed.`.
          schema:
            type: string
            enum: [id, name, status, enabled, triggerId, dateCreated, dateModified]
            default: id
        - name: order
          in: query
          description: Sort direction, in either case.
          schema: { type: string, enum: [ASC, DESC, asc, desc], default: ASC }
        - name: status
          in: query
          description: |
            One status, or several joined by commas (`draft,active`). A value
            that is not `draft`, `active` or `inactive`, or an empty list,
            answers 400 `Validations failed.`.
          schema: { type: string, examples: ['active', 'draft,active'] }
        - name: placeType
          in: query
          description: Sent with `placeId`. Sending one without the other answers 400.
          schema: { type: string, enum: [program, distributor, collaborator_group] }
        - name: placeId
          in: query
          description: Sent with `placeType`. A whole number from 1.
          schema: { type: integer, minimum: 1 }
        - name: triggerId
          in: query
          description: A moment's id, as `GET /enroller-triggers` gives it. 1 to 100 characters.
          schema: { type: string, minLength: 1, maxLength: 100 }
        - name: setting
          in: query
          description: |
            A setting key, 1 to 40 characters. Needs `settingId` and
            `triggerId`.
          schema: { type: string, minLength: 1, maxLength: 40 }
        - name: settingId
          in: query
          description: Sent with `setting`. A whole number from 1.
          schema: { type: integer, minimum: 1 }
      responses:
        '200':
          description: One page of enrollers.
          headers:
            x-siren-estimated-count:
              schema: { type: integer }
              description: |
                Enrollers across all pages that match the filters. With no
                filter it is the table's estimated count.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnrollerPage' }
        '400':
          description: |
            `number` or `offset` out of range (`context.param` names it and
            the message reads `number must be a whole number from 1 to 200.`
            or `offset must be a whole number, 0 or greater.`), or a filter
            failed validation (message `Validations failed.`, with
            `context.failedValidations` naming each field).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /enrollers/{id}:
    get:
      tags: [Enrollers]
      operationId: getEnroller
      summary: Get one enroller
      description: |
        One enroller with every field flat under the names a save takes, plus
        `needsFix` and `applyWaiting`. A target whose record was deleted is left
        out of its list. `triggerArgs` is always a JSON object.

        The path takes any word, and the id is cast to an integer, so a
        non-numeric id reads as 0 and answers 404.

        Same auth as `GET /enrollers`: no plan gate, read on enrollers.
        Source: lib/Plus/Service/Enrollers/Rest/GetEnroller.php.
      x-siren-auth:
        people: true
        apiKey: ['records:enrollers:read', 'records:enrollers:manage']
        connectorSite: false
        capability: null
        plan: none
        role: read on enrollers (every staff role)
      security:
        - dashboardSession: []
        - apiKey: ['records:enrollers:read']
        - apiKey: ['records:enrollers:manage']
      parameters:
        - { $ref: '#/components/parameters/EnrollerId' }
      responses:
        '200':
          description: The enroller.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnrollerDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/EnrollerNotFound' }

  /enrollers/{id}/log:
    get:
      tags: [Enrollers]
      operationId: listEnrollerLog
      summary: List an enroller's log
      description: |
        The enroller's log, newest first by id, in Siren's list envelope with
        the total in `x-siren-estimated-count`. The order is fixed. Each line
        carries a finished `message` in a manager's words and `happenedAt`.
        `?number=1` answers when the enroller last fired, as
        `items[0].happenedAt`. An enroller with no rows answers an empty page.

        Same auth as `GET /enrollers`: no plan gate, read on enrollers.
        Source: lib/Plus/Service/Enrollers/Rest/ListEnrollerFirings.php.
      x-siren-auth:
        people: true
        apiKey: ['records:enrollers:read', 'records:enrollers:manage']
        connectorSite: false
        capability: null
        plan: none
        role: read on enrollers (every staff role)
      security:
        - dashboardSession: []
        - apiKey: ['records:enrollers:read']
        - apiKey: ['records:enrollers:manage']
      parameters:
        - { $ref: '#/components/parameters/EnrollerId' }
        - { $ref: '#/components/parameters/Number' }
        - { $ref: '#/components/parameters/Offset' }
      responses:
        '200':
          description: One page of log lines.
          headers:
            x-siren-estimated-count:
              schema: { type: integer }
              description: The enroller's log rows across all pages.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnrollerLogPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/EnrollerNotFound' }
        '500':
          description: |
            `{"error": "Something went wrong reading the enroller's log."}`.
            Code only, so x-unconfirmed.
          x-unconfirmed: true
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /enrollers/{id}/run-now:
    get:
      tags: [Enrollers]
      operationId: countEnrollerRunNow
      summary: Count what running an enroller now would do
      description: |
        What a run over the people who match the enroller's condition set now
        would do. It moves nobody and writes nothing. People can start or stop
        matching before a real run reaches them, so every screen says
        "about". The count looks at up to 5000 people (`ESTIMATE_CAP`), and
        `capped` says it stopped there.

        The plan gate comes first (`enrollers`, Plus and up), then update on
        enrollers, since the count is the first step of a write. A viewer is
        refused with 403, and a program manager may call it (integration
        test). An API key needs `records:enrollers:manage`, and the read
        scope is not enough.
        Source: lib/Plus/Service/Enrollers/Rest/GetEnrollerRunEstimate.php.
      x-siren-auth:
        people: true
        apiKey: ['records:enrollers:manage']
        connectorSite: false
        capability: enrollers
        plan: plus
        role: update on enrollers
      security:
        - dashboardSession: []
        - apiKey: ['records:enrollers:manage']
      parameters:
        - { $ref: '#/components/parameters/EnrollerId' }
      responses:
        '200':
          description: The count.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnrollerRunEstimate' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/EnrollerWriteForbidden' }
        '404': { $ref: '#/components/responses/EnrollerNotFound' }
        '422': { $ref: '#/components/responses/EnrollerCannotRun' }
        '500':
          description: |
            `{"error": "Something went wrong counting who this enroller would
            move."}`. Nothing is written. Code only, so x-unconfirmed.
          x-unconfirmed: true
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    post:
      tags: [Enrollers]
      operationId: startEnrollerRunNow
      summary: Run an enroller now
      description: |
        Starts a run over the people who match the enroller's condition set
        now, or joins the run already queued or running. The request moves
        nobody. It queues a job (read its progress from `GET /jobs/{jobId}`)
        and answers 202. An enroller that waits for its set's first check
        joins that wait and answers 202 with `jobId` null. The work runs in a
        unit of work, so a failed request queues nothing.

        Same auth as the count: plan gate `enrollers`, update on enrollers, and
        for an API key `records:enrollers:manage`. The request takes no body.
        Source: lib/Plus/Service/Enrollers/Rest/StartEnrollerRun.php.
      x-siren-auth:
        people: true
        apiKey: ['records:enrollers:manage']
        connectorSite: false
        capability: enrollers
        plan: plus
        role: update on enrollers
      security:
        - dashboardSession: []
        - apiKey: ['records:enrollers:manage']
      parameters:
        - { $ref: '#/components/parameters/EnrollerId' }
      responses:
        '202':
          description: The run is queued, joined, or waiting for the set's first check.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnrollerRunStarted' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/EnrollerWriteForbidden' }
        '404': { $ref: '#/components/responses/EnrollerNotFound' }
        '409':
          description: |
            The enroller is being deleted in the background. `context.type`
            is `ENROLLER_BEING_DELETED` and there is no `error.code`. The
            message is "This enroller is being deleted, so it can't be
            changed, made active, run or deleted again until that finishes.
            If the delete fails, it stays inactive and you can try again."
            (code in EnrollerBeingDeleted.php, and a test file,
            EnrollerBeingDeletedFlowTest, exists, but this fragment did not
            read its assertions, so x-unconfirmed.)
          x-unconfirmed: true
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/EnrollerCannotRun' }
        '500':
          description: |
            `{"error": "Something went wrong starting the run."}`. Code only,
            so x-unconfirmed.
          x-unconfirmed: true
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /enroller-triggers:
    get:
      tags: [Enrollers]
      operationId: listEnrollerTriggers
      summary: List the moments an enroller can start on
      description: |
        The triggers an enroller can use here, for the editor's picker, as
        `{items, buyers}`. It is not paged and not enveloped, and sends no
        count header. A trigger the registry holds is offered only when it
        names a collaborator or a store customer, so a team-only trigger is
        left out. An organization whose plan lacks `enrollers` gets
        `{"items": [], "buyers": <bool>}`, and the route itself has no plan
        gate. The path sits outside `/enrollers/` because on WordPress
        `GET /enrollers/{id}` matches any word.

        Needs read on enrollers. Same API key scopes as `GET /enrollers`.
        Source: lib/Plus/Service/Enrollers/Rest/ListEnrollerTriggers.php.
      x-siren-auth:
        people: true
        apiKey: ['records:enrollers:read', 'records:enrollers:manage']
        connectorSite: false
        capability: null
        plan: none
        role: read on enrollers (every staff role)
      security:
        - dashboardSession: []
        - apiKey: ['records:enrollers:read']
        - apiKey: ['records:enrollers:manage']
      responses:
        '200':
          description: The triggers.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnrollerTriggerList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

# ---------------------------------------------------------------------------
# Left out of this fragment, without schemas. Every other enroller or
# condition set route on main (59016aac), with its method and path.
#
# Condition sets (lib/Plus/Service/ConditionSets/Rest):
#   POST   /condition-sets                  create a set (CreateConditionSet)
#   PUT    /condition-sets/{id}             update, archive or restore a set, with `confirm` (UpdateConditionSet)
#   DELETE /condition-sets/{id}             delete a set (DeleteConditionSet)
#   POST   /condition-sets/matches          count who would match unsaved conditions (CountConditionMatches)
#
# Enrollers (lib/Plus/Service/Enrollers/Rest):
#   POST   /enrollers                       create an enroller (CreateEnroller)
#   PUT    /enrollers/{id}                  update an enroller (UpdateEnroller)
#   DELETE /enrollers/{id}                  delete an enroller, in the background when it holds people (DeleteEnroller)
#   GET    /enrollers/{id}/held             who a delete would ask about (ListEnrollerHeldPeople, per the ApiKeyRoutes comment)
#   GET    /enroller-conflicts              (ListEnrollerConflicts, class named only, not read)
#   GET    /enroller-loops                  (GetEnrollerLoops, class named only, not read)
#   GET    /collaborators/{id}/membership-history   a collaborator's memberships (ListCollaboratorMembershipHistory)
#   GET    /collaborators/{id}/enroller-log         a collaborator's enroller activity (ListCollaboratorEnrollerFirings)
# No undo route and no bulk route exists under these paths on main. API keys reach all the enroller routes above
# except the condition set ones, per saas/Auth/ApiKeyRoutes.php lines 153-171.
# Enroller route scopes: reads take records:enrollers:read or :manage, and
# create, update, delete and run-now take records:enrollers:manage.
#
# ---------------------------------------------------------------------------
# GET /collaborators: every query parameter main accepts. For the other
# session to fill that route's declaration. No schema. Read from
# lib/Collaborators/Rest/Service/GetCollaborators.php (GC) and the middleware
# it names. Middleware order (GC lines 260-275): read on collaborators,
# AutoFilterByOwnerMiddleware, DefaultFieldsMiddleware, ValidationMiddleware,
# FilterMiddleware, FieldResolverMiddleware, PageSizeMiddleware.
#
#  number     integer, default 10, below 1 or not a whole number answers 400
#             "number must be a whole number from 1 to 200.", above 200 is
#             lowered to 200. lib/Core/Service/Middlewares/PageSizeMiddleware.php
#             (process(), DEFAULT_PAGE_SIZE and MAX_PAGE_SIZE).
#  offset     integer, default 0. Two checks. ValidationMiddleware first
#             (GC lines 298-300): IsType Integer and IsGreaterThan -1, which
#             answers 400 "Validations failed.". Then PageSizeMiddleware:
#             a negative or non-whole value answers 400 "offset must be a
#             whole number, 0 or greater.".
#  orderBy    string, default id, one of id, status, fullName, nickname,
#             email, dateCreated, dateModified. Another value answers 400
#             "Validations failed.". GC line 74 (SORTABLE_COLUMNS) and 294-295.
#  order      string, default ASC, one of ASC, DESC, asc, desc. Another
#             value answers 400. GC lines 296-297.
#  fields     string, comma-separated field names. IsType String (GC lines
#             288-289). With none, DefaultFieldsMiddleware sends
#             id,status,fullName,nickname,email,createdDate,modifiedDate (GC
#             line 94, the DEFAULT_FIELDS constant). Which other fields exist
#             (aliases, referralCode, programs, distributors, creditBalances,
#             groups) is the field resolver registry's business and this
#             fragment did not read the registry, so the list is not
#             confirmed here. The field resolver drops a default it has no
#             resolver for.
#  id         exact filter (GC line 83, FILTERABLE_COLUMNS). A comma-separated
#             value is an IN list, items trimmed (lib/Core/Service/Middlewares/
#             FilterMiddleware.php lines 97-103). No type validation: values
#             are not checked as integers.
#  status     exact filter, same rules as id, including the comma list. Not
#             validated against the status words, so an unknown status lists
#             nothing and never answers 400.
#  fullName   exact filter, same rules. The comma rule applies, so a name that
#             holds a comma is split into an IN list (FilterMiddleware lines
#             97-103), which surprised me.
#  nickname   exact filter, same rules as fullName.
#  email      exact filter, same rules as fullName.
#  s          search. A non-empty value adds an OR group of LIKE %s% over
#             fullName, nickname and email (FilterMiddleware lines 115-126,
#             GC line 88 SEARCHABLE_COLUMNS), and GC lines 150-153 also
#             matches alias (tracking) codes through CollaboratorCodeSearch.
#             A value that is empty or `0` is ignored (the middleware tests
#             `!empty()`).
#  programId  integer. Lists collaborators enrolled in the program, through
#             the collaborator-programs junction table, answering no rows for
#             a program with none (GC lines 157-160 and 215-250). Where a
#             feature registers its own programId lookup (Plus collaborator
#             groups do, RegisterProgramGroupCollaboratorListFilter.php line
#             43) that lookup replaces it and also counts people who get the
#             program through a group. Cast with (int), no validation.
#  distributorId  integer, added by the distributions module
#             (RegisterDistributorCollaboratorListFilter.php line 35): the
#             collaborators the distributor covers. Cast with (int).
#  buyersOnly integer, added by the Plus enroller engine
#             (RegisterBuyerCollaboratorListFilter.php line 45): only the
#             records an enroller made for a purchase.
#  hideBuyers integer, same file line 46: leaves those records out, with one
#             `id NOT IN` clause. No effect when the lookup is empty.
# Each related-record param (programId, distributorId, buyersOnly,
# hideBuyers) is a no-op when the module that adds it is not loaded, and
# RelatedRecordFilterService.php lists every record when it is not sent.
# Response: bare list wrapped by ListResponseWrapperInterceptor as
# {items, total, page, perPage, totalPages}, with `x-siren-estimated-count`
# and `Access-Control-Expose-Headers` set (GC lines 178-179). The total is the
# table's estimated count when no filter is set, and a real count otherwise.
# A caller bound to its own record (a collaborator) sees only its own row,
# whatever it sends (AutoFilterByOwnerMiddleware).
components:
  securitySchemes:
    apiKey:
      type: http
      scheme: bearer
      bearerFormat: sk_live_...
      description: |
        An API key minted in the Siren dashboard or via createApiKey. Event
        scopes send events. The ledger scopes read conversions, transactions,
        obligations and payouts, and the webhook scopes read and manage
        webhook subscriptions. Each operation lists the scopes that open it,
        and holding any one listed requirement is enough. Every other route
        answers an API key with 401 `api_key_not_accepted`, the API key
        routes included. A key's requests count against the organization's
        API rate limit.
    dashboardSession:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        The access token of a person signed in to the Siren dashboard. Some
        routes need the admin role, and refuse other roles with a 403 whose
        code is `admin_required`.
    connectorToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        A connected site's OAuth access token, issued when an organization
        admin approves the site. The reconciliation routes take it when it
        holds `connect:records:read`. Each `/connect/*` route names the one
        `connect` scope it needs, and forwarded events need `connect:ingest`.
        `connect:*` grants `connect:read`, `connect:ingest` and
        `connect:migrate`. `connect:webhooks`, `connect:records:read` and
        `connect:records:write` are granted only by name.
  headers:
    XSirenOID:
      description: The opportunity (tracking) id associated with the event.
      schema: { type: integer }
    XSirenEstimatedCount:
      description: Total number of records across all pages.
      schema: { type: integer }
  parameters:
    Number:
      name: number
      in: query
      description: Page size. A value above 200 is lowered to 200. Below 1 is refused with 400.
      schema: { type: integer, minimum: 1, default: 10 }
    Offset:
      name: offset
      in: query
      description: The first row to return.
      schema: { type: integer, minimum: 0, default: 0 }
    Fields:
      name: fields
      in: query
      description: Comma-separated fields to return. Each list has a default set.
      schema: { type: string }
      example: id,status,dateCreated
    Order:
      name: order
      in: query
      schema: { type: string, enum: [ASC, DESC] }
    Search:
      name: s
      in: query
      description: A search term matched against the resource's text columns.
      schema: { type: string }
    Id:
      name: id
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    PropertyId:
      name: propertyId
      in: query
      description: |
        Narrows an organization-wide read to one store (Property). A key
        bound to one store reads only its own store's rows, whatever it
        sends here.
      schema: { type: integer, minimum: 1 }
    XSirenProperty:
      name: X-Siren-Property
      in: header
      description: The same one-store filter as `propertyId`, sent as a header.
      schema: { type: integer, minimum: 1 }
    ConditionSetId:
      name: id
      in: path
      required: true
      description: |
        The set's id. The route pattern takes digits only, so another value
        matches no route.
      schema: { type: integer, minimum: 1 }
    EnrollerId:
      name: id
      in: path
      required: true
      description: |
        The enroller's id. The route pattern takes any word and the id is cast
        to an integer, so a non-numeric id reads as 0 and answers 404.
      schema: { type: integer, minimum: 1 }

  schemas:
    SalePayload:
      type: object
      description: |
        A real sale requires `source`, `externalId`, `total` and `trackingId`.
        A test sale sends `test: true` and needs no other field.
      properties:
        source:
          type: string
          description: Commerce source identifier.
          example: stripe
        externalId:
          type: [string, number]
          minLength: 1
          maxLength: 32
          description: |
            Your order or transaction id, used to match refunds later. Siren
            also takes a number and stores it as text.
          example: cs_test_a1b2c3
        total:
          type: number
          minimum: 0
          maximum: 999999999.99
          description: Order total in major currency units.
          example: 49.99
        trackingId:
          type: integer
          minimum: 0
          description: Opportunity id from the Siren tracking cookie / attribution.
          example: 4021
        currency:
          type: string
          description: |
            A currency code the organization uses. Every line is recorded in
            it. Without it, the lines read as the organization's default
            currency. A code the organization does not use is refused with 400.
          example: USD
        items:
          type: array
          maxItems: 500
          items: { $ref: '#/components/schemas/LineItem' }
        test:
          type: boolean
          default: false
          description: |
            `true` records a test sale, to check an integration. Siren needs no
            other field, marks the sale as a test, counts it toward nothing and
            ignores `trackingId`. A repeat of a test reads as a pass.
      if:
        required: [test]
        properties:
          test: { const: true }
      else:
        required: [source, externalId, total, trackingId]
    LineItem:
      type: object
      required: [amount]
      properties:
        lineId:
          type: [string, number]
          minLength: 1
          maxLength: 191
          description: |
            Your id for this order line. Siren keeps it on the line, so a later
            refund can name the line by it in `RefundLine.lineId`. Siren stores
            a number as text.
          example: line-1
        externalId: { type: [string, number], maxLength: 255, description: 'Text, or a number that Siren stores as text.' }
        name: { type: [string, number], maxLength: 255, description: 'Text, or a number that Siren stores as text.', example: Pro Plan (annual) }
        quantity: { type: integer, minimum: 1, maximum: 1000000, default: 1 }
        amount:
          type: number
          minimum: 0
          maximum: 999999999.99
          description: Per-unit price in major currency units.
          example: 49.99
    SaleOutcome:
      type: object
      properties:
        status:
          type: string
          enum: [created, recorded, duplicate, unattributed, ignored]
        created: { type: boolean }
        transactionId: { type: [integer, 'null'] }
        conversions:
          type: array
          items:
            type: object
            properties:
              id: { type: integer }
              status: { type: string }
        message: { type: string }
        test: { type: boolean, const: true, description: Sent only on a test sale. }
        reason:
          type: string
          description: Why a recorded sale earned nothing.
          enum: [no_engagement, engagement_used, engagement_ended, not_awarded]
    SiteVisitOutcome:
      type: object
      properties:
        status:
          type: string
          enum: [attributed, recorded, not_attributed, queued]
        attributed: { type: boolean }
        queued: { type: boolean }
        opportunityId: { type: [integer, 'null'] }
        message: { type: string }
        reason:
          type: string
          enum: [collaborator_not_found, collaborator_not_active]
    QueuedOutcome:
      type: object
      properties:
        status: { type: string, const: queued }
        queued: { type: boolean, const: true }
        message: { type: string }
    RefundPayload:
      type: object
      required: [source, externalId, refundId]
      properties:
        source: { type: string, example: stripe }
        externalId: { type: [string, number], minLength: 1, maxLength: 32, example: cs_test_a1b2c3 }
        refundId:
          description: The store's own id for this refund, such as WooCommerce refund 2201. `externalId` names the order and `refundId` names one refund of it. Siren records each refund id once per order.
          type: [string, number]
          minLength: 1
          maxLength: 191
          example: re_3Nf8a2
        amount:
          type: number
          minimum: 0
          maximum: 999999999.99
          description: Money refunded, in major currency units (9.99 = $9.99). Sending it makes the refund partial unless `whole` is `true`.
          example: 20
        currency:
          type: string
          description: |
            A currency code the organization uses, for the amounts. When it is
            left out, Siren reads them in the sale's own currency, or else the
            organization's default.
          example: USD
        lines:
          type: array
          maxItems: 500
          description: The refunded order lines. Sending them makes the refund partial unless `whole` is `true`.
          items: { $ref: '#/components/schemas/RefundLine' }
        whole:
          type: boolean
          description: |
            `true` refunds the whole order, whatever else is sent. A refund
            with neither `amount` nor `lines` is also a whole refund.
        kind:
          type: string
          enum: [refund, cancelled, voided]
          default: refund
          description: How the whole order ended. Siren reads `refund` when it is left out.
    RefundLine:
      type: object
      description: |
        One refunded order line. Name the line by `lineId`, as the sale's item
        sent it, or by `sku`. Siren refuses a line that names neither.
      properties:
        lineId:
          type: [string, number]
          minLength: 1
          maxLength: 191
          description: The sale line's `lineId`. Siren stores a number as text.
          example: line-1
        sku:
          type: [string, number]
          minLength: 1
          maxLength: 191
          description: The product SKU of the line, when the sale sent no `lineId`.
        quantity:
          type: integer
          minimum: 0
          maximum: 1000000
          description: Units returned.
        amount:
          type: number
          minimum: 0
          maximum: 999999999.99
          description: Money refunded for this line, in major currency units.
          example: 20
    SiteVisitedPayload:
      type: object
      required: [collaboratorId]
      properties:
        collaboratorId:
          description: |
            The collaborator to attribute the visit to: their numeric id, or
            one of their tracking codes as `tracking:{code}`, such as
            `tracking:summer-sale`. Siren resolves the code to its collaborator.
          oneOf:
            - { type: integer }
            - { type: string, pattern: '^tracking:.+' }
          example: 88
        userId: { type: integer, example: 12345 }
    WebhookSubscription:
      type: object
      properties:
        id: { type: integer }
        targetUrl: { type: string, format: uri }
        urlValid:
          type: boolean
          description: Whether the stored URL passes the outbound URL rules. A URL that fails gets no deliveries.
        urlProblem: { type: [string, 'null'] }
        events:
          type: array
          items: { $ref: '#/components/schemas/WebhookEventType' }
        description: { type: string }
        status: { type: string, example: active }
        propertyId: { type: [integer, 'null'] }
        oauthClientId: { type: [string, 'null'] }
        dateCreated: { type: [string, 'null'] }
        dateModified: { type: [string, 'null'] }
    WebhookSubscriptionCreate:
      type: object
